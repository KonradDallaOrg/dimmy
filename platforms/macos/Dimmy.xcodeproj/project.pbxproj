			shellScript = "set -euo pipefail
# Ship the 885 KB Silero VAD model inside Dimmy.app/Contents/Resources.
# core/src/silero.rs looks in Contents/Resources on macOS (current_exe() is
# Contents/MacOS/Dimmy, so the model cannot sit next to the binary the way
# it does on Windows). Without this the Mac silently runs the weaker
# RNNoise+energy fallback with nothing in the log to notice.
# Bundled rather than downloaded: at 0.8% of the DMG a runtime fetch would
# only add a failure mode, and this way it carries the notarised signature.
SRC=\"$SRCROOT/../../core/assets/ggml-silero-v6.2.0.bin\"
DEST_DIR=\"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH\"
if [ ! -f \"$SRC\" ]; then
  echo \"warning: $SRC missing - the VAD gate will fall back to RNNoise\"
  exit 0
fi
mkdir -p \"$DEST_DIR\"
cp -f \"$SRC\" \"$DEST_DIR/ggml-silero-v6.2.0.bin\"
chmod 644 \"$DEST_DIR/ggml-silero-v6.2.0.bin\"
echo \"[silero] bundled $(basename \"$SRC\") into Resources\"
# GTCRN, same reasoning. Since 2026-08-10 it is the ONLY noise suppressor -
# the RNNoise stage upstream of AEC3 is gone - so a missing model here means
# the app ships with none, silently.
GTCRN_SRC=\"$SRCROOT/../../core/assets/gtcrn_simple.onnx\"
if [ ! -f \"$GTCRN_SRC\" ]; then
  echo \"warning: $GTCRN_SRC missing - the app will run with no noise suppression\"
  exit 0
fi
cp -f \"$GTCRN_SRC\" \"$DEST_DIR/gtcrn_simple.onnx\"
chmod 644 \"$DEST_DIR/gtcrn_simple.onnx\"
echo \"[gtcrn] bundled $(basename \"$GTCRN_SRC\") into Resources\"
";
