[package]
name = "dimmy-linux"
version = "0.3.64"
edition = "2021"
description = "Dimmy Linux native UI — GTK4 + libadwaita"
license = "AGPL-3.0-only"

[[bin]]
name = "dimmy-linux"
path = "src/main.rs"

[dependencies]
dimmy_lib = { package = "dimmy", path = "../../core" }
gtk4 = "0.9"
libadwaita = { version = "0.7", features = ["v1_4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
ashpd = "0.10"
arboard = "3"
gtk4-layer-shell = { version = "0.4", optional = true }
ksni = "0.2"
async-channel = "2"

[features]
default = ["x11-fallback"]
x11-fallback = []
layer-shell = ["gtk4-layer-shell"]
# Pass-through to the core crate. Release pipelines must build with
# `--features license-client` so the linux binary actually verifies
# tokens against the embedded pubkey instead of returning Unrestricted.
license-client = ["dimmy_lib/license-client"]
