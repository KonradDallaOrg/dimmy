[package]
name = "dimmy"
version = "0.6.59"
edition = "2021"
description = "Dimmy — Cross-platform voice transcription overlay"
license = "AGPL-3.0-only"
repository = "https://github.com/KonradDallaOrg/dimmy"

[lib]
name = "dimmy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "bench_local"
path = "src/bin/bench_local.rs"
required-features = ["local-stt"]

[[bin]]
name = "test_local_llm"
path = "src/bin/test_local_llm.rs"
required-features = ["local-llm"]

[[bin]]
name = "bench_llm_quality"
path = "src/bin/bench_llm_quality.rs"
required-features = ["local-llm"]

# Installer FFI smoke test: loads the installed dimmy_lib.dll at runtime
# (via libloading) and exercises all `dimmy_*` exports without invoking
# STT, LLM, or any model file. Catches the v0.6.10-style ABI mismatch
# class — symbols missing, mangled, or runtime-incompatible — at install
# time, before the user records anything.
[[bin]]
name = "dimmy_smoke"
path = "src/bin/dimmy_smoke.rs"
required-features = ["smoke-test"]

# CLI client that simulates the Dimmy app's licensing interactions —
# request-trial, activate, status, refresh, simulate-purchase. Used end-
# to-end against `licensing_server` so we can validate the architecture
# without dragging in the WinUI / SwiftUI / GTK4 surfaces.
[[bin]]
name = "license_cli"
path = "src/bin/license_cli.rs"
required-features = ["license-cli"]

# One-shot Parakeet smoke test: loads a WAV, calls
# `dimmy::parakeet::transcribe`, prints the text + timings.
# Requires ORT_DYLIB_PATH pointing at onnxruntime.dll/.dylib/.so.
[[bin]]
name = "parakeet_smoke"
path = "src/bin/parakeet_smoke.rs"
required-features = ["local-stt-parakeet"]

# Warm-path benchmark — runs short/medium/long fixtures + reports
# cold vs warm latency. Used to validate the Rust port of the TDT
# decoder against the Python reference's numbers.
[[bin]]
name = "parakeet_bench"
path = "src/bin/parakeet_bench.rs"
required-features = ["local-stt-parakeet"]

# Offline driver for the chunked-STT pipeline. Tiles a WAV, simulates
# a live cpal capture by pushing 100 ms slices into the shared PCM
# buffer, prints every per-chunk callback + the final cumulative
# transcript. Used on dev Macs / Linux without a microphone to
# validate the chunked path end-to-end against medium-long audio.
[[bin]]
name = "chunked_smoke"
path = "src/bin/chunked_smoke.rs"
required-features = ["local-stt-parakeet"]

# Mac-only counterpart to parakeet_smoke that exercises the
# FluidInference / Apple Neural Engine path. Same shape: one WAV in,
# one transcript out, plus timings. Gated on the matching cargo
# feature so non-Mac builds skip it cleanly.
[[bin]]
name = "parakeet_fluid_smoke"
path = "src/bin/parakeet_fluid_smoke.rs"
required-features = ["local-stt-parakeet-fluid"]

# Offline noise-suppression compare tool. Reads a mono WAV file
# (any sample rate — resamples to 48 kHz if needed), runs it through
# the DfnProcessor (currently nnnoiseless) one 480-sample frame at a
# time, writes the denoised WAV next to the input with a `_dfn`
# suffix. Used to A/B the recap audio quality with vs without
# noise suppression on a real meeting recording.
[[bin]]
name = "denoise_offline"
path = "src/bin/denoise_offline.rs"

[features]
default = ["local-stt", "telemetry-sentry"]
local-stt = ["dep:whisper-rs"]
local-stt-metal = ["local-stt", "whisper-rs/metal"]
local-stt-cuda = ["local-stt", "whisper-rs/cuda"]
local-stt-vulkan = ["local-stt", "whisper-rs/vulkan"]
# Parakeet TDT v3 FP32 local STT via ONNX Runtime (ort crate). Bundle:
# istupakov/parakeet-tdt-0.6b-v3-onnx (HuggingFace, ~2.5GB). The model
# files (encoder, decoder_joint, mel-extractor, vocab) are downloaded
# at first use into the dimmy config dir. CPU by default; CUDA on Win
# and CoreML on Mac when the matching feature is enabled (build-time).
local-stt-parakeet      = ["dep:ort", "dep:ndarray"]
local-stt-parakeet-cuda = ["local-stt-parakeet", "ort/cuda"]
local-stt-parakeet-coreml = ["local-stt-parakeet", "ort/coreml"]
# Parakeet via FluidInference's CoreML bundle, Apple-Silicon-only.
# Wraps the `fluidaudio-rs` Swift bridge (build.rs invokes `swift build`
# at compile time → requires Xcode CLT with Swift 5.10+). At runtime
# the FluidAudio framework auto-downloads the ~3 GB CoreML bundle into
# `~/.cache/fluidaudio/` on first `init_asr()`. RTF on M-series is
# documented at 100-300x; intended as the Mac-only fast path while
# Win/Linux stay on ort.
local-stt-parakeet-fluid = ["dep:fluidaudio-rs"]
# DeepFilterNet ML noise suppression — feature flag kept for the
# day the upstream blocker (see deep_filter dep comment above) is
# unblocked. Currently a no-op: dfn3.rs is gated on this feature
# and stays out of the build until `dep:deep_filter` is restored.
local-dfn = ["dep:deep_filter", "dep:ndarray", "dep:anyhow"]
local-llm = ["dep:llama-cpp-4"]
local-llm-metal = ["local-llm", "llama-cpp-4/metal", "llama-cpp-4/dynamic-link"]
local-llm-cuda = ["local-llm", "llama-cpp-4/cuda"]
local-llm-vulkan = ["local-llm", "llama-cpp-4/vulkan"]
# test-ffi: gates test-only FFI entry points that bypass cpal by injecting
# PCM samples directly into the audio buffer. Never enabled in release builds.
# Used only by integration tests under core/tests/.
test-ffi = []
# smoke-test: gates the dimmy_smoke binary that runtime-loads the installed
# dimmy_lib.dll via libloading. Used by the installer-ffi-smoke CI job.
smoke-test = ["dep:libloading"]
# telemetry-sentry: enables the Sentry crash + error pipeline. Default ON
# in release builds, off in headless/local dev unless explicitly requested.
# When off, the Sentry init is a no-op and no events are captured.
telemetry-sentry = ["dep:sentry"]
# license-cli: gates the license_cli binary. Lighter than the server (no
# axum/sqlx) but still pulls clap + reqwest + ed25519-dalek for verification.
license-cli = ["dep:clap", "dep:ed25519-dalek", "dep:sha2"]
# license-client: pulls in the Ed25519 verification + license.rs file I/O
# for the production cdylib. Default ON so the released app can verify
# tokens. Without it license.rs is a no-op stub returning Unrestricted.
license-client = ["dep:ed25519-dalek", "dep:sha2"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["multipart", "json", "blocking"] }
tokio = { version = "1", features = ["full"] }
# Realtime streaming dictation WebSocket client (Deepgram and future
# wss STT backends). native-tls feature on purpose: the cdylib already
# standardised on native-tls (schannel on Windows) — a rustls WS client
# would reintroduce the rustls 0.23 CryptoProvider panic in the Velopack
# load path (see the sentry dep note + deepgram_stream.rs module doc).
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
cpal = "0.15"
hound = "3.5"
# Multi-format audio decoder for `dimmy_transcribe_file` — m4a (MP4A
# container, the format iPhone Voice Memos / macOS Music exports use),
# mp3, aac, flac, opus, ogg/vorbis. Pure-Rust, no native deps.
# WAV legacy path stays on `hound` because Symphonia is heavier per-call
# and our existing test fixtures are WAV.
symphonia = { version = "0.5", default-features = false, features = [
    "isomp4",
    "aac",
    "alac",
    "mp3",
    "flac",
    "ogg",
    "vorbis",
] }
# Ogg/Vorbis ENCODER for compressed meeting audio (realtime .ogg recording,
# replacing the streamed WAVs). Symphonia (above) already DECODES vorbis/ogg
# for re-transcription + file-load; this supplies the missing encoder. Wraps
# libvorbis/libogg via `cc`. Vorbis (not Opus) because Symphonia's vorbis
# decode is complete whereas its Opus decode is not — so .ogg/Vorbis round-
# trips through our own re-transcription path.
vorbis_rs = "0.5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
dirs = "5"
chrono = "0.4"
url = "2"
base64 = "0.22"
nnnoiseless = "0.5"
# DeepFilterNet3 — bitrotted as of 2026-05-20.
# Upstream `Rikorose/DeepFilterNet` main branch fails to compile
# against current `tract` API (17 errors, notably `m.symbol_table`
# → `m.symbols` rename). Unblocking requires one of:
#   (a) Forking the repo + porting the libDF/src/tract.rs file to
#       the new tract API (~2-4 h).
#   (b) Pinning `tract = "0.20.x"` via `[patch.crates-io]` (risks
#       conflicting with the `tract` features pulled in by ort for
#       Parakeet — needs careful version solving).
#   (c) Re-implementing the DFN3 inference stack from scratch on
#       `ort` runtime (~4-6 h: STFT, ERB filterbank, model load,
#       mask application, iSTFT, overlap-add).
# Tracked in BACKLOG.md / docs. The nnnoiseless MVP is shipped and
# the `Dfn3Processor` wrapper in `core/src/dfn3.rs` is ready to
# accept a working backend; only the dep line below needs to come
# alive once one of the unblocking paths above is done.
# Dimmy fork — branch `fix/tract-ndarray-port` patches the
# upstream main against current `tract ≥0.21` + `ndarray = 0.16`.
# When upstream Rikorose/DeepFilterNet lands equivalent fixes (or
# accepts these as a PR), switch the URL back to the canonical
# repo. Same pattern as KonradDallaOrg/llama-cpp-rs.
deep_filter = { git = "https://github.com/KonradDallaOrg/DeepFilterNet", branch = "fix/tract-ndarray-port", default-features = false, features = ["tract", "wav-utils", "default-model"], optional = true }
biquad = "0.4"
dagc = "0.1"
# Acoustic echo cancellation — pure Rust port of WebRTC AEC3.
# Used in meeting Mix mode to subtract the system loopback (reference)
# from the mic capture so speakers→mic feedback doesn't produce a
# delay-mixed echo when both streams are summed. Includes HPF+NS+AGC
# in its `linear` pipeline.
aec3 = "0.2.0"
# DeepFilterNet (Rikorose/DeepFilterNet libDF) — ML-based real-time
# speech enhancement / noise suppression. Optional behind the
# `local-dfn` feature. Currently DEFERRED for activation: crates.io
# 0.2.5 doesn't expose the `tract` runtime feature, and the GitHub
# master pulls a `liquid-derive` version that fails to compile with
# current Rust. The `dfn.rs` module is wired and feature-gated so
# we can flip it on as soon as the upstream re-publishes a usable
# tract-enabled crate, or we swap in `deepfilter-rt` (uses the
# existing `ort` runtime).
# deep_filter = { ... optional = true, features = ["tract"] }
whisper-rs = { version = "0.16", optional = true }
# ONNX Runtime Rust bindings — used by the local-stt-parakeet path
# to load Parakeet TDT v3 FP32 (encoder + decoder_joint + mel
# extractor as 3 separate .onnx files). Native execution, no Python.
# Build pulls a prebuilt onnxruntime dll/dylib for the host (~30MB);
# CUDA / CoreML are opt-in via cargo features.
ort = { version = "=2.0.0-rc.10", optional = true, features = ["ndarray", "load-dynamic"] }
ndarray = { version = "0.16", optional = true }
anyhow = { version = "1", optional = true }
llama-cpp-4 = { git = "https://github.com/KonradDallaOrg/llama-cpp-rs", optional = true, default-features = false }
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"
tokio-stream = "0.1"
# Used only by the dimmy_smoke binary (smoke-test feature) to runtime-load
# the installed dimmy_lib.dll. Optional so default builds don't pull it in.
libloading = { version = "0.8", optional = true }
# Sentry crash + manual capture + structured logs. Optional behind
# telemetry-sentry feature.
#
# IMPORTANT: explicit native-tls. sentry 0.47 → reqwest 0.13 → rustls
# by default; rustls 0.23+ requires CryptoProvider::install_default(),
# without which a static lazy init panics inside the cdylib's load
# path on WindowsAppSDK + Velopack and triggers __fastfail (0xc0000409).
# native-tls uses schannel on Windows — no CryptoProvider, no panic.
# Reference: rustls#2070, project memory
# project_sentry_dll_load_crash_2026_04_26.md.
sentry = { version = "0.47", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "native-tls", "logs"], optional = true }
# Cross-platform "launch at login" toggle. Wraps the OS-specific
# autostart mechanisms (HKCU\…\Run on Windows, ~/Library/LaunchAgents
# on macOS, ~/.config/autostart/*.desktop on Linux) behind a single
# enable/disable/is_enabled API. ~400 LoC, MIT. The alternative would
# be three platform-specific modules in core/src/autostart/, which is
# what we'd write anyway — better to take the dep.
auto-launch = "0.5"

# ── Licensing PoC dependencies ──────────────────────────────────────
# All gated behind the licensing-server / license-cli / license-client
# features above. The default cdylib build pulls only ed25519-dalek +
# sha2 (~50KB compiled) for offline token verification.

# Ed25519 sign/verify. Audited RustCrypto crate. v2.x is the current
# stable line. Used by the client (`license-client`) to verify tokens
# offline against the build-time–embedded public key. Server-side signing
# is done in the Cloudflare Worker (TypeScript) — no Rust signer ships.
ed25519-dalek = { version = "2", optional = true, features = ["rand_core"] }
# Hash function for email_hash. SHA-256 only — keep dep minimal.
sha2 = { version = "0.10", optional = true }
# CLI client.
clap = { version = "4", features = ["derive"], optional = true }

# Windows API bindings — used by process_loopback.rs (Phase 5) for the
# AUDIOCLIENT_ACTIVATION_TYPE_PROCESS_LOOPBACK API + IAudioSession*
# enumeration. Win32_Media_Audio for WASAPI core, Win32_System_Com
# for COM init / IUnknown plumbing, Win32_System_ProcessStatus for
# enumerating running processes by name. Other platforms ignore.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
] }

[dev-dependencies]
# CSPRNG for ed25519 keypair generation in tests. Pulled here (not into
# the optional license-client feature) so tests work whether the server
# feature is on or not.
rand = "0.8"
# Integration test infrastructure. Kept minimal — no snapshot crate yet,
# assertions use substring checks which are robust under whisper determinism.
wiremock = "0.6"
# Blocking HTTP for downloading audio/model fixtures on first test run.
ureq = "2"
# Serialize tests that share global Dimmy state (GLOBAL_STATE is process-wide).
serial_test = "3"
# Property-based tests for the audio preprocess pipeline (NaN/Inf, clamp invariants).
proptest = "1"
# Cross-platform binary parser for the ABI snapshot test (PE / ELF / Mach-O).
object = { version = "0.36", default-features = false, features = ["read", "std"] }

# fluidaudio-rs: Apple-Silicon-only Parakeet TDT v3 via CoreML on the
# Apple Neural Engine. `build.rs` runs `swift build` at compile time
# and statically links a Swift bridge → only buildable on macOS arm64
# with a Swift 5.10+ toolchain. Target-scoped so cross-platform builds
# (Win/Linux/Intel-Mac) never try to fetch the crate. Pinned to git
# tag `v0.12.6` because crates.io only has 0.1.0 published (the repo
# has been releasing tags without pushing to crates.io). Gated by the
# `local-stt-parakeet-fluid` feature.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
fluidaudio-rs = { git = "https://github.com/FluidInference/fluidaudio-rs", tag = "v0.12.6", optional = true }
