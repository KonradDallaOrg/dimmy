[package]
name = "dimmy"
version = "0.4.1"
edition = "2021"
description = "Dimmy — Cross-platform voice transcription overlay"
license = "AGPL-3.0-only"
repository = "https://github.com/KonradDallaOrg/dimmy"

[lib]
name = "dimmy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "bench_local"
path = "src/bin/bench_local.rs"
required-features = ["local-stt"]

[features]
default = ["local-stt"]
local-stt = ["dep:whisper-rs"]
local-stt-metal = ["local-stt", "whisper-rs/metal"]
local-stt-cuda = ["local-stt", "whisper-rs/cuda"]
local-stt-vulkan = ["local-stt", "whisper-rs/vulkan"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["multipart", "json"] }
tokio = { version = "1", features = ["full"] }
cpal = "0.15"
hound = "3.5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
dirs = "5"
chrono = "0.4"
url = "2"
base64 = "0.22"
nnnoiseless = "0.5"
biquad = "0.4"
dagc = "0.1"
whisper-rs = { version = "0.16", optional = true }
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"
tokio-stream = "0.1"
