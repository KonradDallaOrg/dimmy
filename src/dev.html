<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dimmy — UI Dev Preview</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Dev harness styles */
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      gap: 32px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      overflow: auto;
      user-select: auto;
      -webkit-user-select: auto;
    }

    h2 {
      color: #e0e2e6;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin: 0;
    }

    .dev-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .dev-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .dev-btn {
      background: rgba(255,255,255,0.08);
      color: #b0b5bd;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .dev-btn:hover { background: rgba(255,255,255,0.14); color: #f0f1f3; }
    .dev-btn.active { background: #41B0B1; color: #fff; border-color: #41B0B1; }

    .dev-stage {
      background: transparent;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .pill-wrapper {
      /* Simulate the Tauri window frame */
      width: fit-content;
    }

    .pill-wrapper.micro #container { width: 56px; }
    .pill-wrapper.pill #container { width: 360px; }
    .pill-wrapper.rec #container { width: 360px; }
    .pill-wrapper.settings #container { width: 480px; }

    /* Override: allow overflow for dev */
    #container { overflow: visible !important; }

    /* Settings needs explicit height in dev (no Tauri window resize) */
    .pill-wrapper.settings #container {
      height: auto;
    }

    .label {
      color: #8b919a;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Style color swatches */
    .swatch-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }
    .swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.15s, transform 0.15s;
      position: relative;
    }
    .swatch:hover { transform: scale(1.2); }
    .swatch.active { border-color: #fff; }
    .swatch-label {
      position: absolute;
      bottom: -14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 7px;
      color: #8b919a;
      white-space: nowrap;
    }

    hr {
      width: 100%;
      border: none;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin: 8px 0;
    }
  </style>

  <!-- Mock Tauri API before main.js loads -->
  <script>
    // Tauri API mock
    const mockConfig = {
      llm_style: 'off',
      llm_tone: 'none',
      llm_translate_to: 'none',
      shortcut_label: 'Win+Alt',
      shortcut_mode: 'toggle',
      language: '',
      prompt: '',
      api_url: 'https://api.groq.com/openai/v1/audio/transcriptions',
      api_model: 'whisper-large-v3-turbo',
      llm_api_url: 'https://api.groq.com/openai/v1/chat/completions',
      llm_api_model: 'llama-3.3-70b-versatile',
      llm_use_same_key: true,
      llm_log_enabled: true,
      preprocessing_enabled: true,
      chunk_streaming_enabled: true,
      audio_debug_enabled: false,
      has_groq_key: true,
      stats_total_words: 12847,
      stats_total_speaking_secs: 3241,
      devices: ['MacBook Pro Microphone', 'Blue Yeti', 'AirPods Pro'],
      selected_device: 'Blue Yeti',
    };

    const listeners = {};

    window.__TAURI__ = {
      core: {
        invoke: async (cmd, args) => {
          if (cmd === 'get_audio_device') return 'Blue Yeti';
          if (cmd === 'get_config') return { ...mockConfig };
          if (cmd === 'set_config') return;
          if (cmd === 'resize_window') return;
          if (cmd === 'get_amplitude') return Math.random() * 0.6 + 0.05;
          if (cmd === 'start_recording') return;
          if (cmd === 'stop_recording') return 'This is a sample transcription for testing the UI.';
          if (cmd === 'paste_text') return;
          if (cmd === 'get_version') return '0.3.38';
          if (cmd === 'check_for_update') return null;
          if (cmd === 'check_accessibility') return true;
          if (cmd === 'cycle_llm_style') {
            const styles = ['off','correct','summarize','elaborate','comprehensible','professional','prompt','genz','boomer','emoji','acronyms','imbruttito','custom'];
            const dir = args?.direction || 1;
            const cur = styles.indexOf(mockConfig.llm_style);
            const next = (cur + dir + styles.length) % styles.length;
            mockConfig.llm_style = styles[next];
            return { style: mockConfig.llm_style };
          }
          if (cmd === 'cycle_llm_tone') {
            const tones = ['none','formal','friendly','concise','academic'];
            const dir = args?.direction || 1;
            const cur = tones.indexOf(mockConfig.llm_tone);
            const next = (cur + dir + tones.length) % tones.length;
            mockConfig.llm_tone = tones[next];
            return { tone: mockConfig.llm_tone };
          }
          if (cmd === 'update_stats') return;
          if (cmd === 'start_shortcut_recording') return;
          if (cmd === 'cancel_shortcut_recording') return;
          if (cmd === 'poll_shortcut_recording') return { done: false };
          console.log('[mock invoke]', cmd, args);
          return null;
        }
      },
      event: {
        listen: (event, callback) => {
          listeners[event] = callback;
          return () => { delete listeners[event]; };
        }
      },
      window: {
        getCurrentWindow: () => ({
          startDragging: async () => {}
        })
      }
    };

    // Helper to emit mock events
    window.mockEmit = (event, payload) => {
      if (listeners[event]) listeners[event]({ payload });
    };
  </script>
</head>

  <!-- Do NOT load main.js — it fights for DOM control. We mock everything inline. -->

  <script>
    const STYLE_COLORS = {
      off: '#41B0B1',
      correct: '#2dd4bf',
      summarize: '#fbbf24',
      elaborate: '#4ade80',
      comprehensible: '#38bdf8',
      professional: '#f472b6',
      prompt: '#a78bfa',
      genz: '#e879f9',
      boomer: '#f97316',
      emoji: '#facc15',
      acronyms: '#22d3ee',
      imbruttito: '#ef4444',
      custom: '#fb923c',
    };

    const dot = document.getElementById('dot');
    const container = document.getElementById('container');
    const wrapper = document.getElementById('pill-wrapper');
    const recPanel = document.getElementById('rec-panel');
    const settingsPanel = document.getElementById('settings-panel');
    const waveformCanvas = document.getElementById('waveform');
    const waveformInline = document.getElementById('waveform-inline');
    const transcriptText = document.getElementById('transcript-text');
    const timerEl = document.getElementById('timer');
    const deviceName = document.getElementById('device-name');
    const statusText = document.getElementById('status-text');
    const chunkDots = document.getElementById('chunk-dots');

    let waveformSim = null;
    let timerSim = null;
    let simStart = 0;
    let devCompactMode = false;

    // Build style swatches
    const swatchGrid = document.getElementById('swatch-grid');
    Object.entries(STYLE_COLORS).forEach(([name, color]) => {
      const s = document.createElement('div');
      s.className = 'swatch';
      s.style.background = color;
      s.title = name;
      s.onclick = () => {
        document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));
        s.classList.add('active');
        dot.style.setProperty('--style-color', color);
        dot.className = 'styled';
        statusText.textContent = name;
        statusText.classList.remove('hide');
        // Update state buttons
        document.querySelectorAll('.dev-section:nth-child(2) .dev-btn').forEach(b => b.classList.remove('active'));
      };
      const lbl = document.createElement('span');
      lbl.className = 'swatch-label';
      lbl.textContent = name;
      s.appendChild(lbl);
      swatchGrid.appendChild(s);
    });

    function clearAllBtns(section) {
      document.querySelectorAll(`.dev-section:nth-child(${section}) .dev-btn`).forEach(b => b.classList.remove('active'));
    }

    function setState(state) {
      clearAllBtns(2);
      event.target.classList.add('active');
      document.querySelectorAll('.swatch').forEach(x => x.classList.remove('active'));

      // Stop simulations
      if (waveformSim) { clearInterval(waveformSim); waveformSim = null; }
      if (timerSim) { clearInterval(timerSim); timerSim = null; }

      dot.style.removeProperty('--style-color');
      statusText.classList.add('hide');
      timerEl.classList.add('hide');
      deviceName.classList.remove('hide');
      container.classList.remove('recording-active');
      waveformInline.classList.add('hide');

      if (state === 'idle') {
        dot.className = '';
      } else if (state === 'recording') {
        dot.className = 'recording';
        container.classList.add('recording-active');
        if (!devCompactMode) {
          statusText.textContent = 'rec';
          statusText.classList.remove('hide');
        }
        timerEl.classList.remove('hide');
        deviceName.classList.add('hide');
        simStart = Date.now();
        timerSim = setInterval(() => {
          const s = Math.floor((Date.now() - simStart) / 1000);
          timerEl.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
        }, 1000);

        // Compact mode: show inline waveform, switch to pill view
        if (devCompactMode) {
          waveformInline.classList.remove('hide');
          recPanel.classList.remove('open');
          container.classList.remove('expanded-mode');
          wrapper.className = 'pill-wrapper pill';
          setTimeout(() => startWaveformSim(true), 50);
        } else if (recPanel.classList.contains('open')) {
          startWaveformSim(false);
        }

        // Simulate chunk dots
        chunkDots.innerHTML = '';
        let ci = 1;
        const chunkSim = setInterval(() => {
          if (dot.className !== 'recording') { clearInterval(chunkSim); return; }
          const d = document.createElement('div');
          d.className = 'chunk-dot sending';
          d.id = `c${ci}`;
          chunkDots.appendChild(d);
          const idx = ci;
          setTimeout(() => {
            const el = document.getElementById(`c${idx}`);
            if (el) el.className = 'chunk-dot done';
          }, 800);
          if (!devCompactMode) {
            transcriptText.textContent = 'This is a sample transcription text that streams in as you speak...'.slice(0, ci * 12);
          }
          ci++;
          if (ci > 6) { clearInterval(chunkSim); }
        }, 1500);
      } else if (state === 'transcribing') {
        dot.className = 'transcribing';
        statusText.textContent = 'transcribing';
        statusText.classList.remove('hide');
      } else if (state === 'llm-processing') {
        dot.className = 'llm-processing';
        statusText.textContent = 'enhancing';
        statusText.classList.remove('hide');
      } else if (state === 'error') {
        dot.className = 'error';
        statusText.textContent = 'connection failed';
        statusText.classList.remove('hide');
      }
    }

    function startWaveformSim(inline) {
      const canvas = inline ? waveformInline : waveformCanvas;
      const ctx = canvas.getContext('2d');
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      const barW = inline ? 3 : 7;
      const barGap = inline ? 1.5 : 2;
      const barCount = inline ? Math.floor((rect.width + barGap) / (barW + barGap)) : 39;
      let history = [];

      waveformSim = setInterval(() => {
        const val = Math.random() * 0.7 + 0.05;
        history.push(val);
        if (history.length > barCount) history = history.slice(-barCount);

        const w = rect.width, h = rect.height;
        ctx.clearRect(0, 0, w, h);
        const totalW = barCount * (barW + barGap) - barGap;
        const offsetX = inline
          ? w - totalW + (barCount - history.length) * (barW + barGap)
          : (w - totalW) / 2;

        for (let i = 0; i < history.length; i++) {
          const v = history[i];
          const barH = Math.max(2, Math.floor(v * h));
          const x = offsetX + i * (barW + barGap);

          if (v >= 0.7) ctx.fillStyle = '#5198C9';
          else if (v > 0.05) ctx.fillStyle = '#41B0B1';
          else ctx.fillStyle = '#1a4a4b';

          ctx.beginPath();
          ctx.roundRect(x, h - barH, barW, barH, 1);
          ctx.fill();
        }
      }, 60);
    }

    function setView(view) {
      clearAllBtns(3);
      event.target.classList.add('active');

      if (waveformSim) { clearInterval(waveformSim); waveformSim = null; }

      recPanel.classList.remove('open');
      settingsPanel.classList.remove('open');
      container.classList.remove('expanded-mode');
      waveformInline.classList.add('hide');

      wrapper.className = 'pill-wrapper ' + view;

      const pill = document.getElementById('pill');
      if (view === 'micro') {
        pill.classList.add('micro');
        deviceName.classList.add('hide');
      } else {
        pill.classList.remove('micro');
        deviceName.classList.remove('hide');
      }

      if (view === 'rec') {
        if (devCompactMode) {
          // In compact mode, "rec" view stays pill-sized with inline waveform
          wrapper.className = 'pill-wrapper pill';
          waveformInline.classList.remove('hide');
          container.classList.add('recording-active');
          setTimeout(() => {
            if (dot.className === 'recording') startWaveformSim(true);
          }, 50);
        } else {
          container.classList.add('expanded-mode');
          recPanel.classList.add('open');
          setTimeout(() => {
            if (dot.className === 'recording') startWaveformSim(false);
          }, 50);
        }
      } else if (view === 'settings') {
        container.classList.add('expanded-mode');
        settingsPanel.classList.add('open');
      }
    }

    function setCompact(on) {
      clearAllBtns(5);
      event.target.classList.add('active');
      devCompactMode = on;
      // If currently recording, re-trigger to show the change
      if (dot.className === 'recording') {
        setState('recording');
      }
    }

    function setTheme(theme) {
      clearAllBtns(6);
      event.target.classList.add('active');
      document.documentElement.setAttribute('data-theme', theme);
      // Also change harness background
      document.body.style.background = theme === 'light' ? '#e5e7eb' : '#1a1a2e';
    }

    // Init: show pill view with device name
    setTimeout(() => {
      deviceName.textContent = 'Blue Yeti';
    }, 100);
  </script>
</body>
</html>
