name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ── Rust core lint + test ──────────────────────────────────────────
  rust-check:
    name: Rust Lint & Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxdo-dev libdbus-1-dev libssl-dev cmake

      - name: Format
        working-directory: core
        run: cargo fmt --check

      - name: Clippy
        working-directory: core
        run: cargo clippy --features local-stt -- -D warnings

      - name: Test
        working-directory: core
        run: cargo test --lib --features local-stt

  # ── Create release placeholder ─────────────────────────────────────
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | head -n 2 | tail -n 1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$GITHUB_REF_NAME" ]; then
            COMMITS=$(git log --pretty=format:"- %s" HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD")
          fi
          {
            echo "## What's Changed"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "## Downloads"
            echo ""
            echo "| Platform | File | Requirements |"
            echo "|----------|------|--------------|"
            echo "| Windows (installer) | \`Dimmy-setup-x64.exe\` | [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0) |"
            echo "| Windows (portable) | \`Dimmy-windows-x64.zip\` | [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0) |"
            echo "| macOS (Apple Silicon) | \`Dimmy-macos-arm64.dmg\` | macOS 12+ |"
            echo "| Linux | \`Dimmy-linux-x86_64.AppImage\` | None (GTK4 bundled) |"
            echo ""
            echo "## Installation Notes"
            echo ""
            echo "**Windows:** Download \`Dimmy-setup-x64.exe\` and run. Or extract the portable zip. .NET 8 Desktop Runtime required."
            echo ""
            echo "Verify downloads with \`checksums-windows.txt\` (SHA256)."
            echo ""
            echo "**macOS:** Open the DMG, drag to Applications. First launch: right-click -> Open, or run:"
            echo "\`\`\`"
            echo "xattr -d com.apple.quarantine /Applications/Dimmy.app"
            echo "\`\`\`"
            echo ""
            echo "**Linux:** Make AppImage executable (\`chmod +x\`) and run."
            echo ""
            echo "---"
            echo "*Check for updates in Dimmy Settings > About.*"
          } > changelog.md
          cat changelog.md

      - name: Create GitHub Release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Dimmy ${{ github.ref_name }}"
          body_path: changelog.md
          draft: true
          prerelease: false

  # ── macOS Native Build ─────────────────────────────────────────────
  build-macos:
    name: Build macOS Native
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install CMake
        run: |
          brew install cmake
          cmake --version

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build Rust static library
        working-directory: core
        run: |
          echo "CMake: $(cmake --version | head -1)"
          echo "Xcode CLT: $(xcode-select -p)"
          cargo build --lib --release --target aarch64-apple-darwin --features local-stt-metal

      - name: Verify static library and remove dylib
        run: |
          ls -lh core/target/aarch64-apple-darwin/release/libdimmy_lib.a
          file core/target/aarch64-apple-darwin/release/libdimmy_lib.a
          rm -f core/target/aarch64-apple-darwin/release/libdimmy_lib.dylib
          rm -f core/target/aarch64-apple-darwin/release/deps/libdimmy_lib.dylib

      - name: Build Xcode project
        working-directory: platforms/macos
        run: |
          xcodebuild -project Dimmy.xcodeproj \
            -scheme Dimmy \
            -configuration Release \
            -derivedDataPath build/derived \
            build \
            CODE_SIGN_IDENTITY="-"

      - name: Create DMG
        working-directory: platforms/macos
        run: |
          APP_PATH="build/derived/Build/Products/Release/Dimmy.app"
          mkdir -p build/dmg
          cp -R "$APP_PATH" build/dmg/
          hdiutil create -volname "Dimmy" \
            -srcfolder build/dmg \
            -ov -format UDZO \
            "build/Dimmy-macos-arm64.dmg"

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: platforms/macos/build/Dimmy-macos-arm64.dmg

  # ── Windows Native Build ───────────────────────────────────────────
  build-windows:
    name: Build Windows Native
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          # choco sets env for new shells only — propagate to subsequent steps
          $sdkDir = Get-ChildItem "C:\VulkanSDK" -Directory | Select-Object -First 1
          echo "VULKAN_SDK=$($sdkDir.FullName)" >> $env:GITHUB_ENV
          echo "$($sdkDir.FullName)\Bin" >> $env:GITHUB_PATH
          Write-Host "Vulkan SDK: $($sdkDir.FullName)"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Create CMake toolchain with /FS
        shell: pwsh
        run: |
          @"
          # Force /FS on all MSVC compilations (including ExternalProject sub-builds)
          set(CMAKE_C_FLAGS_INIT "/FS")
          set(CMAKE_CXX_FLAGS_INIT "/FS")
          "@ | Out-File -Encoding utf8 "$env:RUNNER_TEMP\toolchain.cmake"

      - name: Build Rust DLL
        working-directory: core
        shell: pwsh
        env:
          LIBCLANG_PATH: "C:\\Program Files\\LLVM\\bin"
          CMAKE_GENERATOR: Ninja
          CMAKE_TOOLCHAIN_FILE: "${{ runner.temp }}\\toolchain.cmake"
        run: cargo build --lib --release --target x86_64-pc-windows-msvc --features local-stt-vulkan

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore NuGet packages
        working-directory: platforms/windows/Dimmy.Windows
        run: dotnet restore

      - name: Build Windows app
        working-directory: platforms/windows/Dimmy.Windows
        run: dotnet build Dimmy.Windows.csproj -c Release

      - name: Prepare distribution
        shell: pwsh
        run: |
          $binDir = "platforms/windows/Dimmy.Windows/bin/Release/net8.0-windows10.0.19041.0"
          Copy-Item "core/target/x86_64-pc-windows-msvc/release/dimmy_lib.dll" "$binDir/"
          Get-ChildItem "$binDir" -Filter "*.pdb" -Recurse | Remove-Item -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "platforms/windows/Dimmy.Windows/publish"
          Copy-Item "$binDir/*" "platforms/windows/Dimmy.Windows/publish/" -Recurse

      - name: Run Windows tests
        working-directory: platforms/windows/Dimmy.Windows.Tests
        run: dotnet test -c Release --logger "console;verbosity=normal"

      - name: Package ZIP
        working-directory: platforms/windows/Dimmy.Windows
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath ..\Dimmy-windows-x64.zip

      - name: Build NSIS installer
        working-directory: platforms/windows
        shell: pwsh
        run: |
          $version = "${{ needs.create-release.outputs.version }}"
          choco install nsis -y --no-progress
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DAPP_VERSION=$version installer.nsi
          Get-ChildItem Dimmy-setup-*.exe | ForEach-Object { Write-Host "Installer: $($_.Name) ($([math]::Round($_.Length/1MB, 1)) MB)" }

      - name: Generate checksums
        working-directory: platforms/windows
        shell: pwsh
        run: |
          $files = @("Dimmy-windows-x64.zip") + (Get-ChildItem "Dimmy-setup-*.exe" | ForEach-Object { $_.Name })
          $checksums = @()
          foreach ($f in $files) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $checksums += "$hash  $f"
            Write-Host "$hash  $f"
          }
          $checksums | Out-File -Encoding utf8 "checksums-windows.txt"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            platforms/windows/Dimmy-windows-x64.zip
            platforms/windows/Dimmy-setup-*-x64.exe
            platforms/windows/checksums-windows.txt

  # ── Linux Native Build ─────────────────────────────────────────────
  build-linux:
    name: Build Linux (GTK4)
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platforms/linux/target
          key: linux-cargo-${{ hashFiles('platforms/linux/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Install GTK4 + libadwaita dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libdbus-1-dev pkg-config \
            libasound2-dev libxdo-dev libfuse2 cmake

      - name: Clippy
        working-directory: platforms/linux
        run: cargo clippy -- -D warnings

      - name: Test
        working-directory: platforms/linux
        run: cargo test

      - name: Build release
        working-directory: platforms/linux
        run: cargo build --release

      - name: Package AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh

          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp platforms/linux/target/release/dimmy-linux AppDir/usr/bin/
          cp platforms/linux/assets/com.dimmy.app.desktop AppDir/usr/share/applications/
          cp platforms/linux/assets/com.dimmy.app.svg AppDir/usr/share/icons/hicolor/scalable/apps/

          export DEPLOY_GTK_VERSION=4
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin gtk \
            --desktop-file platforms/linux/assets/com.dimmy.app.desktop \
            --icon-file platforms/linux/assets/com.dimmy.app.svg \
            --output appimage

          mv Dimmy*.AppImage Dimmy-linux-x86_64.AppImage

      - name: Upload AppImage to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: Dimmy-linux-x86_64.AppImage

  # ── Publish (waits for all jobs) ───────────────────────────────────
  publish-release:
    name: Publish Release
    needs: [rust-check, create-release, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });
