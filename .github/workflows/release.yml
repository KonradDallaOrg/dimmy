name: Release

on:
  push:
    tags:
      # Prod tags only. Staging tags use the `v*-staging*` shape and
      # are handled by staging-tester.yml — exclude them here so a
      # staging tag doesn't accidentally fire BOTH pipelines (we hit
      # this on 2026-05-04 with v0.6.27-staging.2: GitHub only honors
      # the first pattern hit, but having both fire-able is brittle).
      - "v*"
      - "!v*-staging*"

permissions:
  contents: write

jobs:
  # ── Rust core lint + test ──────────────────────────────────────────
  rust-check:
    name: Rust Lint & Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxdo-dev libdbus-1-dev libssl-dev cmake

      - name: Format
        working-directory: core
        run: cargo fmt --check

      - name: Clippy
        working-directory: core
        run: cargo clippy --features local-stt,local-llm -- -D warnings

      - name: Test
        working-directory: core
        # Same feature set as the Clippy step above and the CLAUDE.md
        # pre-push checklist. Without local-llm the 24 feature-gated
        # local_llm tests were silently skipped in the RELEASE gate of
        # all places (re-audit 2026-07-04 finding).
        run: cargo test --lib --features local-stt,local-llm

  # ── Create release placeholder ─────────────────────────────────────
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: |
          # Shape-matched previous tag: rc / final → previous prod tag,
          # never a staging tag. Without this filter the diff range
          # ended up at the chronologically previous tag (often a
          # staging.N cut minutes before), which on a long-running
          # branch produced a 64 KB body for v0.6.47-rc1. Burned
          # 2026-05-17.
          PREV_TAG=$(git tag --sort=-creatordate --list 'v*' | grep -vE -- '-staging\.|^'"$GITHUB_REF_NAME"'$' | head -n 1)
          if [ -z "$PREV_TAG" ]; then
            ALL=$(git log --pretty=format:"- %s" --no-merges HEAD | head -n 50)
            HEADER="## What's Changed"
          else
            ALL=$(git log --pretty=format:"- %s" --no-merges "${PREV_TAG}..HEAD")
            HEADER="## What's Changed since \`${PREV_TAG}\`"
          fi
          TOTAL=$(printf '%s\n' "$ALL" | grep -c . || true)
          FIRST=$(printf '%s\n' "$ALL" | head -n 10)
          REST=$(printf '%s\n' "$ALL" | tail -n +11)
          {
            echo "$HEADER"
            echo ""
            echo "$FIRST"
            if [ -n "$REST" ]; then
              MORE=$((TOTAL - 10))
              echo ""
              echo "<details><summary><b>$MORE more commit(s)…</b></summary>"
              echo ""
              echo "$REST"
              echo ""
              echo "</details>"
            fi
            echo ""
            echo "## Downloads"
            echo ""
            echo "| Platform | File | Requirements |"
            echo "|----------|------|--------------|"
            echo "| Windows (installer) | \`Dimmy-win-Setup.exe\` | None (installs .NET 8 automatically) |"
            echo "| Windows (portable) | \`Dimmy-win-Portable.zip\` | [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0) |"
            echo "| macOS (Apple Silicon) | \`Dimmy-macos-arm64.dmg\` | macOS 12+ |"
            echo "| Linux | \`Dimmy-linux-x86_64.AppImage\` | None (GTK4 bundled) |"
            echo ""
            echo "## Installation Notes"
            echo ""
            echo "**Windows:** Download \`Dimmy-win-Setup.exe\` and run. Installs .NET 8 automatically if needed."
            echo ""
            echo "**macOS:** Open the DMG, drag to Applications. First launch: right-click -> Open, or run:"
            echo "\`\`\`"
            echo "xattr -d com.apple.quarantine /Applications/Dimmy.app"
            echo "\`\`\`"
            echo ""
            echo "**Linux:** Make AppImage executable (\`chmod +x\`) and run."
            echo ""
            echo "---"
            echo "*Check for updates in Dimmy Settings > About.*"
          } > changelog.md
          cat changelog.md

      - name: Create GitHub Release
        id: create
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Dimmy ${{ github.ref_name }}"
          body_path: changelog.md
          draft: true
          # Auto-detect prerelease from tag suffix. Tag `v0.6.37`
          # → production. Tag `v0.6.37-rc1` / `-beta` / `-alpha`
          # → prerelease. The `v*-staging*` shape is already excluded
          # by the trigger filter at the top of this file so it
          # never reaches here. The Mac appcast step (lower down)
          # reads `github.event.release.prerelease` to set the
          # `<sparkle:channel>prerelease</sparkle:channel>` tag.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ── macOS Native Build ─────────────────────────────────────────────
  build-macos:
    name: Build macOS Native
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install CMake
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          cmake --version

      - name: Verify Swift toolchain (need 5.10+ for FluidAudio)
        run: |
          swift --version
          xcodebuild -version | head -2

      - name: Fetch onnxruntime arm64 dylib
        run: scripts/download-onnxruntime.sh

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Cache FluidAudio Swift build
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/FluidAudio*
            ~/Library/Caches/org.swift.swiftpm
            core/target/aarch64-apple-darwin/release/build/fluidaudio-rs-*
          key: fluidaudio-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: |
            fluidaudio-${{ runner.os }}-

      # NOTE: DLL-reuse is Windows-only (the cdylib is a self-contained DLL).
      # macOS links the app against SEPARATE static libs (libdimmy_lib.a +
      # libllama.a + libwhisper.a + libggml*.a); restoring only libdimmy_lib.a
      # and skipping the build breaks the Xcode link (ld: library 'llama' not
      # found). Mac always full-builds until a multi-archive cache is added.
      - name: Build Rust static library
        working-directory: core
        env:
          # Telemetry secrets — embedded into the binary at build time via
          # core/build.rs. PostHog analytics + Sentry crash reporting +
          # logs both active. Sentry 0.47 with default-features = false
          # + explicit native-tls (schannel on Windows) avoids the
          # rustls/CryptoProvider static-init panic that __fastfailed
          # the cdylib under WindowsAppSDK + Velopack (V3 / V8).
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Licensing v2 public key — embedded via `option_env!()` in
          # core/src/license.rs. When unset, the cdylib treats every
          # binary as "unrestricted" (source-build path). Released
          # binaries always have it set so license verification is on.
          DIMMY_LICENSE_PUBKEY: ${{ secrets.DIMMY_LICENSE_PUBKEY }}
          DIMMY_LICENSE_SERVER_URL: https://license.dimmy.app
        run: |
          echo "CMake: $(cmake --version | head -1)"
          echo "Xcode CLT: $(xcode-select -p)"
          cargo clean --release 2>/dev/null
          # local-stt-parakeet-fluid: Apple Neural Engine path via
          # FluidInference's CoreML bundle. Target-scoped to macOS
          # arm64 so the feature has no effect on Win/Linux jobs.
          cargo build --lib --release --target aarch64-apple-darwin \
            --features local-stt-metal,local-llm-metal,local-stt-parakeet-coreml,local-stt-parakeet-fluid,local-dfn,license-client

      - name: Verify static library
        run: |
          ls -lh core/target/aarch64-apple-darwin/release/libdimmy_lib.a
          file core/target/aarch64-apple-darwin/release/libdimmy_lib.a
          rm -f core/target/aarch64-apple-darwin/release/libdimmy_lib.dylib
          rm -f core/target/aarch64-apple-darwin/release/deps/libdimmy_lib.dylib
          echo "=== llama/ggml dylibs in release dir ==="
          ls -la core/target/aarch64-apple-darwin/release/libllama* core/target/aarch64-apple-darwin/release/libggml* 2>/dev/null || echo "No dylibs found"

      - name: Resolve Sparkle SPM dependency
        working-directory: platforms/macos
        run: |
          xcodebuild -project Dimmy.xcodeproj -resolvePackageDependencies

      - name: Sync Mac app version from Cargo.toml
        id: mac-version
        run: |
          # Single source of truth is core/Cargo.toml. Pass it through to
          # xcodebuild so CFBundleShortVersionString matches the release
          # tag — Sparkle compares this against the appcast and would
          # offer every release as an "update" otherwise.
          VERSION=$(grep -m1 '^version = ' core/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$VERSION" ]; then echo "::error::could not parse version from core/Cargo.toml"; exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Mac build version: $VERSION"

      # ── Developer ID signing + notarization (graceful-skip) ──────────
      # Mirror of staging-tester.yml. With MACOS_CERT_P12 present the prod
      # DMG is signed with a STABLE Developer ID identity + notarized, so
      # Gatekeeper opens it cleanly AND macOS TCC keeps the mic /
      # audio-capture / screen-recording grants across Sparkle updates
      # (ad-hoc has no stable designated requirement → every update looks
      # like a new app and the system-audio tap is silently re-denied on
      # Tahoe). Falls back to ad-hoc `-` when the secret is absent.
      - name: Import Apple Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12:-}" ]; then
            echo "::warning::MACOS_CERT_P12 not set — building ad-hoc (no Developer ID, no notarization). Gatekeeper will warn on first open and TCC grants will reset on every Sparkle update."
            echo "MACOS_SIGNED=0" >> "$GITHUB_ENV"
            echo "SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed 's/"//g')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::Developer ID Application identity not found in the imported .p12"
            exit 1
          fi
          SIGN_TEAM="$(printf '%s' "$IDENTITY" | sed -E 's/.*\(([A-Z0-9]+)\)$/\1/')"
          echo "Imported signing identity: $IDENTITY  (team $SIGN_TEAM)"
          echo "MACOS_SIGNED=1" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGN_TEAM=$SIGN_TEAM" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build Xcode project
        working-directory: platforms/macos
        run: |
          set -euo pipefail
          if [ "${MACOS_SIGNED:-0}" = "1" ]; then
            xcodebuild -project Dimmy.xcodeproj \
              -scheme Dimmy \
              -configuration Release \
              -derivedDataPath build/derived \
              MARKETING_VERSION="$VERSION" \
              CURRENT_PROJECT_VERSION="$VERSION" \
              build \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
              DEVELOPMENT_TEAM="$SIGN_TEAM" \
              ENABLE_HARDENED_RUNTIME=YES \
              OTHER_CODE_SIGN_FLAGS="--timestamp --options runtime"
          else
            xcodebuild -project Dimmy.xcodeproj \
              -scheme Dimmy \
              -configuration Release \
              -derivedDataPath build/derived \
              MARKETING_VERSION="$VERSION" \
              CURRENT_PROJECT_VERSION="$VERSION" \
              build \
              CODE_SIGN_IDENTITY="-"
          fi

      - name: Bundle llama.cpp dylibs
        run: |
          APP_PATH="platforms/macos/build/derived/Build/Products/Release/Dimmy.app"
          FRAMEWORKS_DIR="$APP_PATH/Contents/Frameworks"
          mkdir -p "$FRAMEWORKS_DIR"
          RELEASE_DIR="core/target/aarch64-apple-darwin/release"

          # Copy dylibs dereferencing symlinks so every file is a real binary
          for name in libllama libggml libggml-base libggml-cpu libggml-metal; do
            for dylib in "$RELEASE_DIR"/${name}*.dylib; do
              [ -e "$dylib" ] || continue
              DEST="$FRAMEWORKS_DIR/$(basename "$dylib")"
              cp -RL "$dylib" "$DEST"
              # Ensure install name uses @rpath so the app finds them at runtime
              install_name_tool -id "@rpath/$(basename "$dylib")" "$DEST" 2>/dev/null || true
            done
          done

          # Re-sign all dylibs
          codesign --force --sign - "$FRAMEWORKS_DIR"/*.dylib

          echo "=== Frameworks contents ==="
          ls -la "$FRAMEWORKS_DIR/"
          echo "=== Verifying no broken symlinks ==="
          find "$FRAMEWORKS_DIR" -type l ! -exec test -e {} \; -print | grep . && echo "BROKEN SYMLINKS FOUND — BUILD WILL FAIL" && exit 1 || echo "All OK"

      # MCP bridge binary — the Settings wizard installs it into the
      # user's Claude Extensions dir, but the binary itself must ship
      # inside the .app bundle so the install step has a source to
      # copy from. Without this the wizard fails with rc -2 ("binary
      # not found in app bundle").
      # The Silero VAD model ships inside the .app (Contents/Resources) rather
      # than being downloaded: 885 KB, so it carries the notarised signature
      # and works offline on first run. The failure mode if it goes missing is
      # SILENT — core/src/silero.rs just falls back to the weaker RNNoise gate
      # with nothing in the log to notice — so fail the build loudly instead.
      - name: Verify Silero VAD model is bundled
        run: |
          APP_PATH="platforms/macos/build/derived/Build/Products/Release/Dimmy Staging.app"
          [ -d "$APP_PATH" ] || APP_PATH="platforms/macos/build/derived/Build/Products/Release/Dimmy.app"
          MODEL="$APP_PATH/Contents/Resources/ggml-silero-v6.2.0.bin"
          if [ ! -f "$MODEL" ]; then
            echo "error: Silero VAD model missing from the app bundle" >&2
            echo "hint: the 'Bundle Silero VAD model' Xcode phase did not run," >&2
            echo "      or core/assets/ggml-silero-v6.2.0.bin is absent" >&2
            exit 1
          fi
          echo "[verify] Silero VAD model bundled ($(stat -f%z "$MODEL") bytes)"
      - name: Build dimmy-mcp for aarch64-apple-darwin
        working-directory: mcp-server
        run: cargo build --release --target aarch64-apple-darwin

      - name: Copy dimmy-mcp into .app Resources
        run: |
          APP_PATH="platforms/macos/build/derived/Build/Products/Release/Dimmy.app"
          RESOURCES_DIR="$APP_PATH/Contents/Resources"
          cp "mcp-server/target/aarch64-apple-darwin/release/dimmy-mcp" "$RESOURCES_DIR/dimmy-mcp"
          chmod +x "$RESOURCES_DIR/dimmy-mcp"
          codesign --force --sign - "$RESOURCES_DIR/dimmy-mcp"

      # Re-sign inside-out with the Developer ID identity + secure timestamp.
      # xcodebuild signs the ML dylibs with --timestamp=none and dimmy-mcp is
      # injected after the build, so without this notarization rejects the
      # bundle. Sign nested code first (dylibs, Sparkle helpers, mcp) then
      # re-seal the .app last with hardened runtime + entitlements. No-op ad-hoc.
      - name: Sign app for Developer ID + hardened runtime
        if: ${{ env.MACOS_SIGNED == '1' }}
        run: |
          set -euo pipefail
          APP_PATH="platforms/macos/build/derived/Build/Products/Release/Dimmy.app"
          ENTITLEMENTS="platforms/macos/Dimmy/Dimmy.entitlements"
          sign() { codesign --force --options runtime --timestamp \
            --keychain "$KEYCHAIN_PATH" --sign "$SIGN_IDENTITY" "$@"; }
          # 1. Nested dylibs (libllama/libggml*, libonnxruntime).
          while IFS= read -r -d '' f; do sign "$f"; done \
            < <(find "$APP_PATH/Contents/Frameworks" -type f -name '*.dylib' -print0 2>/dev/null)
          # 2. Sparkle nested helpers (Updater.app, Autoupdate, XPC services)
          #    that xcodebuild does NOT re-sign with our identity + secure
          #    timestamp — notarization rejects exactly those. Sign inside-out,
          #    then re-seal the framework. Skip the "Current" symlink.
          SPK="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          if [ -d "$SPK" ]; then
            for vd in "$SPK"/Versions/*/; do
              case "$vd" in */Current/) continue;; esac
              for item in "$vd"XPCServices/*.xpc "$vd"Autoupdate "$vd"Updater.app; do
                [ -e "$item" ] && sign "$item"
              done
            done
            sign "$SPK"
          fi
          # 3. Helper binary.
          [ -f "$APP_PATH/Contents/Resources/dimmy-mcp" ] && sign "$APP_PATH/Contents/Resources/dimmy-mcp"
          # 4. Re-seal the app bundle last, with entitlements.
          sign --entitlements "$ENTITLEMENTS" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Notarize and staple .app
        if: ${{ env.MACOS_SIGNED == '1' }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT
          ZIP="$RUNNER_TEMP/Dimmy.zip"
          /usr/bin/ditto -c -k --keepParent "$APP_PATH" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --key "$KEY_FILE" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 2h
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: "Generate DMG background (multi-rep TIFF: 1x + 2x Retina)"
        run: |
          brew install librsvg
          # Render both 1× (660×400, matches the Finder window size) and
          # 2× (1320×800, Retina) PNGs, pack them into a single multi-rep
          # TIFF via tiffutil. Finder picks the correct rep at display
          # time based on backing-store scale — crisp on Retina, sharp on
          # non-Retina, no quadrant crop.
          #
          # Previously we shipped a single 2× PNG as --background, but
          # without the @2x naming convention or a multi-rep container
          # Finder treats the 1320×800 source as 1× native and shows only
          # the top-left quadrant inside the 660×400 window → the drag
          # arrow + label drop off-screen (reported on 2026-06-05).
          rsvg-convert -w 660  -h 400 platforms/macos/dmg-assets/dmg-background.svg -o platforms/macos/dmg-assets/dmg-background.png
          rsvg-convert -w 1320 -h 800 platforms/macos/dmg-assets/dmg-background.svg -o platforms/macos/dmg-assets/dmg-background@2x.png
          tiffutil -cathidpicheck \
            platforms/macos/dmg-assets/dmg-background.png \
            platforms/macos/dmg-assets/dmg-background@2x.png \
            -out platforms/macos/dmg-assets/dmg-background.tiff

      - name: Create DMG
        working-directory: platforms/macos
        run: |
          # See note in staging-auto-update.yml — `--app-drop-link`
          # only adds the visual icon; the underlying Applications
          # symlink must be created explicitly. Stage into a dir +
          # ln -s, then point create-dmg at the directory. Without
          # this the DMG ships without a drag-target.
          brew install create-dmg
          APP_PATH="build/derived/Build/Products/Release/Dimmy.app"
          mkdir -p build/dmg-contents
          rm -rf build/dmg-contents/Dimmy.app
          cp -R "$APP_PATH" build/dmg-contents/
          ln -sf /Applications build/dmg-contents/Applications
          create-dmg \
            --volname "Dimmy" \
            --background "dmg-assets/dmg-background.tiff" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "Dimmy.app" 165 200 \
            --app-drop-link 495 200 \
            --no-internet-enable \
            "build/Dimmy-macos-arm64.dmg" \
            "build/dmg-contents"

      # Notarize + staple the DMG so the initial download opens without the
      # "Apple cannot check it for malicious software" Gatekeeper prompt.
      # MUST run BEFORE the Sparkle EdDSA step below: stapling rewrites the
      # DMG bytes, so the EdDSA signature in the appcast has to be computed
      # over the FINAL (stapled) DMG or the auto-update integrity check fails.
      - name: Notarize and staple DMG
        if: ${{ env.MACOS_SIGNED == '1' }}
        working-directory: platforms/macos
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT
          DMG="build/Dimmy-macos-arm64.dmg"
          xcrun notarytool submit "$DMG" \
            --key "$KEY_FILE" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 2h
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Sign DMG with Sparkle EdDSA + generate appcast.xml
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Sparkle's auto-update flow gates on an EdDSA signature
          # embedded in the appcast item. Without it, the running app
          # refuses to install the downloaded DMG (Sparkle 2 default
          # security policy). We sign the DMG, generate an appcast.xml
          # with the signature, and upload both to the release.
          #
          # Graceful degradation: if the SPARKLE_PRIVATE_KEY secret is
          # not set (e.g. first bootstrap release before keys are
          # generated), we warn and skip — the release still ships but
          # users on a previous version won't auto-pick it up. See
          # docs/RELEASING.md → "Mac auto-update bootstrap".
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "::warning::SPARKLE_PRIVATE_KEY secret not set — skipping Sparkle signing. Mac auto-update will not work for this release."
            exit 0
          fi

          # `sign_update` lives inside the SwiftPM-resolved Sparkle
          # checkout under derived data. Find it across the possible
          # paths SPM uses.
          SIGN_UPDATE=$(find platforms/macos/build/derived/SourcePackages -name sign_update -type f -perm +111 2>/dev/null | head -1)
          if [ -z "$SIGN_UPDATE" ]; then
            SIGN_UPDATE=$(find ~/Library/Developer/Xcode/DerivedData -name sign_update -type f -perm +111 2>/dev/null | head -1)
          fi
          if [ -z "$SIGN_UPDATE" ]; then
            echo "::error::sign_update binary not found in resolved Sparkle SPM checkout"
            exit 1
          fi
          echo "Found sign_update at: $SIGN_UPDATE"

          KEY_FILE=$(mktemp)
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          trap "rm -f $KEY_FILE" EXIT

          DMG_PATH="platforms/macos/build/Dimmy-macos-arm64.dmg"
          # `sign_update -f <keyfile> <dmg>` prints something like:
          #   sparkle:edSignature="..." length="12345"
          SIG_LINE=$("$SIGN_UPDATE" -f "$KEY_FILE" "$DMG_PATH")
          echo "Sparkle signature: $SIG_LINE"

          DMG_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Dimmy-macos-arm64.dmg"
          RELEASE_NOTES_URL="https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          PUB_DATE=$(LC_TIME=en_US.UTF-8 date -u +"%a, %d %b %Y %H:%M:%S +0000")
          MIN_OS_VERSION="12.0"

          # GitHub treats releases marked "prerelease" as prereleases —
          # surface that in the appcast so users on the prerelease
          # channel pick it up. github.event.release is populated
          # because this job is triggered by `release.created`.
          IS_PRERELEASE="${{ github.event.release.prerelease }}"
          CHANNEL_TAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            CHANNEL_TAG="<sparkle:channel>prerelease</sparkle:channel>"
          fi

          APPCAST="platforms/macos/build/appcast.xml"
          cat > "$APPCAST" <<EOF
          <?xml version="1.0" standalone="yes"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Dimmy</title>
              <link>$DMG_URL</link>
              <description>Dimmy macOS release feed</description>
              <language>en</language>
              <item>
                <title>Dimmy $VERSION</title>
                <link>$RELEASE_NOTES_URL</link>
                <sparkle:version>$VERSION</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                $CHANNEL_TAG
                <pubDate>$PUB_DATE</pubDate>
                <sparkle:minimumSystemVersion>$MIN_OS_VERSION</sparkle:minimumSystemVersion>
                <enclosure
                  url="$DMG_URL"
                  type="application/octet-stream"
                  $SIG_LINE />
              </item>
            </channel>
          </rss>
          EOF
          echo "=== appcast.xml ==="
          cat "$APPCAST"

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: platforms/macos/build/Dimmy-macos-arm64.dmg
          # Keep the release DRAFT: only the Publish job (after test-install +
          # sign gates) flips it visible. softprops defaults to draft:false, so
          # without this an early build upload publishes the release and clients
          # auto-update to a gate-failing build (burned by v0.6.71-rc4).
          draft: true

      - name: Upload appcast.xml to release
        if: hashFiles('platforms/macos/build/appcast.xml') != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: platforms/macos/build/appcast.xml
          draft: true

      # Durable auto-update channel — Sparkle's SUFeedURL in
      # Info.plist points to `releases/download/auto-update/appcast.xml`.
      # GitHub's `releases/latest/download/...` resolves to the most
      # recent NON-prerelease, so a prerelease-only history (e.g. before
      # we ever cut a prod tag) leaves /latest/ pointing at v0.6.26
      # which has no appcast → 404 → "Update check failed". A fixed tag
      # bypasses /latest/ semantics entirely. Upload is idempotent and
      # --clobber-replaces the asset every release so clients always see
      # the freshest version, regardless of prerelease/stable status.
      - name: Mirror appcast.xml to durable auto-update channel
        if: hashFiles('platforms/macos/build/appcast.xml') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view auto-update >/dev/null 2>&1; then
            echo "Creating durable auto-update release (one-time bootstrap)…"
            gh release create auto-update \
              --title "Auto-update channel (latest appcast)" \
              --notes "Holds the latest Sparkle appcast.xml at a stable URL. Auto-updated on every release by .github/workflows/release.yml. DO NOT DELETE — Sparkle clients in production reference this tag's download path."
          fi
          gh release upload auto-update platforms/macos/build/appcast.xml --clobber
          echo "appcast.xml mirrored to releases/download/auto-update/appcast.xml"

  # ── Windows Native Build ───────────────────────────────────────────
  build-windows:
    name: Build Windows Native
    needs: create-release
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest

      - name: Install VS 2026 BuildTools side-by-side (MSVC 14.50+)
        shell: pwsh
        run: |
          # windows-2025 ships VS 2022 Enterprise only (MSVC 14.44, which
          # miscompiles whisper.cpp's ggml-vulkan state-init path). MSVC
          # 14.50+ exists only in VS 2026 (VS 18). Install path: Microsoft
          # has not yet registered aka.ms/vs/18/* short-urls (they all
          # redirect to Bing), so the official bootstrapper has no public
          # direct URL. Chocolatey hosts the preview package that internally
          # fetches the signed installer from Microsoft's CDN. Install it
          # side-by-side with VS 2022 — VS 2022 stays authoritative for the
          # .NET publish + UWP AppxPackage PRI generation steps because the
          # BuildTools SKU lacks those workloads.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs2026 = & $vswhere -version "[18.0,19.0)" -prerelease -products "*" -property installationPath 2>$null | Select-Object -First 1
          if ($vs2026) {
            Write-Host "VS 2026 already present at $vs2026"
          } else {
            Write-Host "Installing visualstudio2026buildtools-preview via chocolatey..."
            # choco's --package-parameters is a single string passed to the
            # VS bootstrapper. --wait blocks until install completes.
            $params = "--add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.Component.Windows11SDK.22621 --quiet --norestart --wait --nocache"
            # Retry on transient community.chocolatey.org outages (503/504
            # on V2 feed — chocolatey silently exits 0 on fetch failure,
            # so we retry based on observed install result, not exit code).
            # Each attempt: choco install → poll vswhere 60s → check present.
            $maxTries = 3
            $attempt = 0
            do {
              $attempt++
              Write-Host "choco install attempt $attempt/$maxTries..."
              choco install visualstudio2026buildtools-preview -y --pre --no-progress --package-parameters="$params"
              $rc = $LASTEXITCODE
              # Poll vswhere — Installer registration can lag a few seconds
              # after choco reports "installed" (exit 3010 = reboot-pending).
              for ($i = 0; $i -lt 12; $i++) {
                Start-Sleep -Seconds 5
                $vs2026 = & $vswhere -version "[18.0,19.0)" -prerelease -products "*" -property installationPath 2>$null | Select-Object -First 1
                if ($vs2026) { break }
              }
              if ($vs2026) { break }
              if ($attempt -lt $maxTries) {
                $backoff = 30 * $attempt
                Write-Host "Attempt $attempt did not produce VS 2026 (choco exit $rc). Retrying in ${backoff}s..."
                Start-Sleep -Seconds $backoff
              }
            } while ($attempt -lt $maxTries)
            if (-not $vs2026) {
              throw "VS 2026 not found after $maxTries chocolatey attempts (community.chocolatey.org may be degraded — re-run workflow when repo recovers)"
            }
          }
          Write-Host "VS 2026 installationPath: '$vs2026'"
          $mscvDir = Join-Path $vs2026 "VC\Tools\MSVC"
          Write-Host "Listing MSVC toolchains at: $mscvDir"
          if (-not (Test-Path $mscvDir)) { throw "VC\Tools\MSVC not found — VCTools workload missing" }
          $tools = Get-ChildItem $mscvDir -Directory -ErrorAction Stop | Sort-Object Name -Descending
          Write-Host "Found $($tools.Count) MSVC toolchain(s): $($tools.Name -join ', ')"
          if (-not $tools -or $tools.Count -eq 0) { throw "VC\Tools\MSVC is empty" }
          $toolName = $tools[0].Name
          Write-Host "Picking newest: $toolName"
          $verMatch = [regex]::Match($toolName, '^(\d+)\.(\d+)')
          if (-not $verMatch.Success) { throw "Cannot parse major.minor from toolchain name '$toolName'" }
          $major = [int]$verMatch.Groups[1].Value
          $minor = [int]$verMatch.Groups[2].Value
          Write-Host "Parsed major=$major minor=$minor"
          if ($major -lt 14 -or ($major -eq 14 -and $minor -lt 50)) {
            throw "VS 2026 has MSVC $toolName (major=$major, minor=$minor), < 14.50 required"
          }
          Write-Host "Toolchain OK, exporting VS2026_PATH"
          Add-Content -Path $env:GITHUB_ENV -Value "VS2026_PATH=$vs2026" -Encoding utf8
          Write-Host "DONE"
          # choco's exit 3010 (reboot-required) sets $LASTEXITCODE=3010 and
          # in pwsh 7.3+ with $PSNativeCommandUseErrorActionPreference=$true
          # the GitHub Actions wrapper returns non-zero at step end regardless
          # of subsequent logic. Explicit exit 0 overrides.
          exit 0

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          # Retry based on observed install result — chocolatey silently
          # exits 0 on V2 feed fetch failures (503/504), so we verify
          # C:\VulkanSDK exists rather than trusting the exit code.
          $maxTries = 3
          $attempt = 0
          $sdkDir = $null
          do {
            $attempt++
            Write-Host "choco install vulkan-sdk attempt $attempt/$maxTries..."
            choco install vulkan-sdk -y --no-progress
            $sdkDir = Get-ChildItem "C:\VulkanSDK" -Directory -ErrorAction SilentlyContinue |
                      Sort-Object Name -Descending | Select-Object -First 1
            if ($sdkDir) { break }
            if ($attempt -lt $maxTries) {
              $backoff = 30 * $attempt
              Write-Host "Attempt $attempt did not produce VulkanSDK. Retrying in ${backoff}s..."
              Start-Sleep -Seconds $backoff
            }
          } while ($attempt -lt $maxTries)
          if (-not $sdkDir) {
            throw "VulkanSDK not found after $maxTries chocolatey attempts (community.chocolatey.org may be degraded — re-run workflow when repo recovers)"
          }
          echo "VULKAN_SDK=$($sdkDir.FullName)" >> $env:GITHUB_ENV
          echo "$($sdkDir.FullName)\Bin" >> $env:GITHUB_PATH
          Write-Host "Vulkan SDK: $($sdkDir.FullName)"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          shared-key: windows-release

      - name: Fetch onnxruntime win-x64 DLL (Parakeet ort path)
        # Mirrors the macOS download-onnxruntime.sh step. ort 2.0.0-rc.10
        # binds to onnxruntime 1.22.0; the .csproj CopyOrtDll target reads
        # this path so the DLL ends up next to dimmy_lib.dll in publish/.
        shell: pwsh
        run: scripts/download-onnxruntime.ps1

      # ── DLL reuse: skip the ~15min build when the Rust core is unchanged ──
      # Validated on staging-tester (v0.6.66-staging.2): HIT -> build skipped
      # -> build-windows dropped from ~24min to ~6.5min. Fail-safe: any error
      # degrades to MISS -> full build. The dumpbin linker gate below still
      # validates the restored DLL.
      - name: Restore prebuilt core DLL from cache
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          SCCACHE_R2_ENDPOINT: ${{ secrets.SCCACHE_R2_ENDPOINT }}
          # MUST mirror the Build step's embedded env so the hash matches.
          DIMMY_LICENSE_PUBKEY: ${{ secrets.DIMMY_LICENSE_PUBKEY }}
          DIMMY_LICENSE_SERVER_URL: https://license.dimmy.app
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          DIMMY_TELEGRAM_API_ID: ${{ secrets.DIMMY_TELEGRAM_API_ID }}
          DIMMY_TELEGRAM_API_HASH: ${{ secrets.DIMMY_TELEGRAM_API_HASH }}
          FEAT: "local-stt-vulkan,local-llm-vulkan,local-stt-parakeet,license-client,telegram"
        run: |
          res="$(scripts/dev/dll-cache.sh restore win-x64 "$FEAT" "D:/t/release/dimmy_lib.dll" || echo MISS)"
          echo "restore: $res"
          if [ "$res" = "HIT" ]; then
            echo "DLL_REUSED=1" >> "$GITHUB_ENV"
            echo "::notice title=DLL reuse::core unchanged — reused cached dimmy_lib.dll, skipped the ~15min build"
          else
            echo "::notice title=DLL reuse::core changed / no cache — full build"
          fi

      - name: Build Rust DLL (VS 2026 MSVC env)
        if: env.DLL_REUSED != '1'
        working-directory: core
        shell: cmd
        env:
          LIBCLANG_PATH: "C:\\Program Files\\LLVM\\bin"
          CMAKE_GENERATOR: Ninja
          CARGO_TARGET_DIR: "D:\\t"
          # Diagnostic build (see macOS step for the rationale).
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Licensing v2 — same env var the macOS build above injects.
          # Embedded into core/src/license.rs via option_env!.
          DIMMY_LICENSE_PUBKEY: ${{ secrets.DIMMY_LICENSE_PUBKEY }}
          DIMMY_LICENSE_SERVER_URL: https://license.dimmy.app
          # Telegram api_id/hash baked via option_env! (core/src/telegram.rs).
          DIMMY_TELEGRAM_API_ID: ${{ secrets.DIMMY_TELEGRAM_API_ID }}
          DIMMY_TELEGRAM_API_HASH: ${{ secrets.DIMMY_TELEGRAM_API_HASH }}
        run: |
          REM Activate VS 2026 MSVC for this step only — PATH, INCLUDE,
          REM LIB point at the 14.50+ toolchain. Subsequent steps inherit
          REM the original job env (VS 2022) because activation is
          REM scoped to this shell invocation. cmd is required because
          REM vcvars64.bat is a batch script.
          call "%VS2026_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          REM ── cargo clean --release: RE-ADDED 2026-07-28 ──
          REM     Dropped 2026-05-14 for speed (reuse Swatinem rust-cache),
          REM     but v0.6.69-rc1 shipped a MISCOMPILED whisper.cpp: the
          REM     Swatinem cache restored stale objects and, with no clean,
          REM     they linked into a DLL that CRASHED whisper (0xc000001d)
          REM     at runtime while still passing the >=14.50 linker gate.
          REM     Per feedback_cargo_clean_dropped_from_win_ci.md this is the
          REM     documented fix. This whole step is still SKIPPED entirely
          REM     when the core is unchanged (DLL-reuse via dll-cache.sh),
          REM     so `cargo clean` only runs on a real rebuild.
          cargo clean --release
          cargo build --lib --release --features local-stt-vulkan,local-llm-vulkan,local-stt-parakeet,license-client,telegram
          if errorlevel 1 exit /b 1
          REM ── PRESERVE the production DLL before the whisper gate ──
          REM The gate below runs `cargo test --features ...,test-ffi` in THIS
          REM SAME target dir (D:\t). Because the core is crate-type cdylib,
          REM that re-emits dimmy_lib.dll with the test-ffi feature + the WRONG
          REM feature set (no parakeet/llm/license-client) and OVERWRITES this
          REM freshly built production DLL. Shipping that DLL makes dimmy_init
          REM REFUSE ("test-ffi without DIMMY_TEST_CONFIG_DIR") and the app
          REM aborts at startup (0xc0000409). Burned rc4/rc5/rc6 on 2026-07-30
          REM (misdiagnosed as a "nondeterministic MSVC miscompile" — it was
          REM 100% deterministic self-poisoning). Stash the good DLL; the
          REM "Restore production DLL" step puts it back after the gate.
          copy /Y "D:\t\release\dimmy_lib.dll" "D:\t\dimmy_lib.prod.dll"
          if errorlevel 1 exit /b 1

      - name: Gate — whisper transcription smoke test (catch miscompiled whisper.cpp)
        # The >=14.50 linker gate is NOT enough on its own: v0.6.69-rc1 and
        # v0.6.71-rc3 shipped a whisper.cpp that linked at 14.51 (gate green) but
        # crashed 0xc000001d the instant whisper ran. This runs the REAL whisper
        # path (tests/ffi_e2e -> tiny model + JFK sample -> assert transcript
        # contains "ask not"), REUSING the whisper.cpp objects just built in D:\t.
        # A broken whisper crashes the transcription so this step fails BEFORE the
        # Store below -> the bad DLL is never cached and the release does not
        # publish. GitHub-hosted runner has no GPU, so this exercises the CPU
        # whisper path. Fresh build only.
        #
        # ⚠️ SIDE EFFECT: `cargo test` with `test-ffi` re-emits the cdylib
        # dimmy_lib.dll into D:\t\release with the WRONG feature set. The
        # "Restore production DLL" step immediately below undoes that. Do NOT
        # move packaging before the restore. (See the Build step's PRESERVE note.)
        if: env.DLL_REUSED != '1'
        working-directory: core
        shell: cmd
        env:
          LIBCLANG_PATH: "C:\\Program Files\\LLVM\\bin"
          CMAKE_GENERATOR: Ninja
          CARGO_TARGET_DIR: "D:\\t"
        run: |
          call "%VS2026_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cargo test --release --test ffi_e2e --features local-stt-vulkan,test-ffi -- --test-threads=1 --nocapture

      - name: Restore production DLL (undo the gate's test-ffi clobber)
        # The whisper gate above rebuilt dimmy_lib.dll with test-ffi + the wrong
        # feature set in the shared D:\t target dir. Put the real production DLL
        # (stashed by the Build step) back so the Store, linker gate, and
        # packaging all ship the frozen-feature build — NOT the test-ffi one that
        # aborts at startup (0xc0000409). This step only runs if the gate passed;
        # a gate failure fails the job honestly (no masking). Burned rc4/rc5/rc6.
        if: env.DLL_REUSED != '1'
        shell: cmd
        run: |
          copy /Y "D:\t\dimmy_lib.prod.dll" "D:\t\release\dimmy_lib.dll"
          if errorlevel 1 exit /b 1

      - name: Store prebuilt core DLL to cache
        if: env.DLL_REUSED != '1'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          SCCACHE_R2_ENDPOINT: ${{ secrets.SCCACHE_R2_ENDPOINT }}
          DIMMY_LICENSE_PUBKEY: ${{ secrets.DIMMY_LICENSE_PUBKEY }}
          DIMMY_LICENSE_SERVER_URL: https://license.dimmy.app
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          DIMMY_TELEGRAM_API_ID: ${{ secrets.DIMMY_TELEGRAM_API_ID }}
          DIMMY_TELEGRAM_API_HASH: ${{ secrets.DIMMY_TELEGRAM_API_HASH }}
          FEAT: "local-stt-vulkan,local-llm-vulkan,local-stt-parakeet,license-client,telegram"
        run: scripts/dev/dll-cache.sh store win-x64 "$FEAT" "D:/t/release/dimmy_lib.dll" || true

      - name: Gate — verify dimmy_lib.dll linker version
        shell: pwsh
        run: |
          # Hard gate: the whisper Vulkan backend miscompile lives in MSVC
          # linker <= 14.44. Any DLL linked with an older toolchain must NOT
          # ship. Extracts linker version from PE headers via dumpbin.
          # dumpbin is not in PATH here (the previous step's vcvars
          # activation was scoped to that cmd subshell), so locate it under
          # VS2026_PATH.
          $dll = "D:\t\release\dimmy_lib.dll"
          if (-not (Test-Path $dll)) { throw "dimmy_lib.dll not found at $dll" }
          $mscvDir = Join-Path $env:VS2026_PATH "VC\Tools\MSVC"
          $tool = Get-ChildItem $mscvDir -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $dumpbin = Join-Path $tool.FullName "bin\Hostx64\x64\dumpbin.exe"
          if (-not (Test-Path $dumpbin)) { throw "dumpbin.exe not found at $dumpbin" }
          Write-Host "Using dumpbin at: $dumpbin"
          $out = & $dumpbin /headers $dll
          $line = $out | Select-String "linker version" | Select-Object -First 1
          if (-not $line) { throw "Could not find linker version in dumpbin output" }
          if ($line -notmatch '(\d+)\.(\d+)') { throw "Could not parse linker version from '$line'" }
          $major = [int]$Matches[1]
          $minor = [int]$Matches[2]
          Write-Host "dimmy_lib.dll linker version: $major.$minor"
          if ($major -lt 14 -or ($major -eq 14 -and $minor -lt 50)) {
            throw "dimmy_lib.dll linked with MSVC $major.$minor. Known whisper.cpp Vulkan codegen bug in <14.50. Aborting release."
          }
          exit 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # Restore-only: the combined actions/cache auto-registers a *post*
      # save step that tars ~/.nuget/packages at teardown, when leftover
      # build-server processes (dotnet/VBCSCompiler/vctip) still hold file
      # locks on Windows → tar exits non-zero → the whole build job goes
      # red AFTER the binary is already built + uploaded, which skips
      # Test Install + Publish Release for nothing. Split into restore +
      # an explicit best-effort save right after `dotnet restore` (no
      # build running yet = no locks); continue-on-error so a save hiccup
      # can never fail the release.
      - name: Restore NuGet cache
        id: nuget-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore NuGet packages
        working-directory: platforms/windows/Dimmy.Windows
        run: dotnet restore

      - name: Save NuGet cache
        if: steps.nuget-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}

      - name: Locate VS AppxPackage tools (for MrtCore PRI generation)
        shell: pwsh
        run: |
          # MrtCore.PriGen.targets references Microsoft.Build.Packaging.Pri.Tasks.dll
          # which only ships with the VS AppxPackage workload, not the .NET SDK.
          # Without it, resources.pri is not generated and the app runs headless at
          # runtime (every ms-appx:///Views/*.xaml URI fails to resolve).
          # Pin to VS 2022 (17.x) — the side-by-side VS 2026 BuildTools used
          # for the Rust build lacks UWP/AppxPackage workloads entirely, so
          # a naive `-latest` would pick VS 2026 and this step would fail.
          # Accept either VS 2022 (17.x) or VS 2026 Enterprise (18.x).
          # The candidates array below probes both v17.0/AppxPackage and
          # v18.0/AppxPackage subpaths, so vswhere just needs to surface
          # ANY VS install with the UWP workload. On the new
          # windows-2025-vs2026 runner image VS 2022 is gone and VS 2026
          # Enterprise ships in its place — restricting to [17.0,18.0)
          # would fail there.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -version "[17.0,19.0)" -prerelease -products "*" -property installationPath | Select-Object -First 1
          if (-not $vs) { throw "vswhere did not find a VS 2022 or VS 2026 install" }
          $candidates = @(
            "$vs\MSBuild\Microsoft\VisualStudio\v17.0\AppxPackage\",
            "$vs\MSBuild\Microsoft\VisualStudio\v18.0\AppxPackage\"
          )
          $found = $candidates | Where-Object { Test-Path (Join-Path $_ "Microsoft.Build.Packaging.Pri.Tasks.dll") } | Select-Object -First 1
          if (-not $found) {
            Write-Host "VS install at: $vs"
            Write-Host "Probed paths:"
            $candidates | ForEach-Object { Write-Host "  - $_" }
            throw "Microsoft.Build.Packaging.Pri.Tasks.dll not found in VS install. UWP workload missing?"
          }
          Write-Host "AppxMSBuildToolsPath = $found"
          echo "AppxMSBuildToolsPath=$found" >> $env:GITHUB_ENV

      - name: Publish Windows app (self-contained)
        working-directory: platforms/windows/Dimmy.Windows
        run: dotnet publish Dimmy.Windows.csproj -c Release -r win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -p:SelfContained=true "-p:AppxMSBuildToolsPath=$env:AppxMSBuildToolsPath" -o publish

      - name: Prepare distribution
        shell: pwsh
        run: |
          # No co-located VC++ runtime: Velopack `--framework vcredist143-x64`
          # already installs the official Microsoft VC Redist at setup time,
          # which lands in System32. Shipping a second copy next to
          # dimmy_lib.dll is at best redundant and at worst overrides System32
          # with an older ABI (v0.6.10 crash cause). System32 wins.
          $pubDir = "platforms/windows/Dimmy.Windows/publish"
          Copy-Item "D:\t\release\dimmy_lib.dll" "$pubDir/"
          # onnxruntime — Parakeet ort path's runtime dependency. Same
          # rationale as staging-auto-update.yml: dotnet publish dropped its
          # output in publish/, so we co-locate the native DLLs there.
          $ortLib = "core/target/onnxruntime-win-x64-1.22.0/lib"
          Copy-Item "$ortLib/onnxruntime.dll" "$pubDir/"
          Copy-Item "$ortLib/onnxruntime_providers_shared.dll" "$pubDir/"
          # Silero VAD model, same reason: the csproj target copies it to the
          # BUILD output, but Velopack packs `publish/`, so without this line
          # it never reaches the installer. It shipped missing in v0.6.71-rc9
          # and nobody noticed, because a missing model degrades silently to
          # the RNNoise gate instead of failing. Hence the assert below.
          Copy-Item "core/assets/ggml-silero-v6.2.0.bin" "$pubDir/"
          if (-not (Test-Path "$pubDir/ggml-silero-v6.2.0.bin")) {
            throw "Silero VAD model missing from publish dir — the chunk gate would silently fall back to RNNoise"
          }
          # Bundle the dimmy-mcp MCP server next to the app exe (Win parity
          # with the macOS .app Resources copy) so the INSTALLED app exposes
          # meetings to Claude Code / Claude Desktop. Self-contained Rust stdio
          # binary; no whisper/vulkan, so no MSVC 14.50 gate needed. Relies on
          # the same System32 VC redist Velopack installs via --framework.
          # ClaudeDesktopConnectDialog.ResolveMcpBinaryPath() looks for it next
          # to Dimmy.Windows.exe — i.e. here in publish/ → current/ at install.
          cargo build --release --manifest-path mcp-server/Cargo.toml
          Copy-Item "mcp-server/target/release/dimmy-mcp.exe" "$pubDir/" -Force
          Get-ChildItem "$pubDir" -Filter "*.pdb" -Recurse | Remove-Item -ErrorAction SilentlyContinue

      # The self-hosted `sign-windows` job consumes this to Authenticode-sign
      # the Dimmy binaries with the Certum cloud cert and re-pack signed.
      - name: Upload unsigned publish dir (for self-hosted signing)
        uses: actions/upload-artifact@v4
        with:
          name: win-publish
          path: platforms/windows/Dimmy.Windows/publish
          retention-days: 1

      - name: Verify self-contained bundle
        shell: pwsh
        run: platforms/windows/verify-self-contained.ps1 -Path platforms/windows/Dimmy.Windows/publish

      - name: Run Windows tests
        working-directory: platforms/windows/Dimmy.Windows.Tests
        run: dotnet test -c Release --logger "console;verbosity=normal"

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Package with Velopack
        shell: pwsh
        run: |
          $version = "${{ needs.create-release.outputs.version }}"
          $pubDir = (Resolve-Path "platforms/windows/Dimmy.Windows/publish").Path
          Write-Host "Packing Velopack v$version from $pubDir"
          vpk pack --packId Dimmy --packVersion $version --packDir "$pubDir" --mainExe Dimmy.Windows.exe --icon "platforms/windows/Dimmy.Windows/Assets/dimmy.ico" --framework "vcredist143-x64" --outputDir platforms/windows/velopack-output
          Get-ChildItem platforms/windows/velopack-output | ForEach-Object { Write-Host "$($_.Name) ($([math]::Round($_.Length/1MB, 1)) MB)" }

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          # Keep DRAFT until the Publish job (after gates). This step uploads
          # releases.win.json (the Velopack auto-update manifest); publishing it
          # early is exactly what auto-updated users into the broken rc4.
          draft: true
          files: |
            platforms/windows/velopack-output/Dimmy-win-Setup.exe
            platforms/windows/velopack-output/Dimmy-win-Portable.zip
            platforms/windows/velopack-output/Dimmy-*-full.nupkg
            platforms/windows/velopack-output/releases.win.json

  # ── Full Authenticode signing on the self-hosted runner (Konrad's PC) ──
  # PROD twin of staging-tester's sign-windows: same design, prod vpk args
  # (packId Dimmy, default channel) + prod asset names (Dimmy-win-*). The
  # Certum cloud key is non-exportable / no headless login → signing is
  # local-only on the self-hosted runner (label `dimmy-sign`).
  # PREREQ: runner PC-KDALLA ONLINE + SimplySign Desktop LOGGED IN.
  # SAFE BY DESIGN: build-windows already uploaded the UNSIGNED assets, so if
  # this job is skipped/fails the release still works — re-run sign-windows
  # after logging into SimplySign.
  sign-windows:
    name: Sign Windows (self-hosted Certum)
    needs: [create-release, build-windows]
    runs-on: [self-hosted, dimmy-sign]
    steps:
      - uses: actions/checkout@v5

      - name: Download unsigned publish dir
        uses: actions/download-artifact@v4
        with:
          name: win-publish
          path: platforms/windows/Dimmy.Windows/publish

      - name: Sign Dimmy binaries + re-pack signed + overwrite assets
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $thumb = "DD0AD19CFEB75B2D02A58363CA17CF0ED16BFDB4"
          $ts = "http://time.certum.pl/"

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found (Windows SDK missing on runner)." }
          $pubDir = (Resolve-Path "platforms/windows/Dimmy.Windows/publish").Path

          # Sign only Dimmy-owned binaries (Microsoft's runtime DLLs are already signed).
          $mine = @("Dimmy.Windows.exe", "Dimmy.Windows.dll", "dimmy_lib.dll", "dimmy-mcp.exe")
          foreach ($name in $mine) {
            $f = Join-Path $pubDir $name
            if (Test-Path $f) {
              Write-Host "Signing $name"
              & $signtool.FullName sign /sha1 $thumb /fd sha256 /tr $ts /td sha256 $f
              if ($LASTEXITCODE -ne 0) { throw "Sign failed on $name. Is SimplySign Desktop logged in?" }
            }
          }

          # Re-pack with Velopack (PROD args: packId Dimmy, default channel),
          # signing the Setup/Update/main wrapper exes via --signParams.
          dotnet tool install -g vpk 2>$null
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          $version = "${{ needs.create-release.outputs.version }}"
          if (Test-Path velopack-output) { Remove-Item velopack-output -Recurse -Force }
          vpk pack --packId Dimmy --packVersion $version --packDir "$pubDir" --mainExe Dimmy.Windows.exe --icon "platforms/windows/Dimmy.Windows/Assets/dimmy.ico" --framework "vcredist143-x64" --signParams "/sha1 $thumb /fd sha256 /tr $ts /td sha256" --outputDir velopack-output
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed." }

          # Overwrite the release assets with the signed ones.
          $tag = "${{ github.ref_name }}"
          $files = Get-ChildItem velopack-output -Recurse -Include "Dimmy-win-Setup.exe","Dimmy-win-Portable.zip","Dimmy-*-full.nupkg","releases.win.json" |
            ForEach-Object { $_.FullName }
          if (-not $files) { throw "No Velopack output to upload." }
          gh release upload $tag $files --repo "$env:GITHUB_REPOSITORY" --clobber
          Write-Host "=== Signed Windows assets uploaded to $tag ==="

      # Hand the SIGNED Setup.exe to the R2-publish job (hosted runner has the
      # aws CLI; this self-hosted runner may not). Stable releases only — gated
      # on the consuming job, but skip the upload for rc/prerelease to avoid a
      # ~120 MB artifact round-trip that nothing consumes.
      - name: Upload signed Setup.exe artifact (for R2 publish)
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/upload-artifact@v4
        with:
          name: signed-win-setup
          path: |
            velopack-output/Dimmy-win-Setup.exe
            velopack-output/**/Dimmy-win-Setup.exe
          if-no-files-found: error

  # ── Publish Windows Setup.exe to R2 (dl.dimmy.app) ─────────────────
  # STABLE releases only (`!contains(ref_name,'-')`) so an rc/prerelease can
  # NEVER overwrite the public download the website links to. Reuses the same
  # R2 token as the DLL-cache (now scoped read+write on both buckets); the
  # account-level endpoint means the `dimmy-downloads` bucket is just a
  # different s3:// path. Publishes an immutable versioned key (for the
  # Microsoft Store package URL — must be redirect-free) AND overwrites the
  # `Dimmy-win-Setup.exe` latest alias (for the website download button).
  publish-r2-windows:
    name: Publish Windows Setup to R2 (dl.dimmy.app)
    needs: [create-release, sign-windows]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download signed Setup.exe
        uses: actions/download-artifact@v4
        with:
          name: signed-win-setup
          path: r2in

      - name: Upload to R2 dimmy-downloads
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.SCCACHE_R2_ENDPOINT }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          setup="$(find r2in -name 'Dimmy-win-Setup.exe' | head -1)"
          if [ -z "$setup" ]; then echo "::error::signed Setup.exe artifact not found"; exit 1; fi
          sha=$(sha256sum "$setup" | cut -d' ' -f1)
          size=$(stat -c%s "$setup")
          echo "Setup.exe: $setup  size=$size  sha256=$sha  version=$VERSION"
          if [ "$size" -lt 10000000 ]; then echo "::error::Setup.exe suspiciously small ($size bytes) — aborting"; exit 1; fi
          for key in "Dimmy-win-Setup-${VERSION}.exe" "Dimmy-win-Setup.exe"; do
            aws s3 cp "$setup" "s3://dimmy-downloads/${key}" \
              --endpoint-url "$R2_ENDPOINT" --region auto \
              --content-type application/octet-stream
            echo "  published -> https://dl.dimmy.app/${key}"
          done
          echo "::notice title=R2 publish::Dimmy-win-Setup-${VERSION}.exe (sha256 ${sha}) live on dl.dimmy.app"

  # ── Linux Native Build ─────────────────────────────────────────────
  build-linux:
    name: Build Linux (GTK4)
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platforms/linux/target
          key: linux-cargo-${{ hashFiles('platforms/linux/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Install GTK4 + libadwaita dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libdbus-1-dev pkg-config \
            libasound2-dev libxdo-dev libfuse2 cmake

      - name: Clippy
        working-directory: platforms/linux
        run: cargo clippy -- -D warnings

      - name: Test
        working-directory: platforms/linux
        run: cargo test

      - name: Build release
        working-directory: platforms/linux
        env:
          # Diagnostic build (see macOS step for the rationale).
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Licensing v2 — same env var the other build steps inject.
          DIMMY_LICENSE_PUBKEY: ${{ secrets.DIMMY_LICENSE_PUBKEY }}
          DIMMY_LICENSE_SERVER_URL: https://license.dimmy.app
        run: cargo build --release --features license-client

      - name: Package AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh

          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp platforms/linux/target/release/dimmy-linux AppDir/usr/bin/
          cp platforms/linux/assets/com.dimmy.app.desktop AppDir/usr/share/applications/
          cp platforms/linux/assets/com.dimmy.app.svg AppDir/usr/share/icons/hicolor/scalable/apps/

          export DEPLOY_GTK_VERSION=4
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin gtk \
            --desktop-file platforms/linux/assets/com.dimmy.app.desktop \
            --icon-file platforms/linux/assets/com.dimmy.app.svg \
            --output appimage

          mv Dimmy*.AppImage Dimmy-linux-x86_64.AppImage

      - name: Upload AppImage to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: Dimmy-linux-x86_64.AppImage
          draft: true

  # ── Clean-machine install test ──────────────────────────────────────
  # Gates publish: a broken installer must never leave draft state on a real v-tag.
  test-install:
    name: Test Install (Clean Windows)
    needs: build-windows
    uses: ./.github/workflows/test-install.yml
    permissions:
      contents: write
    with:
      tag: ${{ github.ref_name }}

  # ── Publish (waits for all jobs including test-install) ─────────────
  publish-release:
    name: Publish Release
    # sign-windows is a required dependency: the release is created as a DRAFT
    # and only flipped to public here, so it never goes live with unsigned
    # Windows assets. If signing fails (SimplySign not logged in), the release
    # stays draft — log into SimplySign and re-run the failed jobs.
    needs: [rust-check, create-release, build-macos, build-windows, build-linux, test-install, sign-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });
