name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ── Rust core lint + test ──────────────────────────────────────────
  rust-check:
    name: Rust Lint & Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxdo-dev libdbus-1-dev libssl-dev cmake

      - name: Format
        working-directory: core
        run: cargo fmt --check

      - name: Clippy
        working-directory: core
        run: cargo clippy --features local-stt,local-llm -- -D warnings

      - name: Test
        working-directory: core
        run: cargo test --lib --features local-stt

  # ── Create release placeholder ─────────────────────────────────────
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | head -n 2 | tail -n 1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$GITHUB_REF_NAME" ]; then
            COMMITS=$(git log --pretty=format:"- %s" HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD")
          fi
          {
            echo "## What's Changed"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "## Downloads"
            echo ""
            echo "| Platform | File | Requirements |"
            echo "|----------|------|--------------|"
            echo "| Windows (installer) | \`Dimmy-win-Setup.exe\` | None (installs .NET 8 automatically) |"
            echo "| Windows (portable) | \`Dimmy-win-Portable.zip\` | [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0) |"
            echo "| macOS (Apple Silicon) | \`Dimmy-macos-arm64.dmg\` | macOS 12+ |"
            echo "| Linux | \`Dimmy-linux-x86_64.AppImage\` | None (GTK4 bundled) |"
            echo ""
            echo "## Installation Notes"
            echo ""
            echo "**Windows:** Download \`Dimmy-win-Setup.exe\` and run. Installs .NET 8 automatically if needed."
            echo ""
            echo "**macOS:** Open the DMG, drag to Applications. First launch: right-click -> Open, or run:"
            echo "\`\`\`"
            echo "xattr -d com.apple.quarantine /Applications/Dimmy.app"
            echo "\`\`\`"
            echo ""
            echo "**Linux:** Make AppImage executable (\`chmod +x\`) and run."
            echo ""
            echo "---"
            echo "*Check for updates in Dimmy Settings > About.*"
          } > changelog.md
          cat changelog.md

      - name: Create GitHub Release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Dimmy ${{ github.ref_name }}"
          body_path: changelog.md
          draft: true
          prerelease: false

  # ── macOS Native Build ─────────────────────────────────────────────
  build-macos:
    name: Build macOS Native
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install CMake
        run: |
          brew install cmake
          cmake --version

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build Rust static library
        working-directory: core
        run: |
          echo "CMake: $(cmake --version | head -1)"
          echo "Xcode CLT: $(xcode-select -p)"
          cargo build --lib --release --target aarch64-apple-darwin --features local-stt-metal,local-llm-metal

      - name: Verify static library and prepare dylibs
        run: |
          ls -lh core/target/aarch64-apple-darwin/release/libdimmy_lib.a
          file core/target/aarch64-apple-darwin/release/libdimmy_lib.a
          rm -f core/target/aarch64-apple-darwin/release/libdimmy_lib.dylib
          rm -f core/target/aarch64-apple-darwin/release/deps/libdimmy_lib.dylib
          # Find llama.cpp dylib from llama-cpp-sys-4 build and copy to release dir
          # so Xcode can find it during linking
          echo "=== Searching for llama dylibs ==="
          find core/target/aarch64-apple-darwin/release -name "libllama*" -type f 2>/dev/null
          LLCB_DIR=$(find core/target/aarch64-apple-darwin/release/build -type d -name "out" -path "*llama-cpp-sys*" 2>/dev/null | head -1)
          if [ -n "$LLCB_DIR" ]; then
            echo "llama-cpp-sys build dir: $LLCB_DIR"
            find "$LLCB_DIR" -name "*.dylib" -o -name "*.a" 2>/dev/null | head -10
            # Copy dylibs to the release dir where Xcode's LIBRARY_SEARCH_PATHS points
            cp "$LLCB_DIR"/lib/*.dylib core/target/aarch64-apple-darwin/release/ 2>/dev/null || true
            cp "$LLCB_DIR"/*.dylib core/target/aarch64-apple-darwin/release/ 2>/dev/null || true
          fi
          # Also check the llcb cache dir
          find "$HOME/Library" -path "*/llcb/*" -name "libllama*" 2>/dev/null | head -5
          LLCB_CACHE=$(find "$HOME" -type d -name "llcb" 2>/dev/null | head -1)
          if [ -n "$LLCB_CACHE" ]; then
            find "$LLCB_CACHE" -name "*.dylib" 2>/dev/null | while read f; do
              cp "$f" core/target/aarch64-apple-darwin/release/ 2>/dev/null
              echo "Copied: $f"
            done
          fi
          echo "=== Release dir dylibs ==="
          ls -la core/target/aarch64-apple-darwin/release/*.dylib 2>/dev/null || echo "No dylibs in release dir"

      - name: Build Xcode project
        working-directory: platforms/macos
        run: |
          xcodebuild -project Dimmy.xcodeproj \
            -scheme Dimmy \
            -configuration Release \
            -derivedDataPath build/derived \
            build \
            CODE_SIGN_IDENTITY="-"

      - name: Bundle llama.cpp dylib
        run: |
          APP_PATH="platforms/macos/build/derived/Build/Products/Release/Dimmy.app"
          FRAMEWORKS_DIR="$APP_PATH/Contents/Frameworks"
          mkdir -p "$FRAMEWORKS_DIR"
          # Find and copy libllama.dylib from llama-cpp-sys-4 build output
          DYLIB=$(find core/target/aarch64-apple-darwin/release -name "libllama.dylib" -o -name "libllama.*.dylib" | head -1)
          if [ -n "$DYLIB" ]; then
            cp "$DYLIB" "$FRAMEWORKS_DIR/"
            echo "Copied $DYLIB to Frameworks"
            # Fix rpath so the app finds the dylib
            install_name_tool -add_rpath @executable_path/../Frameworks "$APP_PATH/Contents/MacOS/Dimmy" 2>/dev/null || true
          else
            echo "WARNING: libllama.dylib not found — LLM will use CPU fallback"
            # Also check for ggml dylibs
            find core/target/aarch64-apple-darwin/release -name "*.dylib" | head -10
          fi

      - name: Create DMG
        working-directory: platforms/macos
        run: |
          APP_PATH="build/derived/Build/Products/Release/Dimmy.app"
          mkdir -p build/dmg
          cp -R "$APP_PATH" build/dmg/
          hdiutil create -volname "Dimmy" \
            -srcfolder build/dmg \
            -ov -format UDZO \
            "build/Dimmy-macos-arm64.dmg"

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: platforms/macos/build/Dimmy-macos-arm64.dmg

  # ── Windows Native Build ───────────────────────────────────────────
  build-windows:
    name: Build Windows Native
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdkDir = Get-ChildItem "C:\VulkanSDK" -Directory | Select-Object -First 1
          echo "VULKAN_SDK=$($sdkDir.FullName)" >> $env:GITHUB_ENV
          echo "$($sdkDir.FullName)\Bin" >> $env:GITHUB_PATH
          Write-Host "Vulkan SDK: $($sdkDir.FullName)"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          shared-key: windows-release

      - name: Build Rust DLL
        working-directory: core
        shell: pwsh
        env:
          LIBCLANG_PATH: "C:\\Program Files\\LLVM\\bin"
          CMAKE_GENERATOR: Ninja
          CARGO_TARGET_DIR: "D:\\t"
        run: |
          # Clean to avoid stale cached artifacts
          cargo clean --release 2>$null
          cargo build --lib --release --features local-stt-vulkan,local-llm-vulkan

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore NuGet packages
        working-directory: platforms/windows/Dimmy.Windows
        run: dotnet restore

      - name: Build Windows app
        working-directory: platforms/windows/Dimmy.Windows
        run: dotnet build Dimmy.Windows.csproj -c Release

      - name: Prepare distribution
        shell: pwsh
        run: |
          $binDir = (Get-ChildItem -Path "platforms/windows/Dimmy.Windows/bin" -Recurse -Filter "Dimmy.Windows.exe" | Select-Object -First 1).DirectoryName
          Write-Host "Build dir: $binDir"
          Copy-Item "D:\t\release\dimmy_lib.dll" "$binDir/"
          Get-ChildItem "$binDir" -Filter "*.pdb" -Recurse | Remove-Item -ErrorAction SilentlyContinue

      - name: Run Windows tests
        working-directory: platforms/windows/Dimmy.Windows.Tests
        run: dotnet test -c Release --logger "console;verbosity=normal"

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Package with Velopack
        shell: pwsh
        run: |
          $version = "${{ needs.create-release.outputs.version }}"
          $binDir = (Get-ChildItem -Path "platforms/windows/Dimmy.Windows/bin" -Recurse -Filter "Dimmy.Windows.exe" | Select-Object -First 1).DirectoryName
          Write-Host "Packing Velopack v$version from $binDir"
          vpk pack --packId Dimmy --packVersion $version --packDir "$binDir" --mainExe Dimmy.Windows.exe --icon "platforms/windows/Dimmy.Windows/Assets/dimmy.ico" --framework "net8.0-x64-desktop,vcredist143-x64" --outputDir platforms/windows/velopack-output
          Get-ChildItem platforms/windows/velopack-output | ForEach-Object { Write-Host "$($_.Name) ($([math]::Round($_.Length/1MB, 1)) MB)" }

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            platforms/windows/velopack-output/Dimmy-win-Setup.exe
            platforms/windows/velopack-output/Dimmy-win-Portable.zip
            platforms/windows/velopack-output/Dimmy-*-full.nupkg
            platforms/windows/velopack-output/releases.win.json

  # ── Linux Native Build ─────────────────────────────────────────────
  build-linux:
    name: Build Linux (GTK4)
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platforms/linux/target
          key: linux-cargo-${{ hashFiles('platforms/linux/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Install GTK4 + libadwaita dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libdbus-1-dev pkg-config \
            libasound2-dev libxdo-dev libfuse2 cmake

      - name: Clippy
        working-directory: platforms/linux
        run: cargo clippy -- -D warnings

      - name: Test
        working-directory: platforms/linux
        run: cargo test

      - name: Build release
        working-directory: platforms/linux
        run: cargo build --release

      - name: Package AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh

          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp platforms/linux/target/release/dimmy-linux AppDir/usr/bin/
          cp platforms/linux/assets/com.dimmy.app.desktop AppDir/usr/share/applications/
          cp platforms/linux/assets/com.dimmy.app.svg AppDir/usr/share/icons/hicolor/scalable/apps/

          export DEPLOY_GTK_VERSION=4
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin gtk \
            --desktop-file platforms/linux/assets/com.dimmy.app.desktop \
            --icon-file platforms/linux/assets/com.dimmy.app.svg \
            --output appimage

          mv Dimmy*.AppImage Dimmy-linux-x86_64.AppImage

      - name: Upload AppImage to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: Dimmy-linux-x86_64.AppImage

  # ── Publish (waits for all jobs) ───────────────────────────────────
  publish-release:
    name: Publish Release
    needs: [rust-check, create-release, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });
