name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ── Rust core lint + test ──────────────────────────────────────────
  rust-check:
    name: Rust Lint & Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxdo-dev libdbus-1-dev libssl-dev cmake

      - name: Format
        working-directory: core
        run: cargo fmt --check

      - name: Clippy
        working-directory: core
        run: cargo clippy --features local-stt,local-llm -- -D warnings

      - name: Test
        working-directory: core
        run: cargo test --lib --features local-stt

  # ── Create release placeholder ─────────────────────────────────────
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | head -n 2 | tail -n 1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$GITHUB_REF_NAME" ]; then
            COMMITS=$(git log --pretty=format:"- %s" HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD")
          fi
          {
            echo "## What's Changed"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "## Downloads"
            echo ""
            echo "| Platform | File | Requirements |"
            echo "|----------|------|--------------|"
            echo "| Windows (installer) | \`Dimmy-win-Setup.exe\` | None (installs .NET 8 automatically) |"
            echo "| Windows (portable) | \`Dimmy-win-Portable.zip\` | [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0) |"
            echo "| macOS (Apple Silicon) | \`Dimmy-macos-arm64.dmg\` | macOS 12+ |"
            echo "| Linux | \`Dimmy-linux-x86_64.AppImage\` | None (GTK4 bundled) |"
            echo ""
            echo "## Installation Notes"
            echo ""
            echo "**Windows:** Download \`Dimmy-win-Setup.exe\` and run. Installs .NET 8 automatically if needed."
            echo ""
            echo "**macOS:** Open the DMG, drag to Applications. First launch: right-click -> Open, or run:"
            echo "\`\`\`"
            echo "xattr -d com.apple.quarantine /Applications/Dimmy.app"
            echo "\`\`\`"
            echo ""
            echo "**Linux:** Make AppImage executable (\`chmod +x\`) and run."
            echo ""
            echo "---"
            echo "*Check for updates in Dimmy Settings > About.*"
          } > changelog.md
          cat changelog.md

      - name: Create GitHub Release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Dimmy ${{ github.ref_name }}"
          body_path: changelog.md
          draft: true
          prerelease: false

  # ── macOS Native Build ─────────────────────────────────────────────
  build-macos:
    name: Build macOS Native
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install CMake
        run: |
          brew install cmake
          cmake --version

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build Rust static library
        working-directory: core
        env:
          # Telemetry secrets — embedded into the binary at build time via
          # core/build.rs. PostHog analytics + Sentry crash reporting +
          # logs both active. Sentry 0.47 with default-features = false
          # + explicit native-tls (schannel on Windows) avoids the
          # rustls/CryptoProvider static-init panic that __fastfailed
          # the cdylib under WindowsAppSDK + Velopack (V3 / V8).
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          echo "CMake: $(cmake --version | head -1)"
          echo "Xcode CLT: $(xcode-select -p)"
          cargo clean --release 2>/dev/null
          cargo build --lib --release --target aarch64-apple-darwin --features local-stt-metal,local-llm-metal

      - name: Verify static library
        run: |
          ls -lh core/target/aarch64-apple-darwin/release/libdimmy_lib.a
          file core/target/aarch64-apple-darwin/release/libdimmy_lib.a
          rm -f core/target/aarch64-apple-darwin/release/libdimmy_lib.dylib
          rm -f core/target/aarch64-apple-darwin/release/deps/libdimmy_lib.dylib
          echo "=== llama/ggml dylibs in release dir ==="
          ls -la core/target/aarch64-apple-darwin/release/libllama* core/target/aarch64-apple-darwin/release/libggml* 2>/dev/null || echo "No dylibs found"

      - name: Build Xcode project
        working-directory: platforms/macos
        run: |
          xcodebuild -project Dimmy.xcodeproj \
            -scheme Dimmy \
            -configuration Release \
            -derivedDataPath build/derived \
            build \
            CODE_SIGN_IDENTITY="-"

      - name: Bundle llama.cpp dylibs
        run: |
          APP_PATH="platforms/macos/build/derived/Build/Products/Release/Dimmy.app"
          FRAMEWORKS_DIR="$APP_PATH/Contents/Frameworks"
          mkdir -p "$FRAMEWORKS_DIR"
          RELEASE_DIR="core/target/aarch64-apple-darwin/release"

          # Copy dylibs dereferencing symlinks so every file is a real binary
          for name in libllama libggml libggml-base libggml-cpu libggml-metal; do
            for dylib in "$RELEASE_DIR"/${name}*.dylib; do
              [ -e "$dylib" ] || continue
              DEST="$FRAMEWORKS_DIR/$(basename "$dylib")"
              cp -RL "$dylib" "$DEST"
              # Ensure install name uses @rpath so the app finds them at runtime
              install_name_tool -id "@rpath/$(basename "$dylib")" "$DEST" 2>/dev/null || true
            done
          done

          # Re-sign all dylibs
          codesign --force --sign - "$FRAMEWORKS_DIR"/*.dylib

          echo "=== Frameworks contents ==="
          ls -la "$FRAMEWORKS_DIR/"
          echo "=== Verifying no broken symlinks ==="
          find "$FRAMEWORKS_DIR" -type l ! -exec test -e {} \; -print | grep . && echo "BROKEN SYMLINKS FOUND — BUILD WILL FAIL" && exit 1 || echo "All OK"

      - name: Generate DMG background (SVG → PNG)
        run: |
          brew install librsvg
          rsvg-convert -w 660 -h 400 platforms/macos/dmg-assets/dmg-background.svg -o platforms/macos/dmg-assets/dmg-background.png

      - name: Create DMG
        working-directory: platforms/macos
        run: |
          brew install create-dmg
          APP_PATH="build/derived/Build/Products/Release/Dimmy.app"
          create-dmg \
            --volname "Dimmy" \
            --background "dmg-assets/dmg-background.png" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "Dimmy.app" 165 200 \
            --app-drop-link 495 200 \
            --no-internet-enable \
            "build/Dimmy-macos-arm64.dmg" \
            "$APP_PATH"

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: platforms/macos/build/Dimmy-macos-arm64.dmg

  # ── Windows Native Build ───────────────────────────────────────────
  build-windows:
    name: Build Windows Native
    needs: create-release
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest

      - name: Install VS 2026 BuildTools side-by-side (MSVC 14.50+)
        shell: pwsh
        run: |
          # windows-2025 ships VS 2022 Enterprise only (MSVC 14.44, which
          # miscompiles whisper.cpp's ggml-vulkan state-init path). MSVC
          # 14.50+ exists only in VS 2026 (VS 18). Install path: Microsoft
          # has not yet registered aka.ms/vs/18/* short-urls (they all
          # redirect to Bing), so the official bootstrapper has no public
          # direct URL. Chocolatey hosts the preview package that internally
          # fetches the signed installer from Microsoft's CDN. Install it
          # side-by-side with VS 2022 — VS 2022 stays authoritative for the
          # .NET publish + UWP AppxPackage PRI generation steps because the
          # BuildTools SKU lacks those workloads.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs2026 = & $vswhere -version "[18.0,19.0)" -prerelease -products "*" -property installationPath 2>$null | Select-Object -First 1
          if ($vs2026) {
            Write-Host "VS 2026 already present at $vs2026"
          } else {
            Write-Host "Installing visualstudio2026buildtools-preview via chocolatey..."
            # choco's --package-parameters is a single string passed to the
            # VS bootstrapper. --wait blocks until install completes.
            $params = "--add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.Component.Windows11SDK.22621 --quiet --norestart --wait --nocache"
            # Retry on transient community.chocolatey.org outages (503/504
            # on V2 feed — chocolatey silently exits 0 on fetch failure,
            # so we retry based on observed install result, not exit code).
            # Each attempt: choco install → poll vswhere 60s → check present.
            $maxTries = 3
            $attempt = 0
            do {
              $attempt++
              Write-Host "choco install attempt $attempt/$maxTries..."
              choco install visualstudio2026buildtools-preview -y --pre --no-progress --package-parameters="$params"
              $rc = $LASTEXITCODE
              # Poll vswhere — Installer registration can lag a few seconds
              # after choco reports "installed" (exit 3010 = reboot-pending).
              for ($i = 0; $i -lt 12; $i++) {
                Start-Sleep -Seconds 5
                $vs2026 = & $vswhere -version "[18.0,19.0)" -prerelease -products "*" -property installationPath 2>$null | Select-Object -First 1
                if ($vs2026) { break }
              }
              if ($vs2026) { break }
              if ($attempt -lt $maxTries) {
                $backoff = 30 * $attempt
                Write-Host "Attempt $attempt did not produce VS 2026 (choco exit $rc). Retrying in ${backoff}s..."
                Start-Sleep -Seconds $backoff
              }
            } while ($attempt -lt $maxTries)
            if (-not $vs2026) {
              throw "VS 2026 not found after $maxTries chocolatey attempts (community.chocolatey.org may be degraded — re-run workflow when repo recovers)"
            }
          }
          Write-Host "VS 2026 installationPath: '$vs2026'"
          $mscvDir = Join-Path $vs2026 "VC\Tools\MSVC"
          Write-Host "Listing MSVC toolchains at: $mscvDir"
          if (-not (Test-Path $mscvDir)) { throw "VC\Tools\MSVC not found — VCTools workload missing" }
          $tools = Get-ChildItem $mscvDir -Directory -ErrorAction Stop | Sort-Object Name -Descending
          Write-Host "Found $($tools.Count) MSVC toolchain(s): $($tools.Name -join ', ')"
          if (-not $tools -or $tools.Count -eq 0) { throw "VC\Tools\MSVC is empty" }
          $toolName = $tools[0].Name
          Write-Host "Picking newest: $toolName"
          $verMatch = [regex]::Match($toolName, '^(\d+)\.(\d+)')
          if (-not $verMatch.Success) { throw "Cannot parse major.minor from toolchain name '$toolName'" }
          $major = [int]$verMatch.Groups[1].Value
          $minor = [int]$verMatch.Groups[2].Value
          Write-Host "Parsed major=$major minor=$minor"
          if ($major -lt 14 -or ($major -eq 14 -and $minor -lt 50)) {
            throw "VS 2026 has MSVC $toolName (major=$major, minor=$minor), < 14.50 required"
          }
          Write-Host "Toolchain OK, exporting VS2026_PATH"
          Add-Content -Path $env:GITHUB_ENV -Value "VS2026_PATH=$vs2026" -Encoding utf8
          Write-Host "DONE"
          # choco's exit 3010 (reboot-required) sets $LASTEXITCODE=3010 and
          # in pwsh 7.3+ with $PSNativeCommandUseErrorActionPreference=$true
          # the GitHub Actions wrapper returns non-zero at step end regardless
          # of subsequent logic. Explicit exit 0 overrides.
          exit 0

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          # Retry based on observed install result — chocolatey silently
          # exits 0 on V2 feed fetch failures (503/504), so we verify
          # C:\VulkanSDK exists rather than trusting the exit code.
          $maxTries = 3
          $attempt = 0
          $sdkDir = $null
          do {
            $attempt++
            Write-Host "choco install vulkan-sdk attempt $attempt/$maxTries..."
            choco install vulkan-sdk -y --no-progress
            $sdkDir = Get-ChildItem "C:\VulkanSDK" -Directory -ErrorAction SilentlyContinue |
                      Sort-Object Name -Descending | Select-Object -First 1
            if ($sdkDir) { break }
            if ($attempt -lt $maxTries) {
              $backoff = 30 * $attempt
              Write-Host "Attempt $attempt did not produce VulkanSDK. Retrying in ${backoff}s..."
              Start-Sleep -Seconds $backoff
            }
          } while ($attempt -lt $maxTries)
          if (-not $sdkDir) {
            throw "VulkanSDK not found after $maxTries chocolatey attempts (community.chocolatey.org may be degraded — re-run workflow when repo recovers)"
          }
          echo "VULKAN_SDK=$($sdkDir.FullName)" >> $env:GITHUB_ENV
          echo "$($sdkDir.FullName)\Bin" >> $env:GITHUB_PATH
          Write-Host "Vulkan SDK: $($sdkDir.FullName)"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          shared-key: windows-release

      - name: Build Rust DLL (VS 2026 MSVC env)
        working-directory: core
        shell: cmd
        env:
          LIBCLANG_PATH: "C:\\Program Files\\LLVM\\bin"
          CMAKE_GENERATOR: Ninja
          CARGO_TARGET_DIR: "D:\\t"
          # Diagnostic build (see macOS step for the rationale).
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          REM Activate VS 2026 MSVC for this step only — PATH, INCLUDE,
          REM LIB point at the 14.50+ toolchain. Subsequent steps inherit
          REM the original job env (VS 2022) because activation is
          REM scoped to this shell invocation. cmd is required because
          REM vcvars64.bat is a batch script.
          call "%VS2026_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cargo clean --release 2>nul
          cargo build --lib --release --features local-stt-vulkan,local-llm-vulkan

      - name: Gate — verify dimmy_lib.dll linker version
        shell: pwsh
        run: |
          # Hard gate: the whisper Vulkan backend miscompile lives in MSVC
          # linker <= 14.44. Any DLL linked with an older toolchain must NOT
          # ship. Extracts linker version from PE headers via dumpbin.
          # dumpbin is not in PATH here (the previous step's vcvars
          # activation was scoped to that cmd subshell), so locate it under
          # VS2026_PATH.
          $dll = "D:\t\release\dimmy_lib.dll"
          if (-not (Test-Path $dll)) { throw "dimmy_lib.dll not found at $dll" }
          $mscvDir = Join-Path $env:VS2026_PATH "VC\Tools\MSVC"
          $tool = Get-ChildItem $mscvDir -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $dumpbin = Join-Path $tool.FullName "bin\Hostx64\x64\dumpbin.exe"
          if (-not (Test-Path $dumpbin)) { throw "dumpbin.exe not found at $dumpbin" }
          Write-Host "Using dumpbin at: $dumpbin"
          $out = & $dumpbin /headers $dll
          $line = $out | Select-String "linker version" | Select-Object -First 1
          if (-not $line) { throw "Could not find linker version in dumpbin output" }
          if ($line -notmatch '(\d+)\.(\d+)') { throw "Could not parse linker version from '$line'" }
          $major = [int]$Matches[1]
          $minor = [int]$Matches[2]
          Write-Host "dimmy_lib.dll linker version: $major.$minor"
          if ($major -lt 14 -or ($major -eq 14 -and $minor -lt 50)) {
            throw "dimmy_lib.dll linked with MSVC $major.$minor. Known whisper.cpp Vulkan codegen bug in <14.50. Aborting release."
          }
          exit 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore NuGet packages
        working-directory: platforms/windows/Dimmy.Windows
        run: dotnet restore

      - name: Locate VS AppxPackage tools (for MrtCore PRI generation)
        shell: pwsh
        run: |
          # MrtCore.PriGen.targets references Microsoft.Build.Packaging.Pri.Tasks.dll
          # which only ships with the VS AppxPackage workload, not the .NET SDK.
          # Without it, resources.pri is not generated and the app runs headless at
          # runtime (every ms-appx:///Views/*.xaml URI fails to resolve).
          # Pin to VS 2022 (17.x) — the side-by-side VS 2026 BuildTools used
          # for the Rust build lacks UWP/AppxPackage workloads entirely, so
          # a naive `-latest` would pick VS 2026 and this step would fail.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -version "[17.0,18.0)" -products "*" -property installationPath | Select-Object -First 1
          if (-not $vs) { throw "vswhere did not find a VS 2022 install" }
          $candidates = @(
            "$vs\MSBuild\Microsoft\VisualStudio\v17.0\AppxPackage\",
            "$vs\MSBuild\Microsoft\VisualStudio\v18.0\AppxPackage\"
          )
          $found = $candidates | Where-Object { Test-Path (Join-Path $_ "Microsoft.Build.Packaging.Pri.Tasks.dll") } | Select-Object -First 1
          if (-not $found) {
            Write-Host "VS install at: $vs"
            Write-Host "Probed paths:"
            $candidates | ForEach-Object { Write-Host "  - $_" }
            throw "Microsoft.Build.Packaging.Pri.Tasks.dll not found in VS install. UWP workload missing?"
          }
          Write-Host "AppxMSBuildToolsPath = $found"
          echo "AppxMSBuildToolsPath=$found" >> $env:GITHUB_ENV

      - name: Publish Windows app (self-contained)
        working-directory: platforms/windows/Dimmy.Windows
        run: dotnet publish Dimmy.Windows.csproj -c Release -r win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -p:SelfContained=true "-p:AppxMSBuildToolsPath=$env:AppxMSBuildToolsPath" -o publish

      - name: Prepare distribution
        shell: pwsh
        run: |
          # No co-located VC++ runtime: Velopack `--framework vcredist143-x64`
          # already installs the official Microsoft VC Redist at setup time,
          # which lands in System32. Shipping a second copy next to
          # dimmy_lib.dll is at best redundant and at worst overrides System32
          # with an older ABI (v0.6.10 crash cause). System32 wins.
          $pubDir = "platforms/windows/Dimmy.Windows/publish"
          Copy-Item "D:\t\release\dimmy_lib.dll" "$pubDir/"
          Get-ChildItem "$pubDir" -Filter "*.pdb" -Recurse | Remove-Item -ErrorAction SilentlyContinue

      - name: Verify self-contained bundle
        shell: pwsh
        run: platforms/windows/verify-self-contained.ps1 -Path platforms/windows/Dimmy.Windows/publish

      - name: Run Windows tests
        working-directory: platforms/windows/Dimmy.Windows.Tests
        run: dotnet test -c Release --logger "console;verbosity=normal"

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Package with Velopack
        shell: pwsh
        run: |
          $version = "${{ needs.create-release.outputs.version }}"
          $pubDir = (Resolve-Path "platforms/windows/Dimmy.Windows/publish").Path
          Write-Host "Packing Velopack v$version from $pubDir"
          vpk pack --packId Dimmy --packVersion $version --packDir "$pubDir" --mainExe Dimmy.Windows.exe --icon "platforms/windows/Dimmy.Windows/Assets/dimmy.ico" --framework "vcredist143-x64" --outputDir platforms/windows/velopack-output
          Get-ChildItem platforms/windows/velopack-output | ForEach-Object { Write-Host "$($_.Name) ($([math]::Round($_.Length/1MB, 1)) MB)" }

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            platforms/windows/velopack-output/Dimmy-win-Setup.exe
            platforms/windows/velopack-output/Dimmy-win-Portable.zip
            platforms/windows/velopack-output/Dimmy-*-full.nupkg
            platforms/windows/velopack-output/releases.win.json

  # ── Linux Native Build ─────────────────────────────────────────────
  build-linux:
    name: Build Linux (GTK4)
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platforms/linux/target
          key: linux-cargo-${{ hashFiles('platforms/linux/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Install GTK4 + libadwaita dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libdbus-1-dev pkg-config \
            libasound2-dev libxdo-dev libfuse2 cmake

      - name: Clippy
        working-directory: platforms/linux
        run: cargo clippy -- -D warnings

      - name: Test
        working-directory: platforms/linux
        run: cargo test

      - name: Build release
        working-directory: platforms/linux
        env:
          # Diagnostic build (see macOS step for the rationale).
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: cargo build --release

      - name: Package AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh

          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp platforms/linux/target/release/dimmy-linux AppDir/usr/bin/
          cp platforms/linux/assets/com.dimmy.app.desktop AppDir/usr/share/applications/
          cp platforms/linux/assets/com.dimmy.app.svg AppDir/usr/share/icons/hicolor/scalable/apps/

          export DEPLOY_GTK_VERSION=4
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin gtk \
            --desktop-file platforms/linux/assets/com.dimmy.app.desktop \
            --icon-file platforms/linux/assets/com.dimmy.app.svg \
            --output appimage

          mv Dimmy*.AppImage Dimmy-linux-x86_64.AppImage

      - name: Upload AppImage to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: Dimmy-linux-x86_64.AppImage

  # ── Clean-machine install test ──────────────────────────────────────
  # Gates publish: a broken installer must never leave draft state on a real v-tag.
  test-install:
    name: Test Install (Clean Windows)
    needs: build-windows
    uses: ./.github/workflows/test-install.yml
    permissions:
      contents: write
    with:
      tag: ${{ github.ref_name }}

  # ── Publish (waits for all jobs including test-install) ─────────────
  publish-release:
    name: Publish Release
    needs: [rust-check, create-release, build-macos, build-windows, build-linux, test-install]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });
