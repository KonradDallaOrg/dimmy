name: E2E Tests

# Additive workflow — does NOT touch staging-native / release / test-install / ci.yml.
# The installer pipeline remains untouched.
#
# Trigger model (since 2026-07-05 — closes the re-audit's #1 gap):
#   - push to staging  → `integration-suites` (windows-2025: EVERY integration
#     suite incl. ffi_e2e) + `windows-ui-smoke`. The dev flow merges straight
#     to staging without PRs, so PR-only gating meant the richest suites ran
#     in NO CI at all (last tier-1 run before this change: 2026-06-27).
#   - pull_request     → additionally the 3-OS `ffi-integration` + `ffi-smoke`
#     matrices (cross-platform coverage where it's worth the runner cost).

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging, main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── The staging push gate: every integration suite on the product's
  # primary OS. One cargo invocation compiles all targets; suites run
  # sequentially with --test-threads=1 (FFI tests share process-global
  # state and are isolated to DIMMY_TEST_CONFIG_DIR by the harnesses).
  integration-suites:
    name: Integration suites (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # llama.cpp now vendors a web UI whose paths blow past Windows' 260-char
      # limit when cargo checks the submodule out under CARGO_HOME:
      #   .../llama.cpp/tools/ui/src/lib/components/app/chat/ChatAttachments/
      #   ChatAttachmentsPreview/ChatAttachmentsPreviewCurrentItem/...svelte
      # cargo's bundled libgit2 fails there; the git CLI with core.longpaths
      # uses the \?\ APIs and does not. So: tell cargo to shell out to git.
      - name: Long paths for the llama.cpp submodule (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          # And make cargo actually USE that git: it prefers its bundled
          # libgit2, which is the thing that cannot handle the long path.
          "CARGO_NET_GIT_FETCH_WITH_CLI=true" | Add-Content -Encoding utf8 $env:GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          shared-key: integration-suites-win

      - name: Cache test fixtures (jfk.wav + ggml-tiny.en-q8_0.bin)
        uses: actions/cache@v5
        with:
          path: core/target/test-fixtures
          key: ffi-fixtures-v1-windows-2025

      - name: Run integration suites
        working-directory: core
        env:
          DIMMY_FORCE_CPU: "1"
          RUST_BACKTRACE: "1"
          GGML_NATIVE: "OFF"
        # --release: debug whisper.cpp crashes on windows-2025 (see the
        # ffi-integration job note). Suite list = every core/tests target
        # that gates real behaviour; live-API tests inside them are
        # #[ignore] and skipped automatically.
        # abi_snapshot is EXCLUDED: its golden export list pins the DLL
        # built with the FROZEN release feature set (vulkan+parakeet+llm);
        # this gate builds a reduced-feature DLL, so the symbol set is
        # structurally different (first live run failed on exactly this,
        # 2026-07-05). --no-fail-fast so one red suite can't hide the rest.
        # v2_ffi was briefly quarantined (2026-07-05) for a STATUS_ACCESS_
        # VIOLATION; root-caused + fixed 2026-07-06 and restored. The crash
        # was the set_loopback_sample_rate_rejects_out_of_range test calling
        # audio::secondary_sample_rate, whose Windows branch did a live
        # WASAPI default-output-device query that access-violates on the
        # device-less runner. Fixed by dropping the live query (the host
        # supplies the rate via the override; pipeline is 48 kHz canonical).
        run: >
          cargo test --release --features local-stt,test-ffi --no-fail-fast
          --test ffi_e2e
          --test v2_ffi
          --test v2_followups
          --test audio_hardening
          --test meeting_pause_resume
          --test llm_request_shape
          --test stress_tests
          --test preprocess_properties
          -- --test-threads=1

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: integration-suites-debug
          path: core/target/release/deps/*.pdb
          if-no-files-found: ignore
          retention-days: 7

  ffi-integration:
    name: FFI integration (${{ matrix.os }})
    # PR-only: the 3-OS matrix triples runner cost; the staging push gate
    # is `integration-suites` (windows), which includes ffi_e2e.
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          # Bumped to v3 (2026-04-29) to evict a stale Swatinem cache that
          # contained a whisper.cpp object file built on a runner with a
          # different CPU instruction set, causing SIGILL on ubuntu-22.04
          # runners during whisper_model_load. GGML_NATIVE=OFF in the test
          # step env prevents recurrence — whisper.cpp now targets generic
          # x86-64 baseline instead of the compile-host's CPU.
          shared-key: e2e-v3-${{ matrix.os }}

      - name: Cache test fixtures (jfk.wav + ggml-tiny.en-q8_0.bin)
        uses: actions/cache@v5
        with:
          path: core/target/test-fixtures
          key: ffi-fixtures-v1-${{ matrix.os }}

      # ── Platform-specific build deps for whisper-rs (C/C++) ───────────
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxdo-dev libdbus-1-dev libssl-dev cmake

      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: brew list cmake >/dev/null 2>&1 || brew install cmake

      # windows-2025 ships cmake + VS 2022 BuildTools — no Vulkan needed for CPU whisper

      - name: Run FFI integration tests
        working-directory: core
        env:
          # Force CPU path — GHA runners have no GPU for local STT
          DIMMY_FORCE_CPU: "1"
          # Rust backtrace on panic for easier CI debugging
          RUST_BACKTRACE: "1"
          # Disable native CPU optimizations in whisper.cpp/ggml cmake build.
          # Without this, whisper-rs-sys compiles with -march=native on the
          # compile host; if a different runner replays the cached object the
          # binary executes instructions it doesn't support (SIGILL).
          GGML_NATIVE: "OFF"
        # --release: debug-mode whisper.cpp on windows-2025 crashes with
        # STATUS_ILLEGAL_INSTRUCTION (CPU-feature mismatch on the runner).
        # Release mode uses safer codegen + runtime CPU detection paths.
        run: cargo test --release --test ffi_e2e --features local-stt,test-ffi -- --nocapture --test-threads=1

      - name: Upload test debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ffi-e2e-debug-${{ matrix.os }}
          path: |
            core/target/debug/deps/ffi_e2e-*
            core/target/debug/build/dimmy-*/output
          if-no-files-found: ignore
          retention-days: 7

  windows-ui-smoke:
    name: Windows UI smoke (FlaUI)
    runs-on: windows-2025-vs2026
    # Depends on the always-running gate (ffi-integration is PR-only and a
    # skipped `needs` would skip this job on staging pushes too).
    needs: integration-suites
    steps:
      - uses: actions/checkout@v5

      # llama.cpp now vendors a web UI whose paths blow past Windows' 260-char
      # limit when cargo checks the submodule out under CARGO_HOME:
      #   .../llama.cpp/tools/ui/src/lib/components/app/chat/ChatAttachments/
      #   ChatAttachmentsPreview/ChatAttachmentsPreviewCurrentItem/...svelte
      # cargo's bundled libgit2 fails there; the git CLI with core.longpaths
      # uses the \?\ APIs and does not. So: tell cargo to shell out to git.
      - name: Long paths for the llama.cpp submodule (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          # And make cargo actually USE that git: it prefers its bundled
          # libgit2, which is the thing that cannot handle the long path.
          "CARGO_NET_GIT_FETCH_WITH_CLI=true" | Add-Content -Encoding utf8 $env:GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          shared-key: ui-smoke-win

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Build Rust dimmy_lib.dll (CPU only, no Vulkan)
        working-directory: core
        run: cargo build --release --lib --features local-stt

      - name: Restore + build Dimmy.Windows
        working-directory: platforms/windows/Dimmy.Windows
        run: dotnet build Dimmy.Windows.csproj -c Release

      - name: Restore + build Dimmy.Windows.UiTests
        working-directory: platforms/windows/Dimmy.Windows.UiTests
        run: dotnet build Dimmy.Windows.UiTests.csproj -c Debug

      - name: Run FlaUI smoke tests
        working-directory: platforms/windows/Dimmy.Windows.UiTests
        env:
          RUST_BACKTRACE: "1"
        run: dotnet test Dimmy.Windows.UiTests.csproj -c Debug --no-build --logger "console;verbosity=normal"

      - name: Upload UI test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ui-smoke-debug
          path: |
            platforms/windows/Dimmy.Windows.UiTests/bin/Debug/**/*.log
            platforms/windows/Dimmy.Windows.UiTests/TestResults/**
          if-no-files-found: ignore
          retention-days: 7

  # ── FFI smoke: every shipping `dimmy_*` symbol is dynamically loaded
  # from the freshly-built dimmy_lib.dll and called with safe arguments.
  # Catches the v0.6.10 ABI-mismatch class at PR time without needing a
  # Setup.exe — the binary loads the DLL via libloading, so any missing
  # symbol, mangled signature, or runtime-incompatible build fails here
  # instead of in the user's first dictation. Cross-platform matrix
  # mirrors the FFI integration job.
  ffi-smoke:
    name: FFI smoke (${{ matrix.os }})
    if: github.event_name != 'push'
    needs: ffi-integration
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          shared-key: ffi-smoke-${{ matrix.os }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxdo-dev libdbus-1-dev libssl-dev cmake

      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: brew list cmake >/dev/null 2>&1 || brew install cmake

      - name: Build dimmy_lib (cdylib) + dimmy_smoke
        working-directory: core
        env:
          DIMMY_FORCE_CPU: "1"
        run: |
          cargo build --release --lib --features local-stt
          cargo build --release --bin dimmy_smoke --features smoke-test

      - name: Run smoke binary against fresh dimmy_lib (Unix)
        if: matrix.os != 'windows-2025'
        working-directory: core/target/release
        env:
          DIMMY_FORCE_CPU: "1"
          # macOS / Linux library search via DYLD_/LD_LIBRARY_PATH; cwd is
          # not searched by default the way Windows does.
          LD_LIBRARY_PATH: ${{ github.workspace }}/core/target/release
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/core/target/release
        run: ./dimmy_smoke

      - name: Run smoke binary against fresh dimmy_lib (Windows)
        if: matrix.os == 'windows-2025'
        working-directory: core/target/release
        env:
          DIMMY_FORCE_CPU: "1"
        # Windows loader searches the directory of the .exe first, so
        # running from target/release picks up dimmy_lib.dll automatically.
        shell: pwsh
        run: |
          .\dimmy_smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "dimmy_smoke exited with code $LASTEXITCODE" }
