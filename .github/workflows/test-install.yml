name: Test Install (Clean Windows)

# Downloads a Windows Setup.exe from a given release tag, installs it silently
# on a clean windows-latest runner (no WinAppSDK, no VC++ redist, only .NET SDK
# preinstalled), launches the app, and verifies %TEMP%\dimmy_startup.log shows
# no CRASH line.
#
# Triggers:
#   - workflow_call: invoked as a reusable job by staging-auto-update.yml and
#     release.yml immediately after the Windows build uploads the installer.
#     Gate the "publish release" step on this so broken bundles never ship.
#   - workflow_dispatch: ad-hoc re-runs for any existing tag.
#
# Cost: ~3 min per run on a free runner. Catches self-contained bundling
# regressions (missing DLL / PRI / Velopack packaging bugs) BEFORE any
# human tester has to install locally.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to download the installer from'
        required: true
        type: string
      setup_pattern:
        description: 'gh release asset glob for the installer. Default matches the prod packId (release.yml); staging-auto-update.yml passes the Dimmy-Staging packId name.'
        required: false
        default: 'Dimmy-win-Setup.exe'
        type: string
      install_dir:
        description: 'Velopack install folder name under %LOCALAPPDATA% — equals the packId. Prod = Dimmy (release.yml default); staging-auto-update.yml passes Dimmy-Staging.'
        required: false
        default: 'Dimmy'
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to download the installer from (e.g. staging-latest or v0.6.3)'
        required: false
        default: staging-latest
        type: string
      setup_pattern:
        description: 'gh release asset glob for the installer (e.g. Dimmy-win-Setup.exe or Dimmy-Staging-*Setup.exe)'
        required: false
        default: 'Dimmy-win-Setup.exe'
        type: string
      install_dir:
        description: 'Velopack install folder name under %LOCALAPPDATA% (packId): Dimmy or Dimmy-Staging'
        required: false
        default: 'Dimmy'
        type: string

permissions:
  # write needed because gh release download must read draft release assets
  contents: write

jobs:
  test-install:
    name: Install + launch on clean Windows
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      SETUP_PATTERN: ${{ inputs.setup_pattern }}
      INSTALL_DIR: ${{ inputs.install_dir }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # This job installs and launches Dimmy for real, so without an opt-out
      # the VM reports telemetry indistinguishable from a person's. It ran on
      # every release: 60 of the 76 "users" who started onboarding over 60
      # days were these runners (measured 2026-09-03), which made every funnel
      # ~79 % noise — onboarding completion read 13 % when the figure for
      # humans was 63 %. GITHUB_ACTIONS/CI are also honoured by the core, this
      # is the explicit belt to that pair of braces.
      DIMMY_TELEMETRY_OPT_OUT: "1"

    steps:
      - name: Runner baseline (what's already installed)
        shell: pwsh
        run: |
          Write-Host "=== OS ==="
          (Get-CimInstance Win32_OperatingSystem).Caption
          [System.Environment]::OSVersion.Version
          Write-Host ""
          Write-Host "=== .NET runtimes (preinstalled) ==="
          try { dotnet --list-runtimes } catch { Write-Host "(no dotnet)" }
          Write-Host ""
          Write-Host "=== WinAppSDK runtime (should be absent) ==="
          $sdk = Get-ChildItem "C:\Program Files\WindowsApps" -Filter "Microsoft.WindowsAppRuntime*" -ErrorAction SilentlyContinue
          if ($sdk) { $sdk | Select-Object Name } else { Write-Host "(none — good)" }
          Write-Host ""
          Write-Host "=== VC++ runtime DLLs in System32 ==="
          Get-ChildItem "C:\Windows\System32\vcruntime140*.dll","C:\Windows\System32\msvcp140*.dll" -ErrorAction SilentlyContinue | Select-Object Name

      - name: Download Setup.exe from release tag
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if (-not $tag) { throw "No RELEASE_TAG set — reusable workflow caller must pass 'tag' input" }
          $pattern = $env:SETUP_PATTERN
          if (-not $pattern) { $pattern = "Dimmy-win-Setup.exe" }
          $dest = "$env:RUNNER_TEMP\Dimmy-Setup.exe"
          Write-Host "Downloading installer matching '$pattern' from release '$tag' via gh CLI"
          # gh release download works on drafts and prereleases too (uses GITHUB_TOKEN)
          gh release download $tag --repo "${{ github.repository }}" --pattern "$pattern" --output $dest --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed" }
          $size = (Get-Item $dest).Length
          Write-Host "Downloaded: $([math]::Round($size/1MB,1)) MB"
          if ($size -lt 50MB) { throw "Setup.exe suspiciously small ($size bytes) — likely an empty asset" }

      - name: Install silently
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\Dimmy-Setup.exe"
          Write-Host "Running Velopack Setup with --silent"
          $proc = Start-Process -FilePath $setup -ArgumentList "--silent" -Wait -PassThru
          Write-Host "Install exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) {
            Write-Host "Installer failed (exit $($proc.ExitCode))" -ForegroundColor Red
            exit $proc.ExitCode
          }

      - name: Verify install location + bundle integrity
        shell: pwsh
        run: |
          $pack = $env:INSTALL_DIR
          if (-not $pack) { $pack = "Dimmy" }
          $appRoot = "$env:LOCALAPPDATA\$pack"
          $appDir = "$appRoot\current"
          if (-not (Test-Path $appDir)) {
            Write-Host "Install dir NOT found: $appDir" -ForegroundColor Red
            Write-Host "Full $appRoot tree:"
            Get-ChildItem $appRoot -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
            exit 1
          }
          $files = Get-ChildItem $appDir -Recurse -File
          $size = ($files | Measure-Object Length -Sum).Sum
          Write-Host "Installed at: $appDir"
          Write-Host "Files: $($files.Count), Size: $([math]::Round($size/1MB,1)) MB"
          Write-Host ""
          $critical = @(
            'Dimmy.Windows.exe',
            'dimmy_lib.dll',
            # dimmy_lib.dll links llama.cpp and ggml DYNAMICALLY (llama-cpp-4
            # `dynamic-link`, to keep llama's ggml out of whisper's way). Miss
            # one and the app does not start at all, which is exactly the class
            # of failure this job exists to catch.
            'ggml.dll',
            'ggml-base.dll',
            'ggml-cpu.dll',
            'ggml-vulkan.dll',
            'llama.dll',
            'coreclr.dll',
            'hostfxr.dll',
            'Microsoft.UI.Xaml.dll',
            'Microsoft.WindowsAppRuntime.dll',
            'Microsoft.WindowsAppRuntime.Bootstrap.dll',
            'Microsoft.Internal.FrameworkUdk.dll'
            # vcruntime140/msvcp140 are NOT expected in $appDir — Velopack
            # `--framework vcredist143-x64` installs the official Microsoft
            # VC Redist at setup time (into System32). Co-locating our own
            # copy was removed in v0.6.12 after it caused ABI mismatches.
          )
          $missing = @()
          foreach ($f in $critical) {
            if (-not (Test-Path (Join-Path $appDir $f))) { $missing += $f }
          }
          if ($missing.Count -gt 0) {
            Write-Host "Missing critical files in installed bundle:" -ForegroundColor Red
            $missing | ForEach-Object { Write-Host "  - $_" -ForegroundColor Red }
            exit 1
          }
          # The app's own PRI is required. Microsoft.UI.pri / Microsoft.UI.Xaml.Controls.pri
          # ship with WindowsAppSDK and don't index Views/*.xbf -- checking for "any .pri"
          # gives a false positive. Staging build on 2026-04-18 shipped without app PRI
          # because Directory.Build.targets stubbed the MrtCore generation targets.
          $appPri = Get-ChildItem $appDir -Filter "resources.pri" -File -ErrorAction SilentlyContinue
          if (-not $appPri) {
            $appPri = Get-ChildItem $appDir -Filter "Dimmy.Windows.pri" -File -ErrorAction SilentlyContinue
          }
          if (-not $appPri) {
            Write-Host "App PRI (resources.pri / Dimmy.Windows.pri) MISSING from installed bundle." -ForegroundColor Red
            Write-Host "Present .pri files:" -ForegroundColor Red
            Get-ChildItem $appDir -Filter "*.pri" -File | ForEach-Object { Write-Host "  - $($_.Name)" -ForegroundColor Red }
            Write-Host "App will throw XamlParseException at InitializeComponent() and run headless." -ForegroundColor Red
            exit 1
          }
          Write-Host ("App PRI: {0} ({1} KB)" -f $appPri.Name, [math]::Round($appPri.Length/1KB,1))
          Write-Host "Bundle integrity: OK" -ForegroundColor Green

      - name: Launch app and wait 15 seconds
        shell: pwsh
        run: |
          $pack = $env:INSTALL_DIR
          if (-not $pack) { $pack = "Dimmy" }
          $exe = "$env:LOCALAPPDATA\$pack\current\Dimmy.Windows.exe"
          Remove-Item "$env:TEMP\dimmy_startup.log" -ErrorAction SilentlyContinue
          # Also clear the dimmy_init early-init trace so we capture only
          # the markers from this launch. dimmy_init writes P0..P5 here
          # before each step; if dimmy_init aborts we still see how far
          # it got.
          Remove-Item "$env:TEMP\dimmy_init_trace.log" -ErrorAction SilentlyContinue
          Write-Host "Launching: $exe"
          $proc = Start-Process -FilePath $exe -PassThru
          Write-Host "PID: $($proc.Id)"
          Start-Sleep -Seconds 15
          $proc.Refresh()
          if ($proc.HasExited) {
            Write-Host "Process EXITED early (code $($proc.ExitCode)) — likely a silent crash" -ForegroundColor Red
            "exited_early" | Out-File "$env:RUNNER_TEMP\launch_result.txt"
          } else {
            Write-Host "Process still alive after 15s — app survived startup" -ForegroundColor Green
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            "alive" | Out-File "$env:RUNNER_TEMP\launch_result.txt"
          }

      - name: Dump startup log
        if: always()
        shell: pwsh
        run: |
          $log = "$env:TEMP\dimmy_startup.log"
          if (Test-Path $log) {
            Write-Host "=== %TEMP%\dimmy_startup.log ==="
            Get-Content $log
            Write-Host "=== end log ==="
            Copy-Item $log "$env:RUNNER_TEMP\dimmy_startup.log" -Force
          } else {
            Write-Host "No startup log at $log"
            Write-Host "App did not reach Program.Main -- check Event Viewer below"
          }
          # dimmy_init trace markers (P0..P5). Tells us how far the Rust
          # core got before any panic. P0=enter, P1=session set, P2=hook
          # installed, P3=first log line, P4=telemetry init, P5=GLOBAL_STATE
          # set. P_PANIC line means catch_unwind caught a panic in the body.
          $traceLog = "$env:TEMP\dimmy_init_trace.log"
          if (Test-Path $traceLog) {
            Write-Host "=== %TEMP%\dimmy_init_trace.log ==="
            Get-Content $traceLog
            Write-Host "=== end init trace ==="
            Copy-Item $traceLog "$env:RUNNER_TEMP\dimmy_init_trace.log" -Force
          } else {
            Write-Host "No dimmy_init_trace.log -- DLL may not have loaded yet"
          }

      - name: Dump UI crash log (APPDATA)
        if: always()
        shell: pwsh
        run: |
          # App.OnLaunched catches XAML / UI exceptions and writes them here.
          # If this file exists, the app is running HEADLESS -- process alive,
          # no pill, no tray. This is the 2026-04-18 regression symptom.
          $crashLog = "$env:APPDATA\dimmy\crash.log"
          $pttLog = "$env:APPDATA\dimmy\ptt.log"
          if (Test-Path $crashLog) {
            Write-Host "=== %APPDATA%\dimmy\crash.log (UI crash, process survived) ==="
            Get-Content $crashLog
            Write-Host "=== end crash log ==="
            Copy-Item $crashLog "$env:RUNNER_TEMP\crash.log" -Force
          } else {
            Write-Host "No crash.log at $crashLog (good -- UI creation did not throw)"
          }
          if (Test-Path $pttLog) {
            Write-Host "=== %APPDATA%\dimmy\ptt.log (last 40 lines) ==="
            Get-Content $pttLog -Tail 40
            Write-Host "=== end ptt log ==="
            Copy-Item $pttLog "$env:RUNNER_TEMP\ptt.log" -Force
          }

      - name: Dump Application event log (last 5 min)
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== Recent app errors ==="
          $events = Get-WinEvent -FilterHashtable @{
            LogName='Application'
            StartTime=(Get-Date).AddMinutes(-5)
            Level=1,2,3
          } -ErrorAction SilentlyContinue
          if ($events) {
            $events | Where-Object {
              $_.Message -match 'Dimmy' -or $_.ProviderName -match 'Application Error|.NET Runtime|Windows Error Reporting'
            } | Select-Object TimeCreated, LevelDisplayName, ProviderName, Id, Message |
              Format-List | Out-String | Write-Host
          } else {
            Write-Host "(no recent app errors)"
          }

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: clean-install-test-logs
          path: |
            ${{ runner.temp }}/dimmy_startup.log
            ${{ runner.temp }}/dimmy_init_trace.log
            ${{ runner.temp }}/crash.log
            ${{ runner.temp }}/ptt.log
            ${{ runner.temp }}/launch_result.txt
          if-no-files-found: warn

      - name: Fail on crash, early exit, or headless UI
        shell: pwsh
        run: |
          $startLog = "$env:TEMP\dimmy_startup.log"
          $crashLog = "$env:APPDATA\dimmy\crash.log"
          $result = Get-Content "$env:RUNNER_TEMP\launch_result.txt" -ErrorAction SilentlyContinue
          $failed = $false
          if (Test-Path $startLog) {
            $content = Get-Content $startLog -Raw
            if ($content -match 'CRASH at') {
              Write-Host "Startup log contains CRASH entry" -ForegroundColor Red
              $failed = $true
            }
          }
          # CRITICAL: process-alive-but-UI-dead detection. App.OnLaunched wraps
          # OnboardingWindow / PillWindow creation in try/catch and writes to
          # crash.log, so the process stays alive with NO WINDOW visible. Old
          # gate returned green. This is exactly the 2026-04-18 regression.
          if (Test-Path $crashLog) {
            $crashContent = Get-Content $crashLog -Raw
            Write-Host "UI crash log present at $crashLog" -ForegroundColor Red
            Write-Host "--- crash.log ---" -ForegroundColor Red
            Write-Host $crashContent -ForegroundColor Red
            Write-Host "-----------------" -ForegroundColor Red
            Write-Host "App is running headless (process alive, no pill/tray). FAIL." -ForegroundColor Red
            $failed = $true
          }
          if ($result -eq 'exited_early') {
            Write-Host "App exited before 15s -- startup failure" -ForegroundColor Red
            $failed = $true
          }
          if ($failed) { exit 1 }
          Write-Host "Clean-install test PASSED" -ForegroundColor Green
