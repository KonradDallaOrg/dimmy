name: Staging Release

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Rust core lint + test (runs in parallel with builds) ────────────
  rust-check:
    name: Rust Lint & Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxdo-dev libdbus-1-dev libssl-dev cmake

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --features local-stt -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test --lib --features local-stt

  # ── Create release placeholder (no dependency on rust-check) ────────
  create-release:
    name: Create Staging Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          VER=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          SHA=$(git rev-parse --short HEAD)
          echo "version=${VER}-native.${SHA}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: |
          LAST_MAIN=$(git merge-base HEAD origin/main 2>/dev/null || echo "")
          if [ -n "$LAST_MAIN" ]; then
            COMMITS=$(git log --pretty=format:"- %s" "${LAST_MAIN}..HEAD" 2>/dev/null || echo "- Initial native build")
          else
            COMMITS=$(git log --pretty=format:"- %s" -20 HEAD)
          fi
          {
            echo "## Native UI Staging Build"
            echo ""
            echo "**Pre-release for testing native UIs (no WebView). Not for production.**"
            echo ""
            echo "### Changes"
            echo "$COMMITS"
            echo ""
            echo "## Downloads"
            echo ""
            echo "| Platform | File |"
            echo "|----------|------|"
            echo "| macOS (Apple Silicon) | \`Dimmy-native-macos-arm64.dmg\` |"
            echo "| Windows | \`Dimmy-native-windows-x64.zip\` |"
            echo "| Linux (GTK4) | \`Dimmy-native-linux-x86_64.AppImage\` |"
            echo ""
            echo "## Windows Requirements"
            echo ""
            echo "Requires .NET 8 Desktop Runtime. Download: https://dotnet.microsoft.com/download/dotnet/8.0"
            echo ""
            echo "## macOS Installation"
            echo ""
            echo "This build is not notarized by Apple. After copying Dimmy.app to Applications:"
            echo ""
            echo "\`\`\`bash"
            echo "xattr -d com.apple.quarantine /Applications/Dimmy.app"
            echo "\`\`\`"
            echo ""
            echo "Or: right-click the app → Open → Open in the dialog."
          } > changelog.md

      - name: Delete previous native staging release
        continue-on-error: true
        run: gh release delete staging-latest --yes --cleanup-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-latest
          name: "Dimmy ${{ steps.version.outputs.version }} (Native Staging)"
          body_path: changelog.md
          draft: true
          prerelease: true

  # ── macOS Native Build (parallel with Windows + rust-check) ─────────
  build-macos:
    name: Build macOS Native
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Rust static library
        working-directory: src-tauri
        run: cargo build --lib --release --target aarch64-apple-darwin --features local-stt-metal

      - name: Verify static library and remove dylib
        run: |
          ls -lh src-tauri/target/aarch64-apple-darwin/release/libdimmy_lib.a
          file src-tauri/target/aarch64-apple-darwin/release/libdimmy_lib.a
          rm -f src-tauri/target/aarch64-apple-darwin/release/libdimmy_lib.dylib
          rm -f src-tauri/target/aarch64-apple-darwin/release/deps/libdimmy_lib.dylib

      - name: Build Xcode project
        working-directory: native-ui/macos
        run: |
          xcodebuild -project Dimmy.xcodeproj \
            -scheme Dimmy \
            -configuration Release \
            -derivedDataPath build/derived \
            build \
            CODE_SIGN_IDENTITY="-"

      - name: Create DMG
        working-directory: native-ui/macos
        run: |
          APP_PATH="build/derived/Build/Products/Release/Dimmy.app"
          mkdir -p build/dmg
          cp -R "$APP_PATH" build/dmg/
          hdiutil create -volname "Dimmy" \
            -srcfolder build/dmg \
            -ov -format UDZO \
            "build/Dimmy-native-macos-arm64.dmg"

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-latest
          files: native-ui/macos/build/Dimmy-native-macos-arm64.dmg

  # ── Windows Native Build (parallel with macOS + rust-check) ─────────
  build-windows:
    name: Build Windows Native
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Rust DLL
        working-directory: src-tauri
        run: cargo build --lib --release --target x86_64-pc-windows-msvc --features local-stt-vulkan

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore NuGet packages
        working-directory: native-ui/windows/Dimmy.Windows
        run: dotnet restore

      - name: Build Windows app
        working-directory: native-ui/windows/Dimmy.Windows
        run: dotnet build Dimmy.Windows.csproj -c Release

      - name: Prepare distribution
        shell: pwsh
        run: |
          $binDir = "native-ui/windows/Dimmy.Windows/bin/Release/net8.0-windows10.0.19041.0"
          # Copy Rust DLL into bin output
          Copy-Item "src-tauri/target/x86_64-pc-windows-msvc/release/dimmy_lib.dll" "$binDir/"
          # Remove PDB files to reduce zip size
          Get-ChildItem "$binDir" -Filter "*.pdb" -Recurse | Remove-Item -ErrorAction SilentlyContinue
          # Create publish alias for packaging step
          New-Item -ItemType Directory -Force -Path "native-ui/windows/Dimmy.Windows/publish"
          Copy-Item "$binDir/*" "native-ui/windows/Dimmy.Windows/publish/" -Recurse

      - name: Run Windows tests
        working-directory: native-ui/windows/Dimmy.Windows.Tests
        run: dotnet test -c Release --logger "console;verbosity=normal"

      - name: Package installer
        working-directory: native-ui/windows/Dimmy.Windows
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath ..\Dimmy-native-windows-x64.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-latest
          files: native-ui/windows/Dimmy-native-windows-x64.zip

  # ── Linux Native Build (parallel with macOS + Windows + rust-check) ──
  build-linux:
    name: Build Linux (GTK4)
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native-ui/linux/target
          key: linux-cargo-${{ hashFiles('native-ui/linux/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Install GTK4 + libadwaita dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libdbus-1-dev pkg-config \
            libasound2-dev libxdo-dev libfuse2 cmake

      - name: Clippy
        working-directory: native-ui/linux
        run: cargo clippy -- -D warnings

      - name: Test
        working-directory: native-ui/linux
        run: cargo test

      - name: Build release
        working-directory: native-ui/linux
        run: cargo build --release

      - name: Package AppImage
        run: |
          # Download linuxdeploy + GTK plugin
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh

          # Build AppDir structure
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp native-ui/linux/target/release/dimmy-linux AppDir/usr/bin/
          cp native-ui/linux/assets/com.dimmy.app.desktop AppDir/usr/share/applications/
          cp native-ui/linux/assets/com.dimmy.app.svg AppDir/usr/share/icons/hicolor/scalable/apps/

          # Create AppImage with GTK plugin (bundles libgtk-4, libadwaita, etc.)
          export DEPLOY_GTK_VERSION=4
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin gtk \
            --desktop-file native-ui/linux/assets/com.dimmy.app.desktop \
            --icon-file native-ui/linux/assets/com.dimmy.app.svg \
            --output appimage

          # Rename to consistent name
          mv Dimmy*.AppImage Dimmy-native-linux-x86_64.AppImage

      - name: Upload AppImage to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-latest
          files: Dimmy-native-linux-x86_64.AppImage

      - name: Upload raw binary (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: dimmy-linux
          path: native-ui/linux/target/release/dimmy-linux

  # ── Publish (waits for all jobs including rust-check) ───────────────
  publish:
    name: Publish Staging Release
    needs: [rust-check, create-release, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
              prerelease: true
            });
