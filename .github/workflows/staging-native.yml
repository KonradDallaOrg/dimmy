name: Staging Release

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Rust core lint + test (runs in parallel with builds) ────────────
  rust-check:
    name: Rust Lint & Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxdo-dev libdbus-1-dev libssl-dev cmake

      - name: Format
        working-directory: core
        run: cargo fmt --check

      - name: Clippy
        working-directory: core
        run: cargo clippy --features local-stt -- -D warnings

      - name: Test
        working-directory: core
        run: cargo test --lib --features local-stt

  # ── Create release placeholder (no dependency on rust-check) ────────
  create-release:
    name: Create Staging Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          VER=$(grep '^version' core/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          SHA=$(git rev-parse --short HEAD)
          echo "version=${VER}-native.${SHA}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: |
          LAST_MAIN=$(git merge-base HEAD origin/main 2>/dev/null || echo "")
          if [ -n "$LAST_MAIN" ]; then
            COMMITS=$(git log --pretty=format:"- %s" "${LAST_MAIN}..HEAD" 2>/dev/null || echo "- Initial native build")
          else
            COMMITS=$(git log --pretty=format:"- %s" -20 HEAD)
          fi
          {
            echo "## Native UI Staging Build"
            echo ""
            echo "**Pre-release for testing native UIs (no WebView). Not for production.**"
            echo ""
            echo "### Changes"
            echo "$COMMITS"
            echo ""
            echo "## Downloads"
            echo ""
            echo "| Platform | File |"
            echo "|----------|------|"
            echo "| macOS (Apple Silicon) | \`Dimmy-native-macos-arm64.dmg\` |"
            echo "| Windows (installer) | \`Dimmy-win-Setup.exe\` |"
            echo "| Windows (portable) | \`Dimmy-win-Portable.zip\` |"
            echo "| Linux (GTK4) | \`Dimmy-native-linux-x86_64.AppImage\` |"
            echo ""
            echo "## Windows"
            echo ""
            echo "Self-contained — no .NET runtime or VC++ redist install needed."
            echo "- **Setup.exe**: Installer (recommended) — installs VC++ redist automatically"
            echo "- **Portable.zip**: Extract and run anywhere"
            echo ""
            echo "## macOS Installation"
            echo ""
            echo "This build is not notarized by Apple. After copying Dimmy.app to Applications:"
            echo ""
            echo "\`\`\`bash"
            echo "xattr -d com.apple.quarantine /Applications/Dimmy.app"
            echo "\`\`\`"
            echo ""
            echo "Or: right-click the app → Open → Open in the dialog."
          } > changelog.md

      - name: Delete previous native staging release
        continue-on-error: true
        run: gh release delete staging-latest --yes --cleanup-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-latest
          name: "Dimmy ${{ steps.version.outputs.version }} (Native Staging)"
          body_path: changelog.md
          draft: true
          prerelease: true

  # ── macOS Native Build (parallel with Windows + rust-check) ─────────
  build-macos:
    name: Build macOS Native
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install CMake
        run: |
          brew install cmake
          cmake --version

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          shared-key: macos-staging

      - name: Build Rust static library
        working-directory: core
        run: |
          echo "CMake: $(cmake --version | head -1)"
          echo "Xcode CLT: $(xcode-select -p)"
          cargo clean --release 2>/dev/null
          cargo build --lib --release --target aarch64-apple-darwin --features local-stt-metal,local-llm-metal

      - name: Verify static library
        run: |
          ls -lh core/target/aarch64-apple-darwin/release/libdimmy_lib.a
          file core/target/aarch64-apple-darwin/release/libdimmy_lib.a
          rm -f core/target/aarch64-apple-darwin/release/libdimmy_lib.dylib
          rm -f core/target/aarch64-apple-darwin/release/deps/libdimmy_lib.dylib
          echo "=== llama/ggml dylibs in release dir ==="
          ls -la core/target/aarch64-apple-darwin/release/libllama* core/target/aarch64-apple-darwin/release/libggml* 2>/dev/null || echo "No dylibs found"

      - name: Build Xcode project
        working-directory: platforms/macos
        run: |
          xcodebuild -project Dimmy.xcodeproj \
            -scheme Dimmy \
            -configuration Release \
            -derivedDataPath build/derived \
            build \
            CODE_SIGN_IDENTITY="-"

      - name: Bundle llama.cpp dylibs
        run: |
          APP_PATH="platforms/macos/build/derived/Build/Products/Release/Dimmy.app"
          FRAMEWORKS_DIR="$APP_PATH/Contents/Frameworks"
          mkdir -p "$FRAMEWORKS_DIR"
          RELEASE_DIR="core/target/aarch64-apple-darwin/release"

          # Copy dylibs dereferencing symlinks so every file is a real binary
          for name in libllama libggml libggml-base libggml-cpu libggml-metal; do
            for dylib in "$RELEASE_DIR"/${name}*.dylib; do
              [ -e "$dylib" ] || continue
              DEST="$FRAMEWORKS_DIR/$(basename "$dylib")"
              cp -RL "$dylib" "$DEST"
              install_name_tool -id "@rpath/$(basename "$dylib")" "$DEST" 2>/dev/null || true
            done
          done

          # Re-sign all dylibs
          codesign --force --sign - "$FRAMEWORKS_DIR"/*.dylib

          echo "=== Frameworks contents ==="
          ls -la "$FRAMEWORKS_DIR/"
          echo "=== Verifying no broken symlinks ==="
          find "$FRAMEWORKS_DIR" -type l ! -exec test -e {} \; -print | grep . && echo "BROKEN SYMLINKS FOUND" && exit 1 || echo "All OK"

      - name: Generate DMG background (SVG → PNG)
        run: |
          brew install librsvg
          rsvg-convert -w 660 -h 400 platforms/macos/dmg-assets/dmg-background.svg -o platforms/macos/dmg-assets/dmg-background.png

      - name: Create DMG
        working-directory: platforms/macos
        run: |
          brew install create-dmg
          APP_PATH="build/derived/Build/Products/Release/Dimmy.app"
          create-dmg \
            --volname "Dimmy" \
            --background "dmg-assets/dmg-background.png" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "Dimmy.app" 165 200 \
            --app-drop-link 495 200 \
            --no-internet-enable \
            "build/Dimmy-native-macos-arm64.dmg" \
            "$APP_PATH"

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-latest
          files: platforms/macos/build/Dimmy-native-macos-arm64.dmg

  # ── Windows Native Build (parallel with macOS + rust-check) ─────────
  build-windows:
    name: Build Windows Native
    needs: create-release
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest

      - name: Install VS 2026 BuildTools side-by-side (MSVC 14.50+)
        shell: pwsh
        run: |
          # windows-2025 ships VS 2022 Enterprise only (MSVC 14.44, which
          # miscompiles whisper.cpp's ggml-vulkan state-init path). 14.50+
          # lives exclusively in VS 2026 (VS 18). `setup.exe update` cannot
          # bridge major versions, so we install VS 2026 BuildTools
          # side-by-side with VCTools workload only. Used solely for the
          # Rust cargo build step; VS 2022 stays authoritative for the
          # .NET publish + UWP AppxPackage PRI generation steps that
          # follow (VS 2026 BuildTools SKU lacks those workloads).
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs2026 = & $vswhere -version "[18.0,19.0)" -products "*" -property installationPath 2>$null | Select-Object -First 1
          if ($vs2026) {
            Write-Host "VS 2026 already present at $vs2026"
          } else {
            $bootstrapper = "$env:RUNNER_TEMP\vs_buildtools.exe"
            Write-Host "Downloading VS 2026 BuildTools bootstrapper..."
            Invoke-WebRequest -Uri "https://aka.ms/vs/18/release/vs_buildtools.exe" -OutFile $bootstrapper
            $vsArgs = @(
              "--quiet", "--norestart", "--wait", "--nocache",
              "--add", "Microsoft.VisualStudio.Workload.VCTools",
              "--add", "Microsoft.VisualStudio.Component.VC.Tools.x86.x64",
              "--add", "Microsoft.VisualStudio.Component.Windows11SDK.22621"
            )
            Write-Host "Installing VS 2026 BuildTools (this takes ~10-15 min)..."
            $proc = Start-Process -FilePath $bootstrapper -ArgumentList $vsArgs -Wait -NoNewWindow -PassThru
            # 0=success, 3010=success+reboot-required (we don't reboot)
            if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
              throw "VS 2026 BuildTools install failed with exit $($proc.ExitCode)"
            }
            $vs2026 = & $vswhere -version "[18.0,19.0)" -products "*" -property installationPath 2>$null | Select-Object -First 1
            if (-not $vs2026) { throw "VS 2026 not found after install (aka.ms URL may be outdated or install silently failed)" }
          }
          $tools = Get-ChildItem "$vs2026\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          Write-Host "VS 2026 MSVC toolchain: $($tools.Name) at $vs2026"
          $ver = [version]($tools.Name -replace '^(\d+\.\d+\.\d+).*','$1')
          if ($ver -lt [version]"14.50") {
            throw "VS 2026 has MSVC $($tools.Name), still < 14.50 — aka.ms/vs/18/release may point at an older build"
          }
          echo "VS2026_PATH=$vs2026" >> $env:GITHUB_ENV

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdkDir = Get-ChildItem "C:\VulkanSDK" -Directory | Select-Object -First 1
          echo "VULKAN_SDK=$($sdkDir.FullName)" >> $env:GITHUB_ENV
          echo "$($sdkDir.FullName)\Bin" >> $env:GITHUB_PATH
          Write-Host "Vulkan SDK: $($sdkDir.FullName)"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          shared-key: windows-staging

      - name: Build Rust DLL (VS 2026 MSVC env)
        working-directory: core
        shell: cmd
        env:
          LIBCLANG_PATH: "C:\\Program Files\\LLVM\\bin"
          CMAKE_GENERATOR: Ninja
          CARGO_TARGET_DIR: "D:\\t"
        run: |
          REM Activate VS 2026 MSVC for this step only — PATH, INCLUDE,
          REM LIB point at the 14.50+ toolchain. Subsequent steps inherit
          REM the original job env (VS 2022) because activation is
          REM scoped to this shell invocation. cmd is required because
          REM vcvars64.bat is a batch script.
          call "%VS2026_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cargo clean --release 2>nul
          cargo build --lib --release --features local-stt-vulkan,local-llm-vulkan

      - name: Gate — verify dimmy_lib.dll linker version
        shell: pwsh
        run: |
          # Hard gate: the whisper Vulkan backend miscompile lives in MSVC
          # linker <= 14.44. Any DLL linked with an older toolchain must NOT
          # ship. Extracts the linker version from PE headers and aborts if
          # too old. Prevents another v0.6.11-style ship of a known-broken
          # build.
          $dll = "D:\t\release\dimmy_lib.dll"
          if (-not (Test-Path $dll)) { throw "dimmy_lib.dll not found at $dll" }
          $out = & dumpbin /headers $dll
          $line = $out | Select-String "linker version" | Select-Object -First 1
          if (-not $line) { throw "Could not find linker version in dumpbin output" }
          if ($line -notmatch '(\d+)\.(\d+)') { throw "Could not parse linker version from '$line'" }
          $linkerVer = [version]("$($Matches[1]).$($Matches[2])")
          Write-Host "dimmy_lib.dll linker version: $linkerVer"
          if ($linkerVer -lt [version]"14.50") {
            throw "dimmy_lib.dll linked with MSVC $linkerVer. Known whisper.cpp Vulkan codegen bug in <14.50. Aborting release. Update the windows-2025 runner image or fix the VS update step."
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore NuGet packages
        working-directory: platforms/windows/Dimmy.Windows
        run: dotnet restore

      - name: Locate VS AppxPackage tools (for MrtCore PRI generation)
        shell: pwsh
        run: |
          # MrtCore.PriGen.targets references Microsoft.Build.Packaging.Pri.Tasks.dll
          # which only ships with the VS AppxPackage workload, not the .NET SDK.
          # Without it, resources.pri is not generated and the app runs headless at
          # runtime (every ms-appx:///Views/*.xaml URI fails to resolve).
          # Pin to VS 2022 (17.x) — the side-by-side VS 2026 BuildTools used
          # for the Rust build lacks UWP/AppxPackage workloads entirely, so
          # a naive `-latest` would pick VS 2026 and this step would fail.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -version "[17.0,18.0)" -products "*" -property installationPath | Select-Object -First 1
          if (-not $vs) { throw "vswhere did not find a VS 2022 install" }
          $candidates = @(
            "$vs\MSBuild\Microsoft\VisualStudio\v17.0\AppxPackage\",
            "$vs\MSBuild\Microsoft\VisualStudio\v18.0\AppxPackage\"
          )
          $found = $candidates | Where-Object { Test-Path (Join-Path $_ "Microsoft.Build.Packaging.Pri.Tasks.dll") } | Select-Object -First 1
          if (-not $found) {
            Write-Host "VS install at: $vs"
            Write-Host "Probed paths:"
            $candidates | ForEach-Object { Write-Host "  - $_" }
            throw "Microsoft.Build.Packaging.Pri.Tasks.dll not found in VS install. UWP workload missing?"
          }
          Write-Host "AppxMSBuildToolsPath = $found"
          echo "AppxMSBuildToolsPath=$found" >> $env:GITHUB_ENV

      - name: Publish Windows app (self-contained)
        working-directory: platforms/windows/Dimmy.Windows
        run: dotnet publish Dimmy.Windows.csproj -c Release -r win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -p:SelfContained=true "-p:AppxMSBuildToolsPath=$env:AppxMSBuildToolsPath" -o publish

      - name: Prepare distribution
        shell: pwsh
        run: |
          # No co-located VC++ runtime: Velopack `--framework vcredist143-x64`
          # already installs the official Microsoft VC Redist at setup time,
          # which lands in System32. Shipping a second copy next to
          # dimmy_lib.dll is at best redundant and at worst overrides System32
          # with an older ABI (v0.6.10 crash cause). System32 wins.
          $pubDir = "platforms/windows/Dimmy.Windows/publish"
          Copy-Item "D:\t\release\dimmy_lib.dll" "$pubDir/"
          Get-ChildItem "$pubDir" -Filter "*.pdb" -Recurse | Remove-Item -ErrorAction SilentlyContinue

      - name: Verify self-contained bundle
        shell: pwsh
        run: platforms/windows/verify-self-contained.ps1 -Path platforms/windows/Dimmy.Windows/publish

      - name: Run Windows tests
        working-directory: platforms/windows/Dimmy.Windows.Tests
        run: dotnet test -c Release --logger "console;verbosity=normal"

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Package with Velopack (self-contained + VC++ redist)
        shell: pwsh
        run: |
          $version = "${{ needs.create-release.outputs.version }}"
          # Velopack needs semver (X.Y.Z) — extract base version before any suffix
          if ($version -match '^(\d+\.\d+\.\d+)') { $semver = $Matches[1] } else { $semver = "0.0.1" }
          $pubDir = (Resolve-Path "platforms/windows/Dimmy.Windows/publish").Path
          Write-Host "Packing Velopack v$semver from $pubDir"
          vpk pack --packId Dimmy --packVersion $semver --packDir "$pubDir" --mainExe Dimmy.Windows.exe --icon "platforms/windows/Dimmy.Windows/Assets/dimmy.ico" --framework "vcredist143-x64" --outputDir platforms/windows/velopack-output
          Get-ChildItem platforms/windows/velopack-output | ForEach-Object { Write-Host "$($_.Name) ($([math]::Round($_.Length/1MB, 1)) MB)" }

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-latest
          files: |
            platforms/windows/velopack-output/Dimmy-win-Setup.exe
            platforms/windows/velopack-output/Dimmy-win-Portable.zip

  # ── Linux Native Build (parallel with macOS + Windows + rust-check) ──
  build-linux:
    name: Build Linux (GTK4)
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platforms/linux/target
          key: linux-cargo-${{ hashFiles('platforms/linux/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Install GTK4 + libadwaita dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libdbus-1-dev pkg-config \
            libasound2-dev libxdo-dev libfuse2 cmake

      - name: Clippy
        working-directory: platforms/linux
        run: cargo clippy -- -D warnings

      - name: Test
        working-directory: platforms/linux
        run: cargo test

      - name: Build release
        working-directory: platforms/linux
        run: cargo build --release

      - name: Package AppImage
        run: |
          # Download linuxdeploy + GTK plugin
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh

          # Build AppDir structure
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp platforms/linux/target/release/dimmy-linux AppDir/usr/bin/
          cp platforms/linux/assets/com.dimmy.app.desktop AppDir/usr/share/applications/
          cp platforms/linux/assets/com.dimmy.app.svg AppDir/usr/share/icons/hicolor/scalable/apps/

          # Create AppImage with GTK plugin (bundles libgtk-4, libadwaita, etc.)
          export DEPLOY_GTK_VERSION=4
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin gtk \
            --desktop-file platforms/linux/assets/com.dimmy.app.desktop \
            --icon-file platforms/linux/assets/com.dimmy.app.svg \
            --output appimage

          # Rename to consistent name
          mv Dimmy*.AppImage Dimmy-native-linux-x86_64.AppImage

      - name: Upload AppImage to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: staging-latest
          files: Dimmy-native-linux-x86_64.AppImage

      - name: Upload raw binary (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: dimmy-linux
          path: platforms/linux/target/release/dimmy-linux

  # ── Clean-machine install test ──────────────────────────────────────
  # Gates publish: if the installer is broken on a fresh Windows runner,
  # the staging release stays in draft and never reaches testers.
  test-install:
    name: Test Install (Clean Windows)
    needs: build-windows
    uses: ./.github/workflows/test-install.yml
    permissions:
      contents: write
    with:
      tag: staging-latest

  # ── Publish (waits for all jobs including rust-check + test-install) ─
  publish:
    name: Publish Staging Release
    needs: [rust-check, create-release, build-macos, build-windows, build-linux, test-install]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
              prerelease: true
            });
