name: Staging Tester Build (signed)

# Sibling pipeline of release.yml — produces installers signed against
# the STAGING licensing keypair, talking to license-staging.dimmy.app,
# with distinct packId / bundle id so a tester can run staging
# side-by-side with a prod install on the same machine.
#
# Trigger: tags matching `v*-staging` (e.g. `v0.6.27-staging.1`). Prod
# releases keep using `v*` and release.yml — this file does NOT touch
# that pipeline at all, it just lives next to it.
#
# Inputs (GitHub Secrets):
#   - DIMMY_LICENSE_PUBKEY_STAGING   public key matching the staging
#                                    Worker's DIMMY_LICENSE_PRIVKEY
#                                    secret. Public-by-design (Ed25519).
#   - POSTHOG_API_KEY                shared with prod (telemetry not
#                                    segregated — tester analytics +
#                                    crashes flow into the same project)
#   - SENTRY_DSN                     same as POSTHOG
#
# What is NOT here:
#   - Linux build: staging is iterative tester channel; Linux can be
#     added later if needed.
#   - test-install gate: staging tags should ship even if the smoke
#     test fails (testers help us find those bugs).
#   - publish-release: staging GH releases land as `prerelease=true`
#     and stay there — never auto-promote to "Latest".

on:
  push:
    tags:
      - "v*-staging*"

permissions:
  contents: write

jobs:
  # ── Create staging release placeholder ─────────────────────────────
  create-release:
    name: Create Staging Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: |
          # Pick prev tag matching the same staging shape, never a
          # prod rc/final. Cap visible commits at 10, collapse the
          # rest in <details>. Same rationale + incident as release.yml.
          PREV_TAG=$(git tag --sort=-creatordate --list 'v*-staging*' | grep -v "^${GITHUB_REF_NAME}$" | head -n 1)
          if [ -z "$PREV_TAG" ]; then
            ALL=$(git log --pretty=format:"- %s" --no-merges HEAD | head -n 50)
            HEADER="## What's Changed"
          else
            ALL=$(git log --pretty=format:"- %s" --no-merges "${PREV_TAG}..HEAD")
            HEADER="## What's Changed since \`${PREV_TAG}\`"
          fi
          TOTAL=$(printf '%s\n' "$ALL" | grep -c . || true)
          FIRST=$(printf '%s\n' "$ALL" | head -n 10)
          REST=$(printf '%s\n' "$ALL" | tail -n +11)
          {
            echo "## Staging build"
            echo ""
            echo "Test environment build — installs side-by-side with prod Dimmy."
            echo "Talks to **license-staging.dimmy.app** (Stripe TEST). Use card"
            echo "\`4242 4242 4242 4242\` (any future expiry, any CVC)."
            echo ""
            echo "**This binary will NOT process real payments.** All purchases"
            echo "are simulated. See [staging-testing.md](https://github.com/${{ github.repository }}/blob/feat/licensing-poc/docs/dev/staging-testing.md)."
            echo ""
            echo "$HEADER"
            echo ""
            echo "$FIRST"
            if [ -n "$REST" ]; then
              MORE=$((TOTAL - 10))
              echo ""
              echo "<details><summary><b>$MORE more commit(s)…</b></summary>"
              echo ""
              echo "$REST"
              echo ""
              echo "</details>"
            fi
            echo ""
            echo "## Downloads"
            echo ""
            echo "| Platform | File |"
            echo "|----------|------|"
            echo "| Windows (installer) | \`Dimmy-Staging-win-Setup.exe\` |"
            echo "| Windows (portable)  | \`Dimmy-Staging-win-Portable.zip\` |"
            echo "| macOS (Apple Silicon) | \`Dimmy-Staging-macos-arm64.dmg\` |"
            echo ""
            echo "Install paths:"
            echo "- Win: \`%LOCALAPPDATA%\\Dimmy-Staging\\\` (separate from prod \`Dimmy\\\`)"
            echo "- Mac: \`/Applications/Dimmy Staging.app\` (bundle id \`com.dimmy.staging\`)"
            echo "- Config: \`%APPDATA%\\dimmy-staging\\\` / \`~/Library/Application Support/dimmy-staging/\`"
          } > changelog.md
          cat changelog.md

      - name: Create GitHub Release
        id: create
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Dimmy ${{ steps.version.outputs.version }} (staging)"
          body_path: changelog.md
          draft: false
          prerelease: true

  # ── macOS staging build ────────────────────────────────────────────
  build-macos:
    name: Build macOS Native (staging)
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install CMake
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          cmake --version

      - name: Verify Swift toolchain (need 5.10+ for FluidAudio)
        run: |
          swift --version
          xcodebuild -version | head -2

      - name: Fetch onnxruntime arm64 dylib
        run: scripts/download-onnxruntime.sh

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          shared-key: macos-staging

      - name: Cache FluidAudio Swift build
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/FluidAudio*
            ~/Library/Caches/org.swift.swiftpm
            core/target/aarch64-apple-darwin/release/build/fluidaudio-rs-*
          key: fluidaudio-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: |
            fluidaudio-${{ runner.os }}-

      - name: Restore prebuilt core static lib from cache
        id: dllcache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          SCCACHE_R2_ENDPOINT: ${{ secrets.SCCACHE_R2_ENDPOINT }}
          DIMMY_LICENSE_PUBKEY: ${{ secrets.DIMMY_LICENSE_PUBKEY_STAGING }}
          DIMMY_LICENSE_SERVER_URL: https://license-staging.dimmy.app
          DIMMY_BUILD_FLAVOR: staging
          DIMMY_CONFIG_NAMESPACE: dimmy-staging
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          FEAT: "local-stt-metal,local-llm-metal,local-stt-parakeet-coreml,local-stt-parakeet-fluid,local-dfn,license-client"
        run: |
          res="$(scripts/dev/dll-cache.sh restore mac-arm64 "$FEAT" "core/target/aarch64-apple-darwin/release/libdimmy_lib.a" || echo MISS)"
          echo "restore: $res"
          if [ "$res" = "HIT" ]; then
            echo "DLL_REUSED=1" >> "$GITHUB_ENV"
            echo "::notice title=DLL reuse::core unchanged — reused cached libdimmy_lib.a, skipped the build"
          else
            echo "::notice title=DLL reuse::core changed / no cache — full build"
          fi

      - name: Build Rust static library (staging flavor)
        if: env.DLL_REUSED != '1'
        working-directory: core
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          DIMMY_LICENSE_PUBKEY: ${{ secrets.DIMMY_LICENSE_PUBKEY_STAGING }}
          DIMMY_LICENSE_SERVER_URL: https://license-staging.dimmy.app
          DIMMY_BUILD_FLAVOR: staging
          # Side-by-side install with prod: distinct packId (Dimmy-Staging) +
          # distinct config dir. The other staging pipeline (staging-auto-update.yml,
          # same Velopack packId as prod for channel-prerelease auto-update)
          # does NOT set this — its users share the prod config dir.
          DIMMY_CONFIG_NAMESPACE: dimmy-staging
        run: |
          cargo clean --release 2>/dev/null
          cargo build --lib --release --target aarch64-apple-darwin \
            --features local-stt-metal,local-llm-metal,local-stt-parakeet-coreml,local-stt-parakeet-fluid,local-dfn,license-client

      - name: Store prebuilt core static lib to cache
        if: env.DLL_REUSED != '1'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          SCCACHE_R2_ENDPOINT: ${{ secrets.SCCACHE_R2_ENDPOINT }}
          DIMMY_LICENSE_PUBKEY: ${{ secrets.DIMMY_LICENSE_PUBKEY_STAGING }}
          DIMMY_LICENSE_SERVER_URL: https://license-staging.dimmy.app
          DIMMY_BUILD_FLAVOR: staging
          DIMMY_CONFIG_NAMESPACE: dimmy-staging
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          FEAT: "local-stt-metal,local-llm-metal,local-stt-parakeet-coreml,local-stt-parakeet-fluid,local-dfn,license-client"
        run: scripts/dev/dll-cache.sh store mac-arm64 "$FEAT" "core/target/aarch64-apple-darwin/release/libdimmy_lib.a" || true

      - name: Verify static library
        run: |
          ls -lh core/target/aarch64-apple-darwin/release/libdimmy_lib.a
          rm -f core/target/aarch64-apple-darwin/release/libdimmy_lib.dylib
          rm -f core/target/aarch64-apple-darwin/release/deps/libdimmy_lib.dylib

      # ── Developer ID signing + notarization (graceful-skip) ──────────
      # When the MACOS_CERT_P12 secret is present, import the Developer ID
      # Application cert into an ephemeral keychain so the build is signed
      # with a STABLE identity (Team ID derived from the cert). That is what makes macOS
      # TCC keep the mic / audio-capture / accessibility grants across
      # Sparkle updates instead of re-prompting (ad-hoc has no stable
      # designated requirement → every update looks like a new app), and
      # what lets `notarytool` accept the build. When the secret is absent
      # the job falls back to ad-hoc `-` exactly like before — so this
      # change is inert until the secrets are configured.
      #
      # Required GitHub Secrets to activate:
      #   MACOS_CERT_P12        base64 of the Developer ID Application .p12
      #   MACOS_CERT_PASSWORD   the .p12 export password
      #   APPLE_API_KEY_P8      base64 of the App Store Connect API key .p8
      #   APPLE_API_KEY_ID      the key's Key ID
      #   APPLE_API_ISSUER_ID   the key's Issuer ID
      - name: Import Apple Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12:-}" ]; then
            echo "::warning::MACOS_CERT_P12 not set — building ad-hoc (no Developer ID, no notarization). Gatekeeper will warn on first open and TCC grants will reset on every Sparkle update."
            echo "MACOS_SIGNED=0" >> "$GITHUB_ENV"
            echo "SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH" >/dev/null
          # Put our keychain first in the search list so xcodebuild/codesign find the identity.
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | sed 's/"//g')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::Developer ID Application identity not found in the imported .p12"
            exit 1
          fi
          # Derive the Team ID from the identity itself (the trailing
          # "(TEAMID)") so it can never drift from the cert — no hardcode,
          # no separate secret to keep in sync.
          SIGN_TEAM="$(printf '%s' "$IDENTITY" | sed -E 's/.*\(([A-Z0-9]+)\)$/\1/')"
          echo "Imported signing identity: $IDENTITY  (team $SIGN_TEAM)"
          echo "MACOS_SIGNED=1" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGN_TEAM=$SIGN_TEAM" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build Xcode project (staging bundle id)
        working-directory: platforms/macos
        run: |
          set -euo pipefail
          if [ "${MACOS_SIGNED:-0}" = "1" ]; then
            # Stable Developer ID identity + hardened runtime (required for
            # notarization). The entitlements file (CODE_SIGN_ENTITLEMENTS in
            # the pbxproj) carries cs.disable-library-validation so the
            # hardened-runtime app can dlopen the bundled ML dylibs.
            xcodebuild -project Dimmy.xcodeproj \
              -scheme Dimmy \
              -configuration Release \
              -derivedDataPath build/derived \
              PRODUCT_BUNDLE_IDENTIFIER=com.dimmy.staging \
              PRODUCT_NAME="Dimmy Staging" \
              build \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
              DEVELOPMENT_TEAM="$SIGN_TEAM" \
              ENABLE_HARDENED_RUNTIME=YES \
              OTHER_CODE_SIGN_FLAGS="--timestamp --options runtime"
          else
            xcodebuild -project Dimmy.xcodeproj \
              -scheme Dimmy \
              -configuration Release \
              -derivedDataPath build/derived \
              PRODUCT_BUNDLE_IDENTIFIER=com.dimmy.staging \
              PRODUCT_NAME="Dimmy Staging" \
              build \
              CODE_SIGN_IDENTITY="-"
          fi

      - name: Bundle llama.cpp dylibs
        run: |
          APP_PATH="platforms/macos/build/derived/Build/Products/Release/Dimmy Staging.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="platforms/macos/build/derived/Build/Products/Release/Dimmy.app"
          fi
          FRAMEWORKS_DIR="$APP_PATH/Contents/Frameworks"
          mkdir -p "$FRAMEWORKS_DIR"
          RELEASE_DIR="core/target/aarch64-apple-darwin/release"
          for name in libllama libggml libggml-base libggml-cpu libggml-metal; do
            for dylib in "$RELEASE_DIR"/${name}*.dylib; do
              [ -e "$dylib" ] || continue
              DEST="$FRAMEWORKS_DIR/$(basename "$dylib")"
              cp -RL "$dylib" "$DEST"
              install_name_tool -id "@rpath/$(basename "$dylib")" "$DEST" 2>/dev/null || true
            done
          done
          codesign --force --sign - "$FRAMEWORKS_DIR"/*.dylib

      # MCP bridge binary — the wizard installs it into the user's
      # Claude Extensions dir, but the binary itself ships inside the
      # .app bundle so the install step has a source to copy from.
      # Without this step the wizard fails with rc -2 ("binary not
      # found in app bundle"). The mcp-server crate is small (~1.2 MB)
      # and has no llama/whisper deps, so it builds in seconds.
      - name: Build dimmy-mcp for aarch64-apple-darwin
        working-directory: mcp-server
        run: cargo build --release --target aarch64-apple-darwin

      - name: Copy dimmy-mcp into .app Resources
        run: |
          APP_PATH="platforms/macos/build/derived/Build/Products/Release/Dimmy Staging.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="platforms/macos/build/derived/Build/Products/Release/Dimmy.app"
          fi
          RESOURCES_DIR="$APP_PATH/Contents/Resources"
          cp "mcp-server/target/aarch64-apple-darwin/release/dimmy-mcp" "$RESOURCES_DIR/dimmy-mcp"
          chmod +x "$RESOURCES_DIR/dimmy-mcp"
          codesign --force --sign - "$RESOURCES_DIR/dimmy-mcp"

      # Re-sign inside-out with the Developer ID identity + secure timestamp.
      # The Xcode build phases bundle the ML dylibs but sign them with
      # `--timestamp=none`, and dimmy-mcp is injected *after* xcodebuild — so
      # without this step notarization rejects the build ("signature does not
      # include a secure timestamp"). We sign nested code first (dylibs, the
      # mcp helper) then re-seal the .app last, with hardened runtime +
      # entitlements. No-op when building ad-hoc.
      - name: Sign app for Developer ID + hardened runtime
        if: ${{ env.MACOS_SIGNED == '1' }}
        run: |
          set -euo pipefail
          APP_PATH="platforms/macos/build/derived/Build/Products/Release/Dimmy Staging.app"
          [ -d "$APP_PATH" ] || APP_PATH="platforms/macos/build/derived/Build/Products/Release/Dimmy.app"
          ENTITLEMENTS="platforms/macos/Dimmy/Dimmy.entitlements"
          sign() { codesign --force --options runtime --timestamp \
            --keychain "$KEYCHAIN_PATH" --sign "$SIGN_IDENTITY" "$@"; }
          # 1. Nested dylibs (libllama/libggml*, libonnxruntime).
          while IFS= read -r -d '' f; do sign "$f"; done \
            < <(find "$APP_PATH/Contents/Frameworks" -type f -name '*.dylib' -print0 2>/dev/null)
          # 2. Sparkle ships nested helpers (Updater.app, Autoupdate, and the
          #    Downloader/Installer XPC services) that xcodebuild does NOT
          #    re-sign with our identity + secure timestamp — notarization
          #    rejects exactly those four. Sign them inside-out, then re-seal
          #    the framework. Glob the version dir (currently "B", skip the
          #    "Current" symlink) so a Sparkle bump doesn't break this. This is
          #    the official Sparkle recipe for non-sandboxed apps (no
          #    per-helper entitlements needed). Burned on v0.6.53-staging.5.
          SPK="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          if [ -d "$SPK" ]; then
            for vd in "$SPK"/Versions/*/; do
              case "$vd" in */Current/) continue;; esac
              for item in "$vd"XPCServices/*.xpc "$vd"Autoupdate "$vd"Updater.app; do
                [ -e "$item" ] && sign "$item"
              done
            done
            sign "$SPK"
          fi
          # 3. Helper binary.
          [ -f "$APP_PATH/Contents/Resources/dimmy-mcp" ] && sign "$APP_PATH/Contents/Resources/dimmy-mcp"
          # 4. Re-seal the app bundle last, with entitlements.
          sign --entitlements "$ENTITLEMENTS" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Notarize and staple .app
        if: ${{ env.MACOS_SIGNED == '1' }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT
          ZIP="$RUNNER_TEMP/Dimmy-Staging.zip"
          /usr/bin/ditto -c -k --keepParent "$APP_PATH" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --key "$KEY_FILE" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 2h
          # Staple the ticket onto the .app so post-update launches and
          # offline Gatekeeper checks succeed without a network round-trip.
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      - name: "Generate DMG background (multi-rep TIFF: 1x + 2x Retina)"
        run: |
          brew install librsvg
          # See release.yml for the why — single 2× PNG was treated as
          # 1× native by Finder and only the top-left quadrant rendered
          # inside the 660×400 window. Multi-rep TIFF lets Finder pick
          # the right rep at display time.
          rsvg-convert -w 660  -h 400 platforms/macos/dmg-assets/dmg-background.svg -o platforms/macos/dmg-assets/dmg-background.png
          rsvg-convert -w 1320 -h 800 platforms/macos/dmg-assets/dmg-background.svg -o platforms/macos/dmg-assets/dmg-background@2x.png
          tiffutil -cathidpicheck \
            platforms/macos/dmg-assets/dmg-background.png \
            platforms/macos/dmg-assets/dmg-background@2x.png \
            -out platforms/macos/dmg-assets/dmg-background.tiff

      - name: Create DMG
        working-directory: platforms/macos
        run: |
          # See note in staging-auto-update.yml — explicit `ln -s
          # /Applications` is required; create-dmg's flag alone does
          # not create the symlink. Also: tester DMG previously had
          # neither `--icon` nor `--app-drop-link`, so the window was
          # empty of affordances; restore both alongside the symlink.
          brew install create-dmg
          APP_PATH="build/derived/Build/Products/Release/Dimmy Staging.app"
          DMG_APP_NAME="Dimmy Staging.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="build/derived/Build/Products/Release/Dimmy.app"
            DMG_APP_NAME="Dimmy.app"
          fi
          mkdir -p build/dmg-contents
          rm -rf "build/dmg-contents/$DMG_APP_NAME"
          cp -R "$APP_PATH" build/dmg-contents/
          ln -sf /Applications build/dmg-contents/Applications
          create-dmg \
            --volname "Dimmy Staging" \
            --background "dmg-assets/dmg-background.tiff" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "$DMG_APP_NAME" 165 200 \
            --app-drop-link 495 200 \
            --no-internet-enable \
            "build/Dimmy-Staging-macos-arm64.dmg" \
            "build/dmg-contents"

      # Notarize the DMG too, so the initial download opens without the
      # "Apple cannot check it for malicious software" Gatekeeper prompt.
      # The .app inside is already stapled (previous step), so an offline
      # machine can still verify it after drag-to-Applications. No-op ad-hoc.
      - name: Notarize and staple DMG
        if: ${{ env.MACOS_SIGNED == '1' }}
        working-directory: platforms/macos
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT
          DMG="build/Dimmy-Staging-macos-arm64.dmg"
          xcrun notarytool submit "$DMG" \
            --key "$KEY_FILE" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 2h
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Upload DMG
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: platforms/macos/build/Dimmy-Staging-macos-arm64.dmg

  # ── Windows staging build ──────────────────────────────────────────
  build-windows:
    name: Build Windows Native (staging)
    needs: create-release
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest

      - name: Install VS 2026 BuildTools side-by-side (MSVC 14.50+)
        shell: pwsh
        run: |
          # Same toolchain dance as release.yml — needed because
          # whisper-vulkan miscompiles on MSVC <= 14.44 (windows-2025
          # default). See release.yml step for the gory rationale.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs2026 = & $vswhere -version "[18.0,19.0)" -prerelease -products "*" -property installationPath 2>$null | Select-Object -First 1
          if (-not $vs2026) {
            $params = "--add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.Component.Windows11SDK.22621 --quiet --norestart --wait --nocache"
            $maxTries = 3
            for ($attempt = 1; $attempt -le $maxTries; $attempt++) {
              choco install visualstudio2026buildtools-preview -y --pre --no-progress --package-parameters="$params"
              for ($i = 0; $i -lt 12; $i++) {
                Start-Sleep -Seconds 5
                $vs2026 = & $vswhere -version "[18.0,19.0)" -prerelease -products "*" -property installationPath 2>$null | Select-Object -First 1
                if ($vs2026) { break }
              }
              if ($vs2026) { break }
              Start-Sleep -Seconds (30 * $attempt)
            }
            if (-not $vs2026) { throw "VS 2026 not found after $maxTries attempts" }
          }
          Add-Content -Path $env:GITHUB_ENV -Value "VS2026_PATH=$vs2026" -Encoding utf8
          exit 0

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $maxTries = 3
          $sdkDir = $null
          for ($attempt = 1; $attempt -le $maxTries; $attempt++) {
            choco install vulkan-sdk -y --no-progress
            $sdkDir = Get-ChildItem "C:\VulkanSDK" -Directory -ErrorAction SilentlyContinue |
                      Sort-Object Name -Descending | Select-Object -First 1
            if ($sdkDir) { break }
            Start-Sleep -Seconds (30 * $attempt)
          }
          if (-not $sdkDir) { throw "VulkanSDK not found" }
          echo "VULKAN_SDK=$($sdkDir.FullName)" >> $env:GITHUB_ENV
          echo "$($sdkDir.FullName)\Bin" >> $env:GITHUB_PATH

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          shared-key: windows-staging

      # ── DLL reuse (skip the ~15min build when the Rust core is unchanged) ──
      # Restores dimmy_lib.dll from R2 keyed by a content hash of the core
      # (src/build.rs/assets/deps + features + toolchain + build-time license/
      # flavor/telemetry env). HIT -> skip the build step below. Fail-safe:
      # any error degrades to MISS -> full build. The linker-version gate
      # still validates the restored DLL.
      - name: Restore prebuilt core DLL from cache
        id: dllcache
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          SCCACHE_R2_ENDPOINT: ${{ secrets.SCCACHE_R2_ENDPOINT }}
          # MUST mirror the Build step's embedded env so the hash matches.
          DIMMY_LICENSE_PUBKEY: ${{ secrets.DIMMY_LICENSE_PUBKEY_STAGING }}
          DIMMY_LICENSE_SERVER_URL: https://license-staging.dimmy.app
          DIMMY_BUILD_FLAVOR: staging
          DIMMY_CONFIG_NAMESPACE: dimmy-staging
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          FEAT: "local-stt-vulkan,local-stt-parakeet,local-llm-vulkan,local-dfn,license-client"
        run: |
          res="$(scripts/dev/dll-cache.sh restore win-x64 "$FEAT" "D:/t/release/dimmy_lib.dll" || echo MISS)"
          echo "restore: $res"
          if [ "$res" = "HIT" ]; then
            echo "DLL_REUSED=1" >> "$GITHUB_ENV"
            echo "::notice title=DLL reuse::core unchanged — reused cached dimmy_lib.dll, skipped the ~15min build"
          else
            echo "::notice title=DLL reuse::core changed / no cache — full build"
          fi

      - name: Build Rust DLL (staging flavor, VS 2026 MSVC env)
        if: env.DLL_REUSED != '1'
        working-directory: core
        shell: cmd
        env:
          LIBCLANG_PATH: "C:\\Program Files\\LLVM\\bin"
          CMAKE_GENERATOR: Ninja
          CARGO_TARGET_DIR: "D:\\t"
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          DIMMY_LICENSE_PUBKEY: ${{ secrets.DIMMY_LICENSE_PUBKEY_STAGING }}
          DIMMY_LICENSE_SERVER_URL: https://license-staging.dimmy.app
          DIMMY_BUILD_FLAVOR: staging
          # Side-by-side install with prod: distinct packId (Dimmy-Staging) +
          # distinct config dir.
          DIMMY_CONFIG_NAMESPACE: dimmy-staging
        run: |
          call "%VS2026_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          REM ── DO NOT add `cargo clean --release` back here ──
          REM     Dropped 2026-05-14 to reuse the Swatinem/rust-cache@v2
          REM     restore — saves 20-25 min per Win build. Safety net:
          REM     "Gate — verify dimmy_lib.dll linker version" runs
          REM     dumpbin and aborts if linker < 14.50.
          REM     Memory: feedback_cargo_clean_dropped_from_win_ci.md
          REM     If a Win tester ever sees a broken signed DLL, FIRST
          REM     add `cargo clean --release` back and re-run.
          # Feature set FROZEN — must always include local-stt-vulkan +
          # local-stt-parakeet + local-llm-vulkan + local-dfn. Dropping
          # ANY of these = silent runtime trap: dictation/meeting paths
          # that switch to parakeet at user-config time fail with "local
          # model: parakeet inference requires the `local-stt-parakeet`
          # cargo feature" once per chunk, while telemetry says
          # transcription.failed. The flagged side-by-side staging
          # install (Dimmy-Staging package) was missing parakeet until
          # 2026-05-12. Mirrors the rule documented in CLAUDE.md §
          # "Windows local DLL build — feature flag set is FROZEN".
          #
          # `local-dfn` pulls the DeepFilterNet3 ML noise suppressor
          # via the KonradDallaOrg/DeepFilterNet fork (branch
          # fix/tract-ndarray-port — patches upstream against current
          # tract / ndarray; same pattern as the llama-cpp-rs fork).
          # Without it, AEC falls back to nnnoiseless. Frozen here so
          # staging testers always exercise the production-default
          # backend.
          cargo build --lib --release --features local-stt-vulkan,local-stt-parakeet,local-llm-vulkan,local-dfn,license-client

      - name: Store prebuilt core DLL to cache
        if: env.DLL_REUSED != '1'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          SCCACHE_R2_ENDPOINT: ${{ secrets.SCCACHE_R2_ENDPOINT }}
          DIMMY_LICENSE_PUBKEY: ${{ secrets.DIMMY_LICENSE_PUBKEY_STAGING }}
          DIMMY_LICENSE_SERVER_URL: https://license-staging.dimmy.app
          DIMMY_BUILD_FLAVOR: staging
          DIMMY_CONFIG_NAMESPACE: dimmy-staging
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          FEAT: "local-stt-vulkan,local-stt-parakeet,local-llm-vulkan,local-dfn,license-client"
        run: scripts/dev/dll-cache.sh store win-x64 "$FEAT" "D:/t/release/dimmy_lib.dll" || true

      - name: Fetch onnxruntime win-x64 DLL (Parakeet ort path)
        # ort 2.0.0-rc.10 binds to onnxruntime 1.22.0; the .csproj
        # CopyOrtDll target reads this path so the DLL ends up next to
        # dimmy_lib.dll in publish/. Mirror of release.yml. Without
        # this step the Velopack staging bundle ships WITHOUT
        # onnxruntime.dll, the ort crate falls back to the System32
        # onnxruntime.dll (v1.17.1), and Parakeet panics on first
        # session create with "expected 1.22.x, but got 1.17.1" —
        # poisoning the mutex so every subsequent chunk fails too.
        # Burned 2026-05-17 on v0.6.47-staging.2.
        shell: pwsh
        run: scripts/download-onnxruntime.ps1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        working-directory: platforms/windows/Dimmy.Windows
        run: dotnet restore

      - name: Locate VS AppxPackage tools
        shell: pwsh
        run: |
          # Accept either VS 2022 (17.x) or VS 2026 Enterprise (18.x).
          # The candidates array below probes both v17.0/AppxPackage and
          # v18.0/AppxPackage subpaths, so vswhere just needs to surface
          # ANY VS install with the UWP workload. On the new
          # windows-2025-vs2026 runner image VS 2022 is gone and VS 2026
          # Enterprise ships in its place — restricting to [17.0,18.0)
          # would fail there.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -version "[17.0,19.0)" -prerelease -products "*" -property installationPath | Select-Object -First 1
          if (-not $vs) { throw "vswhere did not find a VS 2022 or VS 2026 install" }
          $candidates = @(
            "$vs\MSBuild\Microsoft\VisualStudio\v17.0\AppxPackage\",
            "$vs\MSBuild\Microsoft\VisualStudio\v18.0\AppxPackage\"
          )
          $found = $candidates | Where-Object { Test-Path (Join-Path $_ "Microsoft.Build.Packaging.Pri.Tasks.dll") } | Select-Object -First 1
          if (-not $found) { throw "Microsoft.Build.Packaging.Pri.Tasks.dll not found" }
          echo "AppxMSBuildToolsPath=$found" >> $env:GITHUB_ENV

      - name: Publish Windows app (self-contained)
        working-directory: platforms/windows/Dimmy.Windows
        run: dotnet publish Dimmy.Windows.csproj -c Release -r win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -p:SelfContained=true "-p:AppxMSBuildToolsPath=$env:AppxMSBuildToolsPath" -o publish

      - name: Prepare distribution
        shell: pwsh
        run: |
          $pubDir = "platforms/windows/Dimmy.Windows/publish"
          Copy-Item "D:\t\release\dimmy_lib.dll" "$pubDir/"
          # onnxruntime — Parakeet ort path's runtime dependency. Same
          # rationale as release.yml: dotnet publish dropped its output
          # in publish/, so we co-locate the native DLLs there. Without
          # these two lines the Velopack staging bundle ships without
          # onnxruntime.dll → ort panics at runtime (see "Fetch
          # onnxruntime" step above for full incident note).
          $ortLib = "core/target/onnxruntime-win-x64-1.22.0/lib"
          Copy-Item "$ortLib/onnxruntime.dll" "$pubDir/"
          Copy-Item "$ortLib/onnxruntime_providers_shared.dll" "$pubDir/"
          # Bundle the dimmy-mcp MCP server next to the app exe (Win parity
          # with the macOS .app Resources copy) so the INSTALLED app exposes
          # meetings to Claude Code / Claude Desktop. Self-contained Rust stdio
          # binary; no whisper/vulkan, so no MSVC 14.50 gate needed. Relies on
          # the same System32 VC redist Velopack installs via --framework.
          cargo build --release --manifest-path mcp-server/Cargo.toml
          Copy-Item "mcp-server/target/release/dimmy-mcp.exe" "$pubDir/" -Force
          Get-ChildItem "$pubDir" -Filter "*.pdb" -Recurse | Remove-Item -ErrorAction SilentlyContinue

      # The self-hosted `sign-windows` job below consumes this to Authenticode-
      # sign the Dimmy binaries with the Certum cloud cert and re-pack signed.
      - name: Upload unsigned publish dir (for self-hosted signing)
        uses: actions/upload-artifact@v4
        with:
          name: win-publish
          path: platforms/windows/Dimmy.Windows/publish
          retention-days: 1

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Package with Velopack (Dimmy-Staging packId, staging channel)
        shell: pwsh
        run: |
          $version = "${{ needs.create-release.outputs.version }}"
          $pubDir = (Resolve-Path "platforms/windows/Dimmy.Windows/publish").Path
          # packId=Dimmy-Staging produces install dir %LOCALAPPDATA%\Dimmy-Staging,
          # Start menu entry "Dimmy Staging", uninstall entry "Dimmy Staging" —
          # all distinct from the prod "Dimmy" install on the same machine.
          # --channel staging tags the release manifest so a future Velopack
          # update on a staging install never picks up a prod build.
          vpk pack --packId Dimmy-Staging --packVersion $version --packDir "$pubDir" --mainExe Dimmy.Windows.exe --icon "platforms/windows/Dimmy.Windows/Assets/dimmy.ico" --framework "vcredist143-x64" --channel staging --outputDir platforms/windows/velopack-output

      - name: List Velopack output (for log forensics)
        shell: pwsh
        run: Get-ChildItem platforms/windows/velopack-output/ | Format-Table Name, Length

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            platforms/windows/velopack-output/Dimmy-Staging-*Setup.exe
            platforms/windows/velopack-output/Dimmy-Staging-*Portable.zip
            platforms/windows/velopack-output/Dimmy-Staging-*-full.nupkg
            platforms/windows/velopack-output/releases*.json

  # ── Full Authenticode signing on a self-hosted runner (Konrad's PC) ──
  # The Certum "Code Signing in the cloud" key is non-exportable and has no
  # headless login, so signing happens on the self-hosted runner (label
  # `dimmy-sign`) where a logged-in SimplySign Desktop session exposes the key
  # to signtool. PREREQ at release time: open SimplySign Desktop + log in.
  #
  # SAFE BY DESIGN: `build-windows` already uploaded the (unsigned) Velopack
  # assets, so if this job is skipped or fails (e.g. SimplySign not logged in)
  # the release still has working assets — just re-run this job after logging
  # in. On success it signs every Dimmy-owned binary, re-packs with
  # --signParams, and overwrites the release assets with signed ones.
  sign-windows:
    name: Sign Windows (self-hosted Certum)
    needs: [create-release, build-windows]
    runs-on: [self-hosted, dimmy-sign]
    steps:
      - uses: actions/checkout@v5

      - name: Download unsigned publish dir
        uses: actions/download-artifact@v4
        with:
          name: win-publish
          path: platforms/windows/Dimmy.Windows/publish

      - name: Sign Dimmy binaries + re-pack signed + overwrite assets
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $thumb = "DD0AD19CFEB75B2D02A58363CA17CF0ED16BFDB4"
          $ts = "http://time.certum.pl/"

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found (Windows SDK missing on runner)." }
          $pubDir = (Resolve-Path "platforms/windows/Dimmy.Windows/publish").Path

          # Sign only Dimmy-owned binaries (Microsoft's runtime DLLs are already
          # signed — re-signing them would be pointless and replace MS's sig).
          $mine = @("Dimmy.Windows.exe", "Dimmy.Windows.dll", "dimmy_lib.dll", "dimmy-mcp.exe")
          foreach ($name in $mine) {
            $f = Join-Path $pubDir $name
            if (Test-Path $f) {
              Write-Host "Signing $name"
              & $signtool.FullName sign /sha1 $thumb /fd sha256 /tr $ts /td sha256 $f
              if ($LASTEXITCODE -ne 0) { throw "Sign failed on $name. Is SimplySign Desktop logged in?" }
            }
          }

          # Re-pack with Velopack, signing the Setup/Update/main wrapper exes too.
          dotnet tool install -g vpk 2>$null
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          $version = "${{ needs.create-release.outputs.version }}"
          if (Test-Path velopack-output) { Remove-Item velopack-output -Recurse -Force }
          vpk pack --packId Dimmy-Staging --packVersion $version --packDir "$pubDir" --mainExe Dimmy.Windows.exe --icon "platforms/windows/Dimmy.Windows/Assets/dimmy.ico" --framework "vcredist143-x64" --channel staging --signParams "/sha1 $thumb /fd sha256 /tr $ts /td sha256" --outputDir velopack-output
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed." }

          # Overwrite the release assets with the signed ones.
          $tag = "${{ github.ref_name }}"
          $files = Get-ChildItem velopack-output -Recurse -Include "Dimmy-Staging-*Setup.exe","Dimmy-Staging-*Portable.zip","Dimmy-Staging-*-full.nupkg","releases*.json" |
            ForEach-Object { $_.FullName }
          if (-not $files) { throw "No Velopack output to upload." }
          gh release upload $tag $files --repo "$env:GITHUB_REPOSITORY" --clobber
          Write-Host "=== Signed Windows assets uploaded to $tag ==="
