name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libxdo-dev

      - name: Version consistency check
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: |
          CARGO_VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          TAURI_VER=$(grep '"version"' tauri.conf.json | head -1 | sed 's/.*"\([0-9][^"]*\)".*/\1/')
          echo "Cargo.toml: $CARGO_VER"
          echo "tauri.conf.json: $TAURI_VER"
          if [ "$CARGO_VER" != "$TAURI_VER" ]; then
            echo "::error::Version mismatch: Cargo.toml=$CARGO_VER vs tauri.conf.json=$TAURI_VER"
            exit 1
          fi

      - name: Format check
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Tests
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo test

      - name: Build
        working-directory: src-tauri
        run: cargo build
